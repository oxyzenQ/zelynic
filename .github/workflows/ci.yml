# =============================================================================
# CI Pipeline — runs on every push and PR to main
# =============================================================================

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Single source of truth for the Rust toolchain version.
  # Keep in sync with rust-toolchain.toml + Cargo.toml rust-version
  # (enforced by scripts/check-rust-version-sync.sh; bump via
  # scripts/rust-version-to.sh).
  RUST_VERSION: "1.98.1"
  # NIGHT-strict-2: strict CI build — warning = failure. Every cargo
  # build / test / release build in this workflow denies rustc
  # warnings (clippy already runs -D warnings explicitly). Registry
  # dependencies stay warning-capped (cargo passes --cap-lints allow
  # for non-workspace crates), so only workspace-local code can fail
  # the build.
  RUSTFLAGS: "-D warnings"

jobs:
  changes:
    # Runner pinned to ubuntu-24.04, never a floating ubuntu-latest:
    # the label migrates to Ubuntu 26 on 2026-10-19 and would silently
    # move the build environment (actions/runner-images#14748); OS
    # upgrades here are deliberate, matrix-tested changes.
    runs-on: ubuntu-24.04
    outputs:
      core: ${{ steps.detect.outputs.core }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, NIGHT-hunt-20 SHA pin
        with:
          fetch-depth: 0
      - name: Detect core file changes
        id: detect
        # NIGHT-hunt-14 hardening: event context reaches the script only
        # through environment variables, never via direct ${{ }}
        # interpolation inside run: — the canonical defense-in-depth
        # against the script-injection class even though these fields
        # are git-controlled SHAs today.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
            HEAD="$PR_HEAD"
          else
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)
            HEAD="$HEAD_SHA"
          fi
          FILES=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || git ls-files)
          CORE_PATTERN='\.(rs|toml|py)$|Cargo\.lock$|^build\.rs$|^rust-toolchain|^scripts/|^\.cargo/|^ebpf/'
          if echo "$FILES" | grep -qE "$CORE_PATTERN"; then
            echo "core=true" >> "$GITHUB_OUTPUT"
          else
            echo "core=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    name: Lint & Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, NIGHT-hunt-20 SHA pin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      # NIGHT-improve-1 phase 3: clippy --all-features compiles the
      # ebpf-feature build, which drives the nested pure-Rust eBPF
      # build in build.rs — the dated nightly pin (ebpf/
      # rust-toolchain.toml) and bpf-linker must be present.
      - name: Install eBPF nightly toolchain (dated pin)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: nightly-2026-09-18
          components: rust-src

      # NIGHT-improve-11: the pinned bpf-linker install is shared by
      # four CI jobs (this one, ebpf-build below, release.yml, and
      # maintenance.yml) — one script, one place to bump the pin.
      - name: Install bpf-linker 0.11.1 (prebuilt static musl)
        run: bash scripts/install-bpf-linker.sh

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, NIGHT-hunt-20 SHA pin
        with:
          # ebpf/target included (NIGHT-improve-11): clippy
          # --all-features drives the nested eBPF build, which compiles
          # into the detached crate's own target tree — caching only
          # the root target/ rebuilt it from scratch on every run.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ebpf/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked

      # Scanner binary pinned, advisory DB still refreshes every run
      # (NIGHT-hunt-20): red means a new advisory, never a new release.
      - name: Install cargo-deny (pinned 0.20.2)
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check dependency policies
        run: cargo deny check all

      - name: Run repository policy check
        run: python3 scripts/check-policy.py

      - name: Supermassive harness engine self-test
        run: python3 scripts/supermassive-test.py --self-test

      - name: Verify release build
        run: cargo build --release --locked

  ebpf-build:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    name: eBPF Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, NIGHT-hunt-20 SHA pin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: ${{ env.RUST_VERSION }}

      # NIGHT-improve-1 phase 3: the BPF objects are now built by the
      # pure-Rust ebpf/ crate (aya-ebpf, nightly + bpf-linker) — the
      # clang/libbpf-dev toolchain is gone from this job.
      - name: Install eBPF nightly toolchain (dated pin)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: nightly-2026-09-18
          components: rust-src, rustfmt

      # NIGHT-improve-11: the pinned bpf-linker install is shared by
      # four CI jobs (check, ebpf-build, release, maintenance) — one
      # script, one place to bump the pin.
      - name: Install bpf-linker 0.11.1 (prebuilt static musl)
        run: bash scripts/install-bpf-linker.sh

      # NIGHT-improve-11: this matrix job previously built the whole
      # ebpf/ crate from scratch on every run — no cache step at all,
      # even though it is the job that compiles the BPF objects twice
      # per push (ubuntu-22.04 + ubuntu-24.04). Same cache contract
      # as the check job, with the matrix OS in the key so the two
      # runners never cross-restore each other's target trees.
      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, NIGHT-hunt-20 SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ebpf/target
          key: ${{ runner.os }}-ebpf-${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ebpf-${{ matrix.os }}-cargo-
            ${{ runner.os }}-ebpf-cargo-

      - name: Check eBPF Rust formatting (rustfmt, nightly pin)
        run: cd ebpf && cargo fmt --all -- --check

      - name: Build pure-Rust eBPF objects (direct crate build)
        run: cargo build --release --locked
        working-directory: ebpf

      - name: Verify eBPF objects exist
        run: |
          test -f ebpf/target/bpfel-unknown-none/release/zelynic-observer
          test -f ebpf/target/bpfel-unknown-none/release/zelynic-limiter
          echo "OK: pure-Rust eBPF objects built successfully"

      - name: Build Rust with ebpf feature
        run: cargo build --features ebpf --locked

      - name: Run tests with ebpf feature
        run: cargo test --features ebpf --locked

  gatekeepers:
    # NIGHT-hunt-23 class closure (owner-approved): run the ENTIRE
    # gate-keepers script wholesale instead of mirroring individual
    # sections CI-side. The incremental-mirror pattern is exactly what
    # let gates rot silently: headers, permissions, LOC, disclaimer,
    # version-sync, test-tree, TOML, emoji, bash -n, and shellcheck had
    # no CI mirror at all — a gate that only runs where tools happen to
    # be installed is not a gate (shellcheck had never executed
    # anywhere until this job's local preflight, and it found real
    # drift). One step here executes every current section AND every
    # section yet to be added to the script, with the full tool set
    # installed — the rot class stays closed permanently, no per-gate
    # CI wiring ever again.
    name: Gate-keepers (wholesale)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, NIGHT-hunt-20 SHA pin

      # Tool pins make findings meaningful: a red wholesale run means
      # the tree drifted, never that a linter released overnight. The
      # same pins ran the local preflight before this job landed
      # (16/16 sections, first full execution in repo history).
      - name: Install shellcheck (pinned v0.10.0)
        run: |
          curl -sL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          tar -xf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m755 /tmp/shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version | head -2

      - name: Install shfmt (pinned v3.10.0)
        run: |
          curl -sSfL -o /tmp/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          sudo install -m755 /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version

      - name: Install yamllint, codespell, actionlint (pinned)
        run: |
          python3 -m pip install --user yamllint==1.38.0 codespell==2.4.3
          curl -sL -o /tmp/actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          sudo install -m755 /tmp/actionlint /usr/local/bin/actionlint
          yamllint --version
          codespell --version
          actionlint --version

      # Gate section 12 (ebpf rustfmt) resolves the dated nightly pin
      # from ebpf/rust-toolchain.toml; installing the same pin up front
      # keeps the wholesale run off the rustup auto-install path (exact
      # parity with the ebpf-build job's toolchain step).
      - name: Install eBPF nightly toolchain (dated pin)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: nightly-2026-09-18
          components: rust-src, rustfmt

      # The wholesale run: all 16 sections (bash -n, shellcheck, shfmt,
      # yamllint, actionlint, TOML, codespell, headers, permissions,
      # emoji, LOC, version sync, disclaimer, ebpf rustfmt, test-tree,
      # language) in one shot — exit code 0 or the push is blocked.
      - name: Run gate-keepers.sh (wholesale)
        run: bash scripts/gate-keepers.sh
