# =============================================================================
# CI Pipeline — runs on every push and PR to main
# =============================================================================
#
# NIGHT-improve-13 (cosmostrix CI lineage): the `paths:` filter is
# the single trigger gate — the former `changes` job (a full
# fetch-depth: 0 clone plus a git-diff regex that re-implemented
# what GitHub's native path filter already does) is gone. Builds
# are Rust-surface-triggered; the non-code gates (codespell, shells,
# headers, permissions, ruff, language, ...) live in
# gate-keepers.yml, which runs on EVERY push unfiltered — a
# docs-only change never skips the gates that police it.
#
# NIGHT-improve-21 (cosmostrix filter discipline): the filter is now
# scoped per CONSUMER, not per file-type glob. The old set matched
# '**/*.py', 'scripts/**', and '**/*.toml' — so a comment tweak in
# benchmarking.py, a docstring in uninstall.sh, or a line in
# .ruff.toml bought the full Rust matrix (check + gnu-dynamic + the
# musl twins). The set below is exactly what this workflow's jobs
# compile or execute: the Rust trees, the cargo manifests, the
# policy file the deny step reads, and the three scripts its steps
# run. Everything else is gate-keepers territory — which runs on
# every push anyway, so no change ever goes unpoliced, it just
# stops buying forty minutes of compile time it cannot affect.

# NIGHT-improve-22 (cosmostrix naming lineage): every workflow in
# this repo carries its Dragon Guard name — the run list reads as
# one guarded estate, not a pile of generic labels (codeql.yml set
# the precedent; this file was the last plain "CI").
name: Dragon Guard - CI

on:
  push:
    branches: ["main"]
    paths:
      # NIGHT-improve-21: the Rust + tooling surface this workflow
      # COMPILES, plus the exact scripts its steps EXECUTE — scoped
      # per consumer (cosmostrix filter discipline), see the header.
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'build.rs'
      - 'rust-toolchain*'
      - '.cargo/**'
      - 'ebpf/**'
      - 'scripts/check-policy.py'
      - 'scripts/supermassive-test.py'
      - 'scripts/supermassive-test-v2.py'
      - 'scripts/install-bpf-linker.sh'
  pull_request:
    branches: ["main"]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'build.rs'
      - 'rust-toolchain*'
      - '.cargo/**'
      - 'ebpf/**'
      - 'scripts/check-policy.py'
      - 'scripts/supermassive-test.py'
      - 'scripts/supermassive-test-v2.py'
      - 'scripts/install-bpf-linker.sh'

# Least privilege (cosmostrix contract): every job in this workflow
# only reads the repository.
permissions:
  contents: read

# Rapid pushes to the same ref cancel the superseded run instead of
# queueing a duplicate full build (cosmostrix stability pattern).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Single source of truth for the Rust toolchain version.
  # Keep in sync with rust-toolchain.toml + Cargo.toml rust-version
  # (enforced by scripts/check-rust-version-sync.sh; bump via
  # scripts/rust-version-to.sh).
  RUST_VERSION: "1.98.1"
  # NIGHT-strict-2: strict CI build — warning = failure. Every cargo
  # build / test / release build in this workflow denies rustc
  # warnings (clippy already runs -D warnings explicitly). Registry
  # dependencies stay warning-capped (cargo passes --cap-lints allow
  # for non-workspace crates), so only workspace-local code can fail
  # the build.
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, NIGHT-hunt-20 SHA pin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
          # NIGHT-improve-20: the musl target install moved to the
          # dedicated `musl` job below — this gnu job no longer
          # compiles any musl shape, so it no longer carries the
          # target (one shape, one job).

      # NIGHT-improve-1 phase 3: clippy --all-features compiles the
      # ebpf-feature build, which drives the nested pure-Rust eBPF
      # build in build.rs — the dated nightly pin (ebpf/
      # rust-toolchain.toml) and bpf-linker must be present.
      - name: Install eBPF nightly toolchain (dated pin)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: nightly-2026-09-18
          components: rust-src

      # NIGHT-improve-11: the pinned bpf-linker install is shared by
      # four CI jobs (this one, gnu-dynamic below, release.yml, and
      # maintenance.yml) — one script, one place to bump the pin.
      - name: Install bpf-linker 0.11.1 (prebuilt static musl)
        run: bash scripts/install-bpf-linker.sh

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, NIGHT-hunt-20 SHA pin
        with:
          # ebpf/target included (NIGHT-improve-11): clippy
          # --all-features drives the nested eBPF build, which compiles
          # into the detached crate's own target tree — caching only
          # the root target/ rebuilt it from scratch on every run.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ebpf/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked

      # Scanner binary pinned, advisory DB still refreshes every run
      # (NIGHT-hunt-20): red means a new advisory, never a new release.
      - name: Install cargo-deny (pinned 0.20.2)
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check dependency policies
        run: cargo deny check all

      - name: Run repository policy check
        run: python3 scripts/check-policy.py

      - name: Supermassive harness engine self-test
        run: python3 scripts/supermassive-test.py --self-test

      # NIGHT-improve-23: the v2 harness (daily-use E2E simulation)
      # self-tests the same way — engine import, endpoint registry,
      # worker command contract — with no root and no network, so the
      # realnet lane's plumbing is proven on every push even though
      # the root matrix itself runs on the owner's machines.
      - name: Supermassive v2 harness engine self-test
        run: python3 scripts/supermassive-test-v2.py --self-test

      # NIGHT-boost-2: the plain `cargo build --release` verify is
      # retired — the release page never shipped a plain-release
      # gnu binary, so the shape it verified was one nobody
      # distributes. The verification now compiles the three gnu pro
      # profiles (native + v3 + v4) via the .cargo/config.toml
      # aliases: the v3/v4 pair reproduces the tiers release.yml
      # distributes, native covers the local dev contract — every
      # build with the ebpf feature, --locked, and its own profile
      # dir (no clobbering target/release).
      #
      # RUSTFLAGS composition: each line leads with -D warnings
      # (NIGHT-strict-2) and carries the full baseline set verbatim —
      # a set env RUSTFLAGS silently shadows every config rustflags
      # (the workflow-level -D warnings would eat the alias's
      # target-cpu flags; release.yml composes its matrix flags the
      # same way). The alias invocation itself is still the contract
      # under test: profile, feature set, and the ZELYNIC_BUILD
      # label all come from the alias definition in
      # .cargo/config.toml, so CI proves the owner-facing
      # reproduction path works, not a hand-copied variant of it.
      #
      # v4 executes nothing: AVX-512 runners are not guaranteed, so
      # the artifact is verified via its embedded build label — the
      # same no-SIGILL contract release.yml carries for v4.
      - name: 'Verify pro builds (gnu: native + v3 + v4)'
        run: |
          set -euo pipefail
          RUSTFLAGS="-D warnings -C target-cpu=native" cargo pro-native-gnu --locked
          ./target/pro-native-gnu/zelynic -V
          RUSTFLAGS="-D warnings -C target-cpu=x86-64-v3" cargo pro-linux-gnu-v3 --locked
          ./target/pro-linux-gnu-v3/zelynic -V | grep -F "Build: local-linux-gnu-v3"
          RUSTFLAGS="-D warnings -C target-cpu=x86-64-v4" cargo pro-linux-gnu-v4 --locked
          grep -aF "local-linux-gnu-v4" ./target/pro-linux-gnu-v4/zelynic

  # NIGHT-improve-20: musl CI parity — the owner directive. The gnu
  # surface gets fmt + clippy + tests + the pro build verification on
  # every push; the musl static twin deserved the same contract,
  # not a single release-shape compile stapled to the gnu job. The
  # matrix pins the kernel span the release page promises: 5.15
  # (ubuntu-22.04, the oldest hosted runner with a 5.x kernel — the
  # LTS floor) through 6.8+ (ubuntu-24.04). clippy runs with
  # --target x86_64-unknown-linux-musl because lints are
  # target-conditional (libc type layouts differ — the statfs f_type
  # incident below was a clippy-visible shape). Tests run the musl
  # binary natively on the glibc runner, proving the static
  # artifact executes. The ebpf feature graph is compiled in the
  # debug and pro builds, so the nightly pin + bpf-linker
  # mirror the other compile jobs.
  #
  # NIGHT-boost-2: the plain `cargo build --release` verify is
  # retired — no release package ever shipped that shape. The
  # verification now compiles the three musl pro profiles (native,
  # v3, v4) via the .cargo/config.toml aliases: the v3/v4 pair are
  # the tiers the release page distributes, native rounds out the
  # local dev contract. timeout raised 30 -> 40 minutes: three
  # release-tier musl builds per matrix entry, and a cold run
  # compiles each profile's dep tree (target/<profile>/ is
  # per-profile and never shares artifacts).
  musl:
    name: Musl Static Twin (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 = kernel 5.15 (the 5.x LTS floor),
        # ubuntu-24.04 = kernel 6.8+ (latest hosted).
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, NIGHT-hunt-20 SHA pin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
          targets: x86_64-unknown-linux-musl

      # The ebpf-feature builds below drive the nested pure-Rust
      # eBPF build in build.rs — the dated nightly pin
      # (ebpf/rust-toolchain.toml) and bpf-linker must be present,
      # same contract as the check and gnu-dynamic jobs.
      - name: Install eBPF nightly toolchain (dated pin)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: nightly-2026-09-18
          components: rust-src

      - name: Install bpf-linker 0.11.1 (prebuilt static musl)
        run: bash scripts/install-bpf-linker.sh

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, NIGHT-hunt-20 SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ebpf/target
          key: ${{ runner.os }}-musl-${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-musl-${{ matrix.os }}-cargo-
            ${{ runner.os }}-musl-cargo-

      # Lint parity: the gnu check job's clippy step, aimed at the
      # musl target — target-conditional code paths (libc structs,
      # cfg(target_env = "musl") branches) get analyzed, not just
      # compiled.
      - name: Clippy (musl target)
        run: cargo clippy --all-targets --all-features --target x86_64-unknown-linux-musl -- -D warnings

      # Test parity: the musl test binaries are static executables,
      # so they run natively on the glibc runner — the test suite
      # executes inside the very artifact shape the release ships.
      - name: Run tests (musl target)
        run: cargo test --locked --target x86_64-unknown-linux-musl

      # Debug-build parity (the gnu-dynamic job's debug contract):
      # the debug binary with the ebpf feature, then executed — a
      # debug shape that compiles but cannot even print -V is not a
      # build, it is a liability.
      - name: Verify debug build (musl target)
        run: |
          cargo build --locked --target x86_64-unknown-linux-musl --features ebpf
          ./target/x86_64-unknown-linux-musl/debug/zelynic -V

      # Release parity (NIGHT-boost-2): the pro profiles replace the
      # plain release verify — no package ever shipped a plain
      # `--release` musl binary. The v3/v4 pair reproduces the tiers
      # the release page distributes (release.yml matrix builds the
      # same baselines), native rounds out the local dev contract
      # (.cargo/config.toml aliases). The v11.0.0-alpha.1 E0308
      # lesson (statfs f_type is u64 on musl, i64 on glibc — the
      # release tag was the first musl compile in CI history) applies
      # to every tier here: a musl-only type error must surface on
      # push, never first at tag time. Every build executes its -V
      # gate (a static musl executable runs natively on the glibc
      # runner) except v4: AVX-512 runners are not guaranteed, so
      # the artifact is verified via its embedded build label — the
      # same no-SIGILL contract release.yml carries for v4.
      #
      # RUSTFLAGS composition: each line leads with -D warnings
      # (NIGHT-strict-2) and carries the full baseline set verbatim —
      # a set env RUSTFLAGS silently shadows every config rustflags
      # (the workflow-level -D warnings would eat the alias's
      # target-cpu/crt-static flags; release.yml composes its flags
      # the same way). The alias invocation itself is still the
      # contract under test: profile, feature set, target, and the
      # ZELYNIC_BUILD label all come from the alias definition in
      # .cargo/config.toml.
      - name: 'Verify pro builds (musl: native + v3 + v4)'
        run: |
          set -euo pipefail
          RUSTFLAGS="-D warnings -C target-cpu=native -C target-feature=+crt-static" cargo pro-native-musl --locked
          ./target/x86_64-unknown-linux-musl/pro-native-musl/zelynic -V
          RUSTFLAGS="-D warnings -C target-cpu=x86-64-v3 -C target-feature=+crt-static" cargo pro-linux-musl-v3 --locked
          ./target/x86_64-unknown-linux-musl/pro-linux-musl-v3/zelynic -V | grep -F "Build: local-linux-musl-v3"
          RUSTFLAGS="-D warnings -C target-cpu=x86-64-v4 -C target-feature=+crt-static" cargo pro-linux-musl-v4 --locked
          grep -aF "local-linux-musl-v4" ./target/x86_64-unknown-linux-musl/pro-linux-musl-v4/zelynic

  # NIGHT-boost-2: the job id and display name renamed — the surface
  # this matrix compiles is the GNU DYNAMIC host build (the musl
  # twin's name mirror), not "just" the eBPF objects: it builds the
  # pure-Rust eBPF objects, then proves the gnu host crate against
  # them (debug build + tests with the ebpf feature). The eBPF
  # object build stays the job's unique step; the name now says
  # what the artifacts ARE (gnu, dynamically linked) like "Musl
  # Static Twin" says static.
  gnu-dynamic:
    name: Gnu Dynamic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, NIGHT-hunt-20 SHA pin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: ${{ env.RUST_VERSION }}

      # NIGHT-improve-1 phase 3: the BPF objects are now built by the
      # pure-Rust ebpf/ crate (aya-ebpf, nightly + bpf-linker) — the
      # clang/libbpf-dev toolchain is gone from this job. rust-src
      # is the only component the crate build needs: the fmt gate
      # moved wholesale to the Gate-keepers workflow
      # (NIGHT-improve-13), so rustfmt no longer rides this job's
      # nightly install (NIGHT-boost-2 sweep — the leftover
      # component install outlived the step it served).
      - name: Install eBPF nightly toolchain (dated pin)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: nightly-2026-09-18
          components: rust-src

      # NIGHT-improve-11: the pinned bpf-linker install is shared by
      # four CI jobs (check, gnu-dynamic, release, maintenance) — one
      # script, one place to bump the pin.
      - name: Install bpf-linker 0.11.1 (prebuilt static musl)
        run: bash scripts/install-bpf-linker.sh

      # NIGHT-improve-11: this matrix job previously built the whole
      # ebpf/ crate from scratch on every run — no cache step at all,
      # even though it is the job that compiles the BPF objects twice
      # per push (ubuntu-22.04 + ubuntu-24.04). Same cache contract
      # as the check job, with the matrix OS in the key so the two
      # runners never cross-restore each other's target trees.
      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, NIGHT-hunt-20 SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ebpf/target
          key: ${{ runner.os }}-gnu-dynamic-${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-gnu-dynamic-${{ matrix.os }}-cargo-
            ${{ runner.os }}-gnu-dynamic-cargo-

      # NIGHT-improve-13: the "Check eBPF Rust formatting" step that
      # used to run here is a duplicate of gate-keepers.sh section 12
      # (the exact same command, the same nightly pin) — one check,
      # one place: the Gate-keepers workflow runs it wholesale on
      # every push. This job keeps what only it can do: build the
      # objects on both matrix OSes and compile/test the ebpf-feature
      # graph against them.

      - name: Build pure-Rust eBPF objects (direct crate build)
        run: cargo build --release --locked
        working-directory: ebpf

      - name: Verify eBPF objects exist
        run: |
          test -f ebpf/target/bpfel-unknown-none/release/zelynic-observer
          test -f ebpf/target/bpfel-unknown-none/release/zelynic-limiter
          echo "OK: pure-Rust eBPF objects built successfully"

      - name: Build Rust with ebpf feature
        run: cargo build --features ebpf --locked

      - name: Run tests with ebpf feature
        run: cargo test --features ebpf --locked
