# =============================================================================
# CI Pipeline — runs on every push and PR to main
# =============================================================================
#
# NIGHT-improve-13 (cosmostrix CI lineage): the `paths:` filter is
# the single trigger gate — the former `changes` job (a full
# fetch-depth: 0 clone plus a git-diff regex that re-implemented
# what GitHub's native path filter already does) is gone. Builds
# are Rust-surface-triggered; the non-code gates (codespell, shells,
# headers, permissions, ruff, language, ...) live in
# gate-keepers.yml, which runs on EVERY push unfiltered — a
# docs-only change never skips the gates that police it.
#
# NIGHT-boost-9 (owner mandate, cosmostrix filter lineage): the
# scripts surface is ONE directory glob — 'scripts/**' — never a
# list of filenames. The per-consumer list NIGHT-improve-21 built
# (six exact script paths by the end) was precision with a drift
# tax: every new script a CI step consumed needed a manual filter
# edit, and a missed edit meant a silently skipped run — the change
# compiled fine locally and CI simply never saw it. One glob covers
# every current and future consumer, subdirectories included. The
# trade is honest and accepted: a docstring tweak in benchmarking.py
# now buys the full Rust matrix (check + gnu-dynamic + the musl
# twins). The owner's rule prefers robustness over trigger economy
# — gate-keepers.yml runs on every push unfiltered, and this
# workflow errs toward running more, not less.

# NIGHT-improve-22 (cosmostrix naming lineage): every workflow in
# this repo carries its Dragon Guard name — the run list reads as
# one guarded estate, not a pile of generic labels (codeql.yml set
# the precedent; this file was the last plain "CI").
name: Dragon Guard - CI

on:
  push:
    branches: ["main"]
    paths:
      # The Rust + tooling surface this workflow COMPILES, plus the
      # whole scripts/ tree its steps EXECUTE — one directory glob,
      # no hardcoded filenames (NIGHT-boost-9, see the header).
      #
      # NIGHT-hunt-34: the workflow file itself is in the filter —
      # an edit to the verify/build steps used to be linted by
      # gate-keepers (yamllint + actionlint) but never EXECUTED by
      # its own pipeline, going live untested until the next
      # Rust-touching push tripped over it (the exact
      # silently-skipped-run hazard NIGHT-boost-9 closed for
      # scripts/). A workflow that can change its own contract owes
      # itself a run; the same run-more-not-less rule applies.
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'build.rs'
      - 'rust-toolchain*'
      - '.cargo/**'
      - 'ebpf/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: ["main"]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'build.rs'
      - 'rust-toolchain*'
      - '.cargo/**'
      - 'ebpf/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'

# Least privilege (cosmostrix contract): every job in this workflow
# only reads the repository.
permissions:
  contents: read

# Rapid pushes to the same ref cancel the superseded run instead of
# queueing a duplicate full build (cosmostrix stability pattern).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Single source of truth for the Rust toolchain version.
  # Keep in sync with rust-toolchain.toml + Cargo.toml rust-version
  # (enforced by scripts/gates/check-rust-version-sync.sh; bump via
  # scripts/dev/rust-version-to.sh).
  RUST_VERSION: "1.98.1"
  # NIGHT-strict-2: strict CI build — warning = failure. Every cargo
  # build / test / release build in this workflow denies rustc
  # warnings (clippy already runs -D warnings explicitly). Registry
  # dependencies stay warning-capped (cargo passes --cap-lints allow
  # for non-workspace crates), so only workspace-local code can fail
  # the build.
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    # NIGHT-boost-11: the display name says what the job runs — since
    # NIGHT-boost-7 the whole gate IS `build.sh check-all -q`, so the
    # run list names the invocation, not a description of it. A
    # reader who wants the exact contract can copy the name straight
    # into a terminal and get the same gate locally.
    name: build.sh check-all -q
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, NIGHT-hunt-20 SHA pin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
          # NIGHT-improve-20: the musl target install moved to the
          # dedicated `musl` job below — this gnu job no longer
          # compiles any musl shape, so it no longer carries the
          # target (one shape, one job).

      # NIGHT-improve-1 phase 3: clippy --all-features compiles the
      # ebpf-feature build, which drives the nested pure-Rust eBPF
      # build in build.rs — the dated nightly pin (ebpf/
      # rust-toolchain.toml) and bpf-linker must be present.
      - name: Install eBPF nightly toolchain (dated pin)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: nightly-2026-09-18
          components: rust-src

      # NIGHT-improve-11: the pinned bpf-linker install is shared by
      # four CI jobs (this one, gnu-dynamic below, release.yml, and
      # maintenance.yml) — one script, one place to bump the pin.
      - name: Install bpf-linker 0.11.1 (prebuilt static musl)
        run: bash scripts/dev/install-bpf-linker.sh

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, NIGHT-hunt-20 SHA pin
        with:
          # ebpf/target included (NIGHT-improve-11): clippy
          # --all-features drives the nested eBPF build, which compiles
          # into the detached crate's own target tree — caching only
          # the root target/ rebuilt it from scratch on every run.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ebpf/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # cargo-deny must be on PATH before the quality gate below
      # runs: build.sh skips the deny check with a warning when the
      # subcommand is missing, so this pinned install is what keeps
      # the dependency gate live on CI (NIGHT-hunt-20: red means a
      # new advisory or policy violation, never a version drift).
      - name: Install cargo-deny (pinned 0.20.2)
        run: cargo install cargo-deny --version 0.20.2 --locked

      # NIGHT-boost-7 (owner mandate): the five hand-rolled steps
      # this job used to carry (Check formatting / Clippy / Run
      # tests / Check dependency policies / Run repository policy
      # check) were a line-by-line duplicate of scripts/build.sh
      # check-all — the canonical local gate. One contract, one
      # place: the job now runs the script itself, so the gate CI
      # enforces is the same invocation the owner runs before every
      # commit and the two can never drift apart (the
      # NIGHT-improve-13 dedup discipline, applied to the Rust-side
      # gate). -q is the essentials-only log shape: per-check OK
      # lines, warnings, failures — no banners. The version-string
      # anti-pattern check rides along (check-all runs it; the five
      # hand-rolled steps never did). ZELYNIC_JOBS lifts the
      # script's 75%-of-cores heat cap: an ephemeral runner has no
      # thermal budget to protect, and full parallelism is cheaper
      # runner-minutes.
      - name: Run quality gate (build.sh check-all)
        run: ZELYNIC_JOBS="$(nproc)" ./scripts/build.sh check-all -q

      - name: Supermassive harness engine self-test
        run: python3 scripts/supermassive/supermassive-test.py --self-test

      # NIGHT-improve-23 (refocused NIGHT-refactor-2, hardened
      # NIGHT-ultimate-3): the v2 harness (the survival battery)
      # self-tests the same way — engine import, stage surface, pty
      # mechanics, and the 83-case CLI depth table (well-formed,
      # every documented command/alias/flag touched) — with no root
      # and no network, so the batteries' plumbing is proven on every
      # push even though the root battery itself runs on the owner's
      # machines.
      - name: Supermassive v2 harness engine self-test
        run: python3 scripts/supermassive/supermassive-test-v2.py --self-test

      # NIGHT-boost-8: the claims-proof harness (no daemon, pure
      # eBPF, per-app, precision) self-tests the same engine-only
      # lane — the live proof itself needs root and runs on the
      # owner's machines (the supermassive realnet pattern).
      - name: Claims-proof harness engine self-test
        run: python3 scripts/bench/proof-claims.py --self-test

      # NIGHT-boost-2: the plain `cargo build --release` verify is
      # retired — the release page never shipped a plain-release
      # gnu binary, so the shape it verified was one nobody
      # distributes. The verification now compiles the three gnu pro
      # profiles (native + v3 + v4) via the .cargo/config.toml
      # aliases: the v3/v4 pair reproduces the tiers release.yml
      # distributes, native covers the local dev contract — every
      # build with the ebpf feature, --locked, and its own profile
      # dir (no clobbering target/release).
      #
      # NIGHT-boost-7 (SIGILL closure): every line now passes
      # --target x86_64-unknown-linux-gnu explicitly. Without it,
      # cargo runs a host-oriented build and RUSTFLAGS leaks into
      # the HOST artifacts — the proc-macro dylibs rustc itself
      # loads and executes mid-compile. On the 2026-09-22 run the
      # runner CPU had no AVX-512, so the v4-flagged thiserror-impl
      # dylib hit an illegal instruction inside rustc ("could not
      # compile aya-obj", signal 4) — while the musl v4 build
      # never crashed, because its alias already targets
      # x86_64-unknown-linux-musl. The explicit --target splits the
      # two worlds: RUSTFLAGS governs the target artifacts only,
      # proc-macros and build scripts compile flag-clean for the
      # host on any runner CPU. Artifact paths gain the triple
      # segment, mirroring the musl job's layout.
      #
      # RUSTFLAGS composition: each line leads with -D warnings
      # (NIGHT-strict-2) and carries the full baseline set verbatim —
      # a set env RUSTFLAGS silently shadows every config rustflags
      # (the workflow-level -D warnings would eat the alias's
      # target-cpu flags; release.yml composes its matrix flags the
      # same way). The alias invocation itself is still the contract
      # under test: profile, feature set, and the ZELYNIC_BUILD
      # label all come from the alias definition in
      # .cargo/config.toml, so CI proves the owner-facing
      # reproduction path works, not a hand-copied variant of it.
      #
      # v4 executes nothing: AVX-512 runners are not guaranteed, so
      # the artifact is verified via its embedded build label — the
      # same no-SIGILL contract release.yml carries for v4. Native
      # executes nothing either (NIGHT-hunt-34, preemptive): this job
      # caches target/ exactly like the musl twin, and a restored
      # target-cpu=native artifact was compiled on a PREVIOUS
      # runner's CPU — executing it on this run's silicon is the same
      # lottery that SIGILLed the musl ubuntu-22.04 job. Same fix,
      # same contract: the embedded build label. v3 keeps its
      # execution gate — the fixed v3 baseline is pool-portable
      # (every x86_64 runner since Haswell executes AVX2).
      - name: 'Verify pro builds (gnu: native + v3 + v4)'
        run: |
          set -euo pipefail
          RUSTFLAGS="-D warnings -C target-cpu=native" \
            cargo pro-native-gnu --locked --target x86_64-unknown-linux-gnu
          grep -aF "local-native-gnu" \
            ./target/x86_64-unknown-linux-gnu/pro-native-gnu/zelynic
          RUSTFLAGS="-D warnings -C target-cpu=x86-64-v3" \
            cargo pro-linux-amd64-v3-gnu --locked --target x86_64-unknown-linux-gnu
          ./target/x86_64-unknown-linux-gnu/pro-linux-amd64-v3-gnu/zelynic -V | grep -F "Build: local-linux-amd64-v3-gnu"
          RUSTFLAGS="-D warnings -C target-cpu=x86-64-v4" \
            cargo pro-linux-amd64-v4-gnu --locked --target x86_64-unknown-linux-gnu
          grep -aF "local-linux-amd64-v4-gnu" \
            ./target/x86_64-unknown-linux-gnu/pro-linux-amd64-v4-gnu/zelynic

  # NIGHT-improve-20: musl CI parity — the owner directive. The gnu
  # surface gets fmt + clippy + tests + the pro build verification on
  # every push; the musl static twin deserved the same contract,
  # not a single release-shape compile stapled to the gnu job. The
  # matrix once pinned the hosted kernel span (5.15 through 6.8+);
  # NIGHT-blade-3 retires the old-OS leg — the runner rides the
  # latest LTS only (ubuntu-24.04), because the REAL kernel span
  # (the 5.13 floor through the archive's latest head) is proven
  # per push inside the supermassive VM pair, a stronger contract
  # than a hosted 22.04 image ever was. clippy runs with
  # --target x86_64-unknown-linux-musl because lints are
  # target-conditional (libc type layouts differ — the statfs f_type
  # incident below was a clippy-visible shape). Tests run the musl
  # binary natively on the glibc runner, proving the static
  # artifact executes. The ebpf feature graph is compiled in the
  # debug and pro builds, so the nightly pin + bpf-linker
  # mirror the other compile jobs.
  #
  # NIGHT-boost-2: the plain `cargo build --release` verify is
  # retired — no release package ever shipped that shape. The
  # verification now compiles the three musl pro profiles (native,
  # v3, v4) via the .cargo/config.toml aliases: the v3/v4 pair are
  # the tiers the release page distributes, native rounds out the
  # local dev contract. timeout raised 30 -> 40 minutes: three
  # release-tier musl builds per matrix entry, and a cold run
  # compiles each profile's dep tree (target/<profile>/ is
  # per-profile and never shares artifacts).
  musl:
    name: Musl Static Twin (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # NIGHT-blade-3: the old-OS leg is retired — every base
        # runner uses the latest LTS (ubuntu-24.04). The kernel-span
        # role moved to the supermassive VM pair (the 5.13 floor
        # through the latest head, per push); the matrix shape stays
        # so a future span leg is one line away.
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, NIGHT-hunt-20 SHA pin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
          targets: x86_64-unknown-linux-musl

      # The ebpf-feature builds below drive the nested pure-Rust
      # eBPF build in build.rs — the dated nightly pin
      # (ebpf/rust-toolchain.toml) and bpf-linker must be present,
      # same contract as the check and gnu-dynamic jobs.
      - name: Install eBPF nightly toolchain (dated pin)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: nightly-2026-09-18
          components: rust-src

      - name: Install bpf-linker 0.11.1 (prebuilt static musl)
        run: bash scripts/dev/install-bpf-linker.sh

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, NIGHT-hunt-20 SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ebpf/target
          key: ${{ runner.os }}-musl-${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-musl-${{ matrix.os }}-cargo-
            ${{ runner.os }}-musl-cargo-

      # Lint parity: the gnu check job's clippy step, aimed at the
      # musl target — target-conditional code paths (libc structs,
      # cfg(target_env = "musl") branches) get analyzed, not just
      # compiled.
      - name: Clippy (musl target)
        run: cargo clippy --all-targets --all-features --target x86_64-unknown-linux-musl -- -D warnings

      # Test parity: the musl test binaries are static executables,
      # so they run natively on the glibc runner — the test suite
      # executes inside the very artifact shape the release ships.
      - name: Run tests (musl target)
        run: cargo test --locked --target x86_64-unknown-linux-musl

      # Debug-build parity (the gnu-dynamic job's debug contract):
      # the debug binary with the ebpf feature, then executed — a
      # debug shape that compiles but cannot even print -V is not a
      # build, it is a liability.
      - name: Verify debug build (musl target)
        run: |
          cargo build --locked --target x86_64-unknown-linux-musl --features ebpf
          ./target/x86_64-unknown-linux-musl/debug/zelynic -V

      # Release parity (NIGHT-boost-2): the pro profiles replace the
      # plain release verify — no package ever shipped a plain
      # `--release` musl binary. The v3/v4 pair reproduces the tiers
      # the release page distributes (release.yml matrix builds the
      # same baselines), native rounds out the local dev contract
      # (.cargo/config.toml aliases). The v11.0.0-alpha.1 E0308
      # lesson (statfs f_type is u64 on musl, i64 on glibc — the
      # release tag was the first musl compile in CI history) applies
      # to every tier here: a musl-only type error must surface on
      # push, never first at tag time. v3 executes its -V gate (a
      # static musl executable runs natively on the glibc runner, and
      # the fixed v3 baseline is pool-portable). v4 and native do
      # NOT execute:
      #
      # v4: AVX-512 runners are not guaranteed, so the artifact is
      # verified via its embedded build label — the no-SIGILL
      # contract release.yml carries.
      #
      # NIGHT-hunt-34 (the ubuntu-22.04 SIGILL closure): native now
      # skips execution for the same class of reason PLUS a cache
      # dimension the v4 shape does not have. target-cpu=native
      # bakes the BUILD machine's exact ISA into the artifact (deps
      # included), and the cache step above restores target/ across
      # runs — a warm run recompiles nothing (the observed flake run
      # "built" all three profiles in 21s flat), so the restored
      # native binary was compiled on a PREVIOUS runner's CPU.
      # GitHub pools heterogeneous silicon generations, so executing
      # a cached native artifact is a lottery: SIGILL the moment the
      # previous runner's CPU was newer than this one's. A retry
      # cannot fix this — it restores the SAME cache and only wins
      # if the fresh runner happens to land on new-enough silicon:
      # masking, not fixing, at runner-minute cost. The fix is the
      # v4 contract: verify via the embedded ZELYNIC_BUILD label.
      # The musl shape itself still executes natively three ways in
      # THIS job — the test binaries, the debug -V, and the v3 -V,
      # all baseline-codegen builds that are portable by
      # construction. The one gate retired is the one whose codegen
      # target is a variable, so executing it never proved anything
      # about any other machine anyway.
      #
      # RUSTFLAGS composition: each line leads with -D warnings
      # (NIGHT-strict-2) and carries the full baseline set verbatim —
      # a set env RUSTFLAGS silently shadows every config rustflags
      # (the workflow-level -D warnings would eat the alias's
      # target-cpu/crt-static flags; release.yml composes its flags
      # the same way). The alias invocation itself is still the
      # contract under test: profile, feature set, target, and the
      # ZELYNIC_BUILD label all come from the alias definition in
      # .cargo/config.toml.
      - name: 'Verify pro builds (musl: native + v3 + v4)'
        run: |
          set -euo pipefail
          RUSTFLAGS="-D warnings -C target-cpu=native -C target-feature=+crt-static" cargo pro-native-musl --locked
          grep -aF "local-native-musl" ./target/x86_64-unknown-linux-musl/pro-native-musl/zelynic
          RUSTFLAGS="-D warnings -C target-cpu=x86-64-v3 -C target-feature=+crt-static" \
            cargo pro-linux-amd64-v3-musl --locked
          ./target/x86_64-unknown-linux-musl/pro-linux-amd64-v3-musl/zelynic -V \
            | grep -F "Build: local-linux-amd64-v3-musl"
          RUSTFLAGS="-D warnings -C target-cpu=x86-64-v4 -C target-feature=+crt-static" \
            cargo pro-linux-amd64-v4-musl --locked
          grep -aF "local-linux-amd64-v4-musl" \
            ./target/x86_64-unknown-linux-musl/pro-linux-amd64-v4-musl/zelynic

  # NIGHT-boost-2: the job id and display name renamed — the surface
  # this matrix compiles is the GNU DYNAMIC host build (the musl
  # twin's name mirror), not "just" the eBPF objects: it builds the
  # pure-Rust eBPF objects, then proves the gnu host crate against
  # them (debug build + tests with the ebpf feature). The eBPF
  # object build stays the job's unique step; the name now says
  # what the artifacts ARE (gnu, dynamically linked) like "Musl
  # Static Twin" says static.
  gnu-dynamic:
    name: Gnu Dynamic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # NIGHT-blade-3: same retirement as the musl twin — the
        # latest LTS only; the kernel span is the supermassive
        # pair's job now.
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, NIGHT-hunt-20 SHA pin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: ${{ env.RUST_VERSION }}

      # NIGHT-improve-1 phase 3: the BPF objects are now built by the
      # pure-Rust ebpf/ crate (aya-ebpf, nightly + bpf-linker) — the
      # clang/libbpf-dev toolchain is gone from this job. rust-src
      # is the only component the crate build needs: the fmt gate
      # moved wholesale to the Gate-keepers workflow
      # (NIGHT-improve-13), so rustfmt no longer rides this job's
      # nightly install (NIGHT-boost-2 sweep — the leftover
      # component install outlived the step it served).
      - name: Install eBPF nightly toolchain (dated pin)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: nightly-2026-09-18
          components: rust-src

      # NIGHT-improve-11: the pinned bpf-linker install is shared by
      # four CI jobs (check, gnu-dynamic, release, maintenance) — one
      # script, one place to bump the pin.
      - name: Install bpf-linker 0.11.1 (prebuilt static musl)
        run: bash scripts/dev/install-bpf-linker.sh

      # NIGHT-improve-11: this matrix job previously built the whole
      # ebpf/ crate from scratch on every run — no cache step at all,
      # even though it is the job that compiles the BPF objects on
      # every push. Same cache contract
      # as the check job, with the matrix OS in the key so two
      # different runners would never cross-restore each other's
      # target trees.
      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, NIGHT-hunt-20 SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ebpf/target
          key: ${{ runner.os }}-gnu-dynamic-${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-gnu-dynamic-${{ matrix.os }}-cargo-
            ${{ runner.os }}-gnu-dynamic-cargo-

      # NIGHT-improve-13: the "Check eBPF Rust formatting" step that
      # used to run here is a duplicate of gate-keepers.sh section 12
      # (the exact same command, the same nightly pin) — one check,
      # one place: the Gate-keepers workflow runs it wholesale on
      # every push. This job keeps what only it can do: build the
      # objects on both matrix OSes and compile/test the ebpf-feature
      # graph against them.

      # NIGHT-boost-38: the v3 codegen flag is composed inline because
      # the workflow-level RUSTFLAGS env ("-D warnings") shadows the
      # [build] rustflags in ebpf/.cargo/config.toml — the same
      # env-beats-config rule the pro-build lines below already
      # document and handle the same way. Without it the LLVM BPF
      # backend cannot select the BPF_ATOMIC instructions the
      # SMP-safe token bucket (ebpf/src/math.rs) compiles down to,
      # and the build dies inside bpf-linker's instruction selection.
      - name: Build pure-Rust eBPF objects (direct crate build)
        run: RUSTFLAGS="-D warnings -C target-cpu=v3" cargo build --release --locked
        working-directory: ebpf

      - name: Verify eBPF objects exist
        run: |
          test -f ebpf/target/bpfel-unknown-none/release/zelynic-observer
          test -f ebpf/target/bpfel-unknown-none/release/zelynic-limiter
          echo "OK: pure-Rust eBPF objects built successfully"

      - name: Build Rust with ebpf feature
        run: cargo build --features ebpf --locked

      - name: Run tests with ebpf feature
        run: cargo test --features ebpf --locked
