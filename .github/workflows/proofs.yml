# SPDX-License-Identifier: AGPL-3.0-only OR Commercial
#
# The proofs lane (night-frontier-Z6, D1 — the proven datapath): the
# per-push verdict vehicle for the decidable instruments the proofs
# package carries. The included sources are #[path] wirings of
# ebpf/src's core-only law files — the same bytes the kernel object
# builds — so a theorem this lane verifies is a theorem the datapath
# runs (the fuzz harnesses' include law, one directory over).
#
# Trigger discipline (the owner's per-push budget, tightened by the
# night-fly-1 law, 2026-11-22): this lane is capped at 15 minutes
# wall — every job below carries timeout-minutes: 15, and 15 minutes
# is now the ESTATE CEILING, not a per-lane choice: no CI job may run
# past it, and no test lane may ride a schedule — every test runs
# trigger-by-commit on main. The solver-bound tier's night vehicle
# (proofs-night.yml) is RETIRED under that law, and the measurements
# had closed the question before it: the tier measured unfinished at
# ten minutes locally, undecided under bitwuzla/cvc5/z3, the hosted
# per-push job was cancelled at 59m44s still inside its first
# harness, and the nightly vehicle's single scheduled fire
# (run 44896512098, 2026-11-21) burned its full 300-minute cap and
# died CANCELLED with not one solver verdict printed — 300.6 minutes
# of runner for zero findings is the fatal shape the ceiling law
# exists to prevent. night-frontier-Z12 (2026-11-22) is the tier's
# RETURN, the proof-shape change the law itself named: lemma
# decomposition. The five wired-out theorems were re-born as
# decidable shapes — the fill-detect moved to the product side of
# the threshold (the split-multiply restructure, the doc
# contract's own predicate), the ring law split into the index
# lemma plus the residue-complete clock-range protocol law, the
# margin law quantified over the extracted comparator
# (during.rs's daily_active_rel) — and the lane now carries twelve
# theorems as one-harness matrix jobs, each inside the ceiling. The
# Z12 census holds the measurements: every pre-Z12 shape ground
# past every ceiling (the division-inversion and
# multiply-monotonicity circuit classes); every Z12 shape decides
# in seconds on the 2-CPU sandbox, the conservative bound against
# the hosted runners.
#
# The Z10 emission conformance theorem (night-frontier-Z10 rung 2)
# stays out by signed census: its engine-heap circuits OOM the 4 GB
# sandbox at every measured domain size (the record rides the
# harness doc and INNOVATIONS.md's D8 entry) — a hunt that flags
# its absence is re-reading that decision, not finding a gap.
#
# Three jobs, one checks list (proofs/ — the detached nested package,
# the ebpf crate's own detachment shape; the root manifest's
# dependency graph never sees these instruments):
#
#  * property:    proptest exhaustion of the pure cores' laws on the
#    pinned stable toolchain — thousands of shrinkable cases per law
#    per run. Fast, rootless, deterministic setup; a red is a real
#    counterexample with a shrunk witness. Since night-frontier-Z10
#    rung 2 the seat also carries the emission engine's own evidence:
#    src/terminal/diff.rs is #[path]-included into the proof crate
#    (the SAME bytes the flagship runs), so the diff pins, the guard
#    pins, and the 20,000-frame ghost-cell soak compile and run here
#    beside the sampled emission law (the no-corruption theorem's
#    per-push half).
#  * kani:        bounded model checking under the pinned kani release
#    — the for-all tier, twenty-six theorems strong since night-
#    frontier-Z17: the six original decidable laws (the decision
#    tables, the ladders, the memo word, the hint state machine,
#    the window domain, the consume sufficiency pair), the Z12
#    rebirths (the refill totality over an UNBOUNDED hostile rate,
#    the full hostile-state enforce path, the ring index lemma and
#    the residue-complete ring protocol law, the margin erosion
#    over the extracted comparator, the bounded flow-key
#    collector), and the Z17 interleaving theorems (the three
#    fidelity pins — the two-CPU segment model must reproduce the
#    kernel functions' bytes for all inputs — plus the eleven
#    single-step preservation theorems, the refill family split
#    per segment, whose induction carries every schedule length;
#    the forward-clock refill fidelity lemma is retired by
#    census, the record riding the research doc) — one harness
#    per matrix job so a
#    verdict is never lost to a sibling's budget and a grind can
#    never starve a sibling's verdict.
#  * loom-census: the signed census verdict's standing absence guard
#    — a per-push scan that fails the day the census basis moves (a
#    location-backed atomic lands outside the kernel crate's access
#    primitives, or a loom reference or dependency lands without a
#    standing lane). A guard, not a lane: no loom harness runs here
#    and none is faked — the honest shape the signed verdict demands.
#
# The loom instrument is censused, NOT adopted, by signed census
# verdict: loom 0.7.3 carries no location-backed atomics (no
# AtomicU64::from_ptr on its shim), while the datapath's CAS
# discipline IS location-backed by design — std AtomicU64::from_ptr
# over raw map-value memory, confined to the kernel crate's access
# primitives (the BPF ISA lesson math.rs carries). Expressing the
# protocol in loom would restructure the core-only law files for a
# test instrument — a model, not a proof of the bytes the kernel
# runs. The record rides the manifest comment, the Z6 audit, and
# DEPENDENCY_AUDIT.md's loom row. The verdict is not just recorded,
# it is standing-enforced: the loom-census job below re-reads the
# tree on every push — the discipline's scope and the absence both
# fail the push the day they move, instead of waiting for a reader
# to rediscover the drift.
#
# Check-name discipline (the owner's call, 2026-11-17): the checks
# list is the acquisition surface, so every check name carries its
# engine — "Kani bounded model checking (...)", "Proptest exhaustion
# (...)", "Loom concurrency census (...)" — the shape the Miri lane
# already sets ("Miri UB verification (...)"). A generic tier label
# hides the instrument a buyer is buying; the names move no step, no
# pin, no budget.

name: zelynic - Proofs

"on":
  push:
  pull_request:

permissions:
  contents: read

# One run per ref: a new push supersedes the previous run's verdict
# (the sibling's concurrency shape, every workflow in the estate).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  property:
    name: Proptest exhaustion (27 laws, 4096 cases each, stable, rootless)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # NIGHT-strict-2: the compile is warning-gated — registry
      # dependencies stay capped by cargo's --cap-lints, so only
      # first-party code can fail. Probe-verified on this crate: the
      # clean tree compiles and verifies under the flag.
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, NIGHT-hunt-20 SHA pin
        with:
          persist-credentials: false

      - name: Harden DNS (the poisoned-resolver defense)
        uses: ./.github/actions/harden-dns

      - name: Install Rust toolchain (the root pin, minimal profile)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # NIGHT-hunt-20 SHA pin
        with:
          toolchain: "1.98.1"

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, NIGHT-hunt-20 SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: proofs-property-${{ runner.os }}-${{ hashFiles('proofs/Cargo.lock') }}
          restore-keys: proofs-property-${{ runner.os }}-

      # The law files compile from ebpf/src under this package's own
      # crate — no root build, no nightly, no eBPF objects: the proof
      # lane's footprint is the instruments plus the law bytes.
      - name: Property exhaustion (proptest, 4096 cases per law)
        run: cd proofs && cargo test --locked

  kani:
    name: Kani bounded model checking (${{ matrix.harness }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # NIGHT-strict-2: the crate compilation under the kani driver is
      # warning-gated too. kani 0.68.0 carries no --deny-warnings flag;
      # RUSTFLAGS is the vehicle, and cargo passes it into the kani
      # driver's rustc invocation. Probe-verified both ways on this
      # crate: the clean tree verifies under the flag, a planted unused
      # variable fails the build naming the lint (exit 101).
      RUSTFLAGS: "-D warnings"
    # The for-all tier as a matrix of one-harness jobs (the return
    # shape the header records): a grind can never starve a sibling's
    # verdict, and every theorem's ceiling is the estate's own.
    strategy:
      fail-fast: false
      matrix:
        harness:
          # The six original decidable theorems (Z6).
          - consume_sufficiency_is_decisive_for_all_inputs
          - bucket_ladders_are_bounded_and_exact_for_all_inputs
          - hint_learn_holds_its_state_machine_for_all_sightings
          - memo_and_cache_table_hold_for_all_inputs
          - share_note_keeps_its_word_laws_for_all_inputs
          - window_domain_is_total_for_all_inputs
          # The night-frontier-Z12 rebirths (lemma decomposition).
          - refill_credits_is_total_and_domain_bounded_for_all_inputs
          - enforce_is_total_and_clamped_for_all_hostile_states
          - ring_index_is_bounded_for_all_clocks
          - ring_book_stamps_lawfully_over_clock_range
          - margin_erodes_both_edges_for_all_comparator_states
          - flow_key_bounded_is_total_for_all_window_shapes
          # The night-frontier-Z17 interleaving theorems (D17): the
          # fidelity pins first (the anti-gimmick instrument — the
          # machines must reproduce the kernel functions' bytes for
          # all inputs), then the single-step preservation theorems
          # (the induction that carries every schedule length).
          # The shipped belt's conservative family rides beside the
          # gated belt's full family — the pair IS the finding's
          # shape: what the bytes prove, and what the gated close
          # adds. The gated stamp's certificate
          # (every_gated_belt_segment_preserves_the_full_laws) is
          # the fix's model-side proof; the shipped belt's dead-law
          # falsification is pinned in the property lane (the
          # deterministic witnesses + the sampler's statistical pin),
          # never as a red harness here.
          - refill_actor_matches_kernel_refill_window_for_all_backward_clocks
          - consume_actor_matches_kernel_try_consume_for_all_inputs
          - debt_actors_match_kernel_debt_pair_for_all_inputs
          - every_refill_seed_clamp_segment_preserves_the_laws_for_all_states
          - every_refill_window_segment_preserves_the_laws_for_all_states
          - every_refill_credit_segment_preserves_the_laws_for_all_states
          - every_refill_cap_clamp_segment_preserves_the_laws_for_all_states
          - every_refill_frac_write_segment_preserves_the_laws_for_all_states
          - every_consume_segment_preserves_the_laws_for_all_states
          - every_draw_segment_preserves_the_laws_for_all_states
          - every_debt_segment_preserves_the_laws_for_all_states
          - every_shipped_belt_segment_preserves_the_conservative_laws_for_all_states
          - every_gated_belt_segment_preserves_the_full_laws_for_all_states
          - every_mutate_and_init_segment_preserves_the_laws_for_all_states
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, NIGHT-hunt-20 SHA pin
        with:
          persist-credentials: false

      - name: Harden DNS (the poisoned-resolver defense)
        uses: ./.github/actions/harden-dns

      - name: Install Rust toolchain (the root pin, minimal profile)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # NIGHT-hunt-20 SHA pin
        with:
          toolchain: "1.98.1"

      # The pinned kani release: cargo-kani is a thin wrapper whose
      # first run downloads the bundled verification toolchain. The
      # cache keys on the release version — a bump re-downloads by
      # construction.
      - name: Install kani-verifier (pinned release)
        run: cargo install --locked kani-verifier@0.68.0

      - name: Cache the kani toolchain bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, NIGHT-hunt-20 SHA pin
        with:
          path: ~/.kani
          key: kani-0.68.0-${{ runner.os }}

      - name: Kani first-time setup (bundled toolchain)
        run: cargo kani setup

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, NIGHT-hunt-20 SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: proofs-kani-${{ runner.os }}-${{ hashFiles('proofs/Cargo.lock') }}
          restore-keys: proofs-kani-${{ runner.os }}-

      # One harness per job (the matrix shape): the verdict is this
      # job's own, a grind can never starve a sibling's, and each
      # theorem's ceiling is the estate's own.
      - name: For-all theorem (one harness, one job)
        env:
          HARNESS: ${{ matrix.harness }}
        run: cd proofs && cargo kani --lib --harness "$HARNESS"

  loom-census:
    name: Loom concurrency census (absence guard, signed verdict)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, NIGHT-hunt-20 SHA pin
        with:
          persist-credentials: false

      - name: Harden DNS (the poisoned-resolver defense)
        uses: ./.github/actions/harden-dns

      # The signed census verdict (proofs/Cargo.toml's header, the Z6
      # audit, DEPENDENCY_AUDIT.md's loom row): loom is censused, NOT
      # adopted — loom 0.7.3 carries no location-backed atomics (no
      # AtomicU64::from_ptr on its shim), while the datapath's CAS
      # discipline IS location-backed by design: std AtomicU64::from_ptr
      # over raw map-value memory, confined to the kernel crate's
      # access primitives. Expressing the protocol in loom would
      # restructure the core-only law files for a test instrument — a
      # model, not a proof of the bytes the kernel runs. This guard
      # re-reads the tree every push and fails the day the signed
      # basis moves: the reopen trigger made mechanical, not archival.
      - name: Enforce the signed census verdict (the absence scan)
        run: |
          set -eu
          # The count-must-survive-a-no-match law: grep exits 1 on zero
          # matches and set -e would kill the scan, so every count rides
          # wc -l (exit 0 always) — the SC2126 style hint is disabled.
          # shellcheck disable=SC2126
          stray=$(grep -rEn 'Atomic[A-Za-z0-9]*::from_(ptr|mut|mut_ptr)' \
            --include='*.rs' src proofs fuzz test | wc -l)
          # shellcheck disable=SC2126
          sites=$(grep -rEn 'unsafe \{.*Atomic[A-Za-z0-9]*::from_(ptr|mut|mut_ptr)' \
            --include='*.rs' ebpf/src | wc -l)
          # shellcheck disable=SC2126
          loom_api=$(grep -rEn '\bloom::' \
            --include='*.rs' src ebpf proofs fuzz test | wc -l)
          # shellcheck disable=SC2126
          loom_dep=$(grep -E '^[[:space:]]*loom[[:space:]]*=' \
            Cargo.toml ebpf/Cargo.toml proofs/Cargo.toml fuzz/Cargo.toml \
            | wc -l)
          echo "location-backed atomic sites (the kernel access layer): ${sites}"
          echo "the same calls outside ebpf/src (must stay 0): ${stray}"
          echo "loom api references in code (must stay 0): ${loom_api}"
          echo "loom manifest dependencies (must stay 0): ${loom_dep}"
          if [ "${stray}" -gt 0 ]; then
            echo "FAIL: a location-backed atomic landed outside the kernel crate's"
            echo "access primitives - the pointer-cast discipline the census signed"
            echo "has moved. Restore the discipline or re-sign the census (the Z6 audit)."
            exit 1
          fi
          if [ "${loom_api}" -gt 0 ] || [ "${loom_dep}" -gt 0 ]; then
            echo "FAIL: loom entered the tree without a standing lane - the census"
            echo "NO (censused, NOT adopted) holds only while loom stays out."
            echo "Re-sign the census with a real lane, or remove the reference."
            exit 1
          fi
          echo "PASS: the signed census verdict holds - the CAS discipline stays"
          echo "pointer-cast over raw map-value memory inside the kernel access"
          echo "primitives, and loom stays out of the tree (the honest NO)."
