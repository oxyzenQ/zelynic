# =============================================================================
#
# NIGHT-hunt-35 (the owner's approved CI-budget call — the hunt-33
# open item, decided): the three root rig suites — scripts/depth/
# reload-test.sh, crash-recovery-test.sh, race-condition-test.sh —
# join the micro-VM battery on every leg. hunt-33 made every bash
# harness speak the engines' binary contract; this is the other half
# of that integration: the rigs the owner runs with sudo on nightpc
# now run inside the guest too, canonical invocations, --binary
# pinned, each its own MASS-RESULT row in the init's verdict relay.
# The one VM detail that shape needs: everything in the guest is a
# child of PID 1 — the cgroupfs ROOT — and strict-single rightly
# refuses a root-catch-all target, so the init moves each rig into
# a dedicated zelynic-rig-suite child cgroup first (the engines' own
# `echo $$ > cgroup.procs; exec` worker shape), which is also
# exactly the sibling-cgroup contract those suites were designed
# around (hunt-32's loopback blob-server heal). The budget pays for
# the added battery honestly: both envelopes' VM budgets ride +300 s
# (low 1800 -> 2100, best 1200 -> 1500) and the job's own
# timeout-minutes follows 45 -> 50, keeping the wedge-guard
# relationship (a wedged guest can never burn the job budget)
# intact. scripts/depth/** joins the trigger paths — the battery's
# contract now includes those files (the NIGHT-hunt-34 rule already
# on record: a workflow that can change its own contract owes
# itself a run).
#
# NIGHT-blade-12 (the owner's ask: "add support for CI supermassive
# test low/best with musl version"): the envelope pair grew a version
# dimension — {low, best} x {gnu, musl}, four legs — the static twin
# made a NAMED, titled matrix entry ("supermassive test - low specs
# (musl)") instead of the unnamed default it silently was. The gnu
# legs closed a real hole in their era: the gnu flagship had ZERO
# root E2E anywhere in the estate while it shipped. Both eras of the
# dimension are recorded here once: the gnu legs ran the FULL battery
# on a same-distro ubuntu:24.04 rootfs (a gnu binary is dynamically
# linked against its build host's glibc — the source-build deployment
# shape IS same-distro), and the musl legs kept the frozen
# ubuntu:22.04 userland (a static binary owes no userland anything —
# the improve-31 contract, carried verbatim).
#
# night-dragon-maintenance-6 — the MUSL-ONLY estate: the gnu/glibc
# packaging is retired outright (release matrix, cargo aliases, the
# setup.sh flagship — everything musl now), so the gnu legs' payload
# no longer exists and the version dimension collapses back to the
# two musl legs, {low, best} x musl. The kernel span and the envelope
# derivation are untouched. The rootfs assembly still writes
# /opt/zelynic/PAYLOAD-FLAVOR so the init's probe rows name the
# payload they ran.
#
# NIGHT-blade-3 (the owner's re-shape): the envelope pair's small
# end is renamed minimum -> low, everywhere the name lives (the
# matrix title, the profile key, the step names, the comments, and
# the docs that name the leg) — "low specs" says what the envelope
# IS (the little-host slice), not what it is the minimum OF. The
# same directive retires the hosted-runner old-OS legs: every base
# runner rides the latest LTS (ubuntu-24.04, pinned — never a
# floating label, the estate's anti-lottery contract), and ci.yml's
# ubuntu-22.04 matrix entries are gone (the hosted kernel-span
# role moved here long ago: the VM pair proves the REAL floor,
# jammy 5.15.0, and the latest head, per push). The deliberate
# old-OS surfaces INSIDE this workflow are the point of the test
# and stay: the low-specs leg's jammy 5.15.0 floor kernel (the
# documented minimum since night-netrunner-1 raised it off impish
# 5.13) and the ubuntu:22.04 rootfs container are testing
# internals, not runner choices. Historical quotes that name the
# old "minimum" title are the owner's own words from their era and
# read as history.
#
# =============================================================================
#
# Supermassive — the whole E2E on the micro-VM floor, two envelopes
# =============================================================================
#
# NIGHT-improve-31 (the CI half, the owner's ask translated: "all CI
# with E2E and kernel floor 5.15, now changed to only 2 new CI
# functions, the same as the E2E from setup start to stresstest
# finish, but using KVM like the CI kernel floor 5.15, titled
# 'supermassive test - low specs' and 'supermassive test - best
# specs'"): the E2E estate consolidates from two workflows into one
# job definition with two profiles. The retired pair — e2e.yml (the
# hosted-runner pipeline whose images no longer boot a 5.x kernel)
# and e2e-kernel-floor.yml (the probe-only micro-VM) — both live on
# here: the bring-up half runs on the runner (scripts/setup.sh
# --skip-heavy --musl, the exact owner-facing phase one, outside the
# VM because a low-specs guest cannot host a Rust toolchain
# build), and BOTH full batteries run INSIDE the micro-VM
# (scripts/ci/supermassive-init.sh as PID 1).
#
# NIGHT-improve-33 (the owner's re-shape: "for minimum specs have old
# kernel min 5.13 using ubuntu 21.04 impish indri or keep ubuntu
# jammy jellyfish 22.04; cpu core, ram, etc don't set fixed let
# dynamic; and for best specs using latest kernel") — three moves:
#
# 1. THE KERNEL SPAN, not a single floor. The low leg boots
#    the documented floor: jammy's 5.15.0-ABI LTS line — the
#    floor since night-netrunner-1 raised it off the retired
#    impish 5.13 lane (docs/KERNEL_COMPATIBILITY.md — "5.15.0 is
#    the oldest kernel zelynic supports"; 5.15 is the oldest
#    line the verified matrix still covers, and the impish
#    5.13 lane is gone with it). Jammy is a LIVE LTS: the
#    kernels come from the main archive (not the frozen
#    old-releases mirror the impish floor needed), dynamically
#    resolved to the newest 5.15.0-ABI jammy-updates point
#    release — no URL rot, no pinned ABI; the 5\.15\.0- anchor
#    deliberately excludes jammy's HWE 6.x images (those are
#    the best leg's jurisdiction). The best leg boots the
#    archive's LATEST kernel, resolved dynamically at run time: the
#    dists index names every live suite, each Release's Date+Codename
#    picks the two newest distinct codenames (the devel series and
#    the newest release — the pair guards a mid-transition devel
#    that is still a copy of the previous release's kernels; the
#    alias dedupe matters because apt refuses two names for one
#    archive, the "Conflicting distribution" refusal), and the
#    newest `linux-image-unsigned-<ver>-generic` across those
#    suites' main + -updates pockets wins via sort -V. Nothing is
#    pinned: when Ubuntu 27.04 ships, the resolver walks onto it
#    without a workflow edit. -proposed is deliberately excluded —
#    pre-release pockets are not "latest kernel", they are
#    next-maybe.
# 2. DYNAMIC ENVELOPES (the owner's "cpu core, ram, etc don't set
#    fixed let dynamic"): the matrix no longer pins smp/mem — the
#    boot step derives each envelope from the runner the job lands
#    on, so the pair scales with GitHub's hardware instead of
#    pinning yesterday's runner shape (the retired constants — 1
#    vCPU / 1536 MB and 4 vCPU / 8192 MB — were exactly the
#    ubuntu-24.04 runner of one era). Low specs: one quarter of
#    the cores (floored at 1 — a vCPU is the indivisible minimum)
#    and one eighth of the RAM (floored at 1024 MB — the battery's
#    own safety bound: the RAM-resident rootfs plus six concurrent
#    traffic workers plus the engine need ~800 MB of slack; the
#    floor is a safety bound, not an envelope choice). Best specs:
#    every core and three quarters of the RAM (the withheld quarter
#    pays for qemu's own footprint and the host-side build tree).
#    What stays per-leg: the title (the owner's exact strings), the
#    kernel lane, and the VM budget (the low envelope
#    serializes the battery on its tight CPU slice, so it rides at
#    1800 s; the best envelope runs it wide at 1200 s).
# 3. THE USERLAND held constant on purpose: both legs assemble the
#    rootfs from the SAME ubuntu:22.04 container (glibc 2.35 runs
#    on any kernel >= 3.2, so the 5.15.0 floor is safe), so the
#    pair's only variables are the kernel and the envelope — a
#    kernel-span proof, not a distro matrix.
#
# Trigger paths = the E2E surface (the e2e.yml union, plus this
# workflow's own file, the CI init scripts it executes, and the
# claims harness the battery runs — scripts/bench/proof-claims.py,
# the NIGHT-blade-1 lesson: the harness's API-fix push (fe9c59a)
# never triggered this workflow because its path was absent from
# this list, so the fix rode unvalidated while the last visible
# run stayed red — the NIGHT-hunt-34 rule: a workflow that can
# change its own contract owes itself a run) — plus, since
# NIGHT-hunt-35, the depth rigs the battery now executes
# (scripts/depth/**: a rig edit changes this workflow's contract
# exactly the way an engine edit does) + workflow_dispatch
# (the pre-release click). The weekly Monday 03:00 UTC schedule
# NIGHT-approved-1 landed (the kernel-span clock: a docs-only push
# skips the runner, and the old-releases mirror's availability plus
# the archive the latest-kernel resolver walks were watched between
# pushes) is retired at NIGHT-reject-1 — the owner's call, the
# schedule not needed; the watch-summary step keeps landing every
# push/dispatch run's FAIL/SKIP rows in the step summary, the
# busy-hour residual's longitudinal ledger now riding the
# qualifying pushes instead of the weekly clock (no in-repo
# writes, this workflow keeps contents:read).
#
# NIGHT-approved-1 (the owner's approved next candidates, the
# architectural half): the micro-VM earns REAL EGRESS — qemu
# user-mode networking (SLIRP: guest 10.0.2.15/24, gateway
# 10.0.2.2, DNS 10.0.2.3, static, no bridge, the runner's own
# egress NAT'd behind it) and a virtio-net device. The bus layer
# (virtio, virtio_pci) is built into every kernel this VM boots;
# the floor kernels whose virtio_net is a MODULE (=m) stage it
# from the kernel's OWN linux-modules deb (the vermagic matches
# the vmlinuz the same step extracted, by construction), while
# the modern heads build the driver in
# (=y, verified against the archive's current latest — nothing
# to stage). v1's realnet lane then runs instead of skipping:
# its own reachability probe (the Cloudflare/Asian-rungs chain)
# and its honest SKIPs own the endpoint-down days, exactly the
# lane design that waited for this day — the harness itself
# changes not at all.
#
# Cost: four standard hosted runners for ~15-35 min per qualifying
# push (public-repo standard runners are free; the blade-12 version
# dimension doubled the pair 2 -> 4 legs, each its own job and VM,
# and hunt-35's rig battery adds its minutes inside the budgets
# above); the push pipeline stays decoupled from ci.yml's own
# failure modes — this workflow can only redden itself.
#
# =============================================================================
#
# night-T-1 — the lane reshaped, never the depth
# =============================================================================
# The owner's night-T-1 ask: a single run must not chain the owner
# to a slow machine for half an hour — split the lane so every
# per-push JOB targets ~5 minutes. The reshape is structural only:
#
#   stage (one job, once per run) builds the musl flagship via
#   scripts/setup.sh --skip-heavy, fetches BOTH kernel envelopes
#   (the jammy 5.15.0 floor + the archive's dynamically resolved
#   latest), assembles each into its own initramfs (the ubuntu:22.04
#   userland, bpftool, the QUIC client, the legacy v11.0.0
#   counterfactual — all staged once), and uploads the two boot
#   bundles as artifacts. No shard pays for a toolchain, a resolver,
#   or an assembly again.
#
#   the per-push shards boot the SAME initramfs per envelope and name
#   their battery set on the kernel cmdline (zelynic-batteries=,
#   scripts/ci/supermassive-init.sh reads it from /proc/cmdline):
#   engine (the harness self-tests + v1's server depth phase),
#   legacy (the MMSPA-vs-v11.0.0 subtree delta), survival (v2 + v3 +
#   v4 + the live claims proof), rigs (reload / crash-recovery /
#   race-condition). Each shard's wall clock is one battery, the
#   ~5-minute target, never the sum.
#
#   the ONE battery that is irreducible serial physics — v1's
#   desktop matrix (run_heavy is ONE stateful sequence: the baseline
#   threads through every stage, the realnet lane owns its own
#   teardown, the quota pair rides the same policy window) — rides
#   its own shard on the NIGHTLY schedule (20:00 UTC, the small
#   hours in the owner's Asia/Jakarta night), full depth, while
#   nobody waits. Nothing is cut: the per-push union still proves
#   every other battery on both kernel envelopes, the night train
#   proves the desktop matrix whole. NIGHT-reject-1 retired the
#   weekly FULL-matrix clock in an era when one run WAS the whole
#   battery; this schedule is the different thing the new shape
#   needs — one 12-minute shard nobody waits on — and the owner's
#   night-T-1 ask is its mandate.
#
# Depth is never cut anywhere; the budget still buys headroom,
# never depth.

name: Dragon Guard - Supermassive

on:
  # The owner's unfiltered-CI simplification
  # (night-dragon-maintenance-2): the estate-wide surface globs are
  # retired whole — the spelling's sync tax across every build
  # workflow (the no-drift law between the push and pull_request
  # blocks, the manual glob audit every new consumer needed) outgrew
  # the runner minutes it saved. Any push (any branch, any tag) and
  # any pull request burns the per-push shards now, the same blind
  # posture every push-triggered lane carries.
  push:
  pull_request:
  # The night train (night-T-1): the v1 desktop matrix runs WHOLE
  # on the schedule — full depth at the small hours, nobody
  # waiting. workflow_dispatch runs BOTH the per-push shards and
  # the night shards: a dispatch is the full sweep, the manual
  # recovery lane (and the pre-release click).
  schedule:
    - cron: "30 19 * * *" # 19:30 UTC = 02:30 WIB (Asia/Jakarta), staggered off the e2e train
  workflow_dispatch: {}

# Least privilege (cosmostrix contract): this workflow only reads
# the repository. The sudo inside is host-level (mount, the KVM
# boot, the root test batteries), never a GitHub permission.
permissions:
  contents: read

# The most expensive workflow in the estate (the e2e.yml
# inheritance): a superseded push cancels its in-flight
# supermassive shards instead of queueing duplicates (the
# cosmostrix stability pattern; a tag push lands in a different
# group by construction and never interacts — the
# NIGHT-improve-32 combined-push contract). The night train lives
# in its own group: a push neither cancels nor is cancelled by the
# scheduled desktop-matrix runs.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-
    ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'night' || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # If a panic ever leaks past v2's zero-panic contract, the CI log
  # should carry the backtrace for the debugging session that follows.
  RUST_BACKTRACE: 1

jobs:
  # ── the stage: build once, boot many ────────────────────────────────
  # The lane's only build and only kernel resolving: the musl
  # flagship (setup.sh --skip-heavy, the canonical bring-up), both
  # kernel envelopes, both initramfs assemblies (the ubuntu:22.04
  # userland, bpftool, the QUIC client, the legacy counterfactual),
  # two boot-bundle artifacts. Everything downstream downloads and
  # boots.
  stage:
    name: supermassive - stage (payload + both kernel envelopes)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, NIGHT-hunt-20 SHA pin
        with:
          # GITHUB_TOKEN hardening: never persists into .git/config.
          persist-credentials: false

      - name: Harden DNS (the poisoned-resolver defense)
        uses: ./.github/actions/harden-dns
      - name: Install cpio
        run: |-
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends cpio

      # The E2E pipeline's phase one, the owner-facing bring-up on the
      # RUNNER (outside the VM — a low-specs guest cannot host a
      # toolchain build, and the envelope's point is the STRESSTEST,
      # not the compile): the canonical path from e2e.yml — bootstrap,
      # the payload build, and the rootless engine self-test. The
      # flagship it builds (night-dragon-maintenance-6: musl is the
      # only shape — setup.sh's static pro-native-musl, glibc-free)
      # is the runner-side proof; the binary the GUEST carries is the
      # release-tier v3 alias below (the stage-to-shard relay's
      # portable shape — the flagship's -C target-cpu=native codegen
      # is honest only on the machine that built it).
      - name: Bring-up (setup.sh --skip-heavy, static musl flagship)
        run: |
          rustup target add x86_64-unknown-linux-musl
          ./scripts/setup.sh --skip-heavy

      # The guest payload (the from-source law's portable shape): the
      # release-tier v3 alias - v3 executes on every x86_64 runner
      # since Haswell, which is exactly the contract the stage-to-
      # shard relay needs. The flagship pro-native-musl is -C
      # target-cpu=native: honest on the machine that built it, a
      # SIGILL lottery across the shard fleet - run 42894093792's
      # lesson: the engine shard's node happened to be a superset of
      # the stage node's silicon (its -V row passed and the server
      # phase ran green), while the rigs/legacy/survival shards
      # landed on nodes the stage codegen outran and the init's -V
      # probe failed LOUDLY, exactly as the probe was designed to.
      # The RUSTFLAGS composition mirrors the e2e stage's (the
      # -D-warnings lead plus the alias's tokens verbatim).
      - name: Build the release-tier v3 payload (pro-linux-amd64-v3-musl)
        run: |
          set -euo pipefail
          RUSTFLAGS="-D warnings -C target-cpu=x86-64-v3 -C target-feature=+crt-static" \
            cargo pro-linux-amd64-v3-musl --locked
          ./target/x86_64-unknown-linux-musl/pro-linux-amd64-v3-musl/zelynic -V | grep -F "Build: local-pro-linux-amd64-v3-musl"

      # The floor kernel (night-netrunner-1: the documented floor is
      # 5.15.0 — the impish 5.13 lane is retired with it): jammy's
      # 5.15.0-ABI LTS line, fetched from the LIVE main archive (no
      # frozen mirror). The resolver shape is the e2e workflow's jammy
      # leg, retargeted: isolated sources, names-only search, highest
      # ABI, apt resolves the newest 5.15.0-ABI jammy-updates point
      # release so no URL rot and no pinned ABI. The 5\.15\.0- anchor
      # deliberately excludes jammy's HWE 6.x images — those are the
      # best leg's jurisdiction.
      - name: Fetch the jammy 5.15.0 floor kernel (low specs)
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage/low && cd /tmp/stage/low
          {
            echo "deb http://archive.ubuntu.com/ubuntu/ jammy main"
            echo "deb http://archive.ubuntu.com/ubuntu/ jammy-updates main"
          } | sudo tee /etc/apt/sources.list.d/jammy-floor.list >/dev/null
          sudo apt-get -o Acquire::Retries=5 update \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/jammy-floor.list \
            -o Dir::Etc::sourceparts=/dev/null \
            -o APT::Get::List-Cleanup=0
          IMG=$(apt-cache search --names-only \
            'linux-image-unsigned-5\.15\.0-.*-generic' 2>/dev/null \
            | grep -oE 'linux-image-unsigned-5\.15\.0-[0-9]+-generic' \
            | sort -V | tail -1 || true)
          if test -z "$IMG"; then
            echo "FAIL: no linux-image-unsigned-5.15.0-*-generic in the jammy pockets — resolver evidence:"
            apt-cache search --names-only 'linux-image-unsigned-5\.15' || true
            exit 1
          fi
          echo "resolved: $IMG"
          # NIGHT-dinner-12: the archive download retry (apt's own
          # knob; the floor lane is the one lane a mirror hiccup
          # would redden, so it retries on its own first).
          apt-get -o Acquire::Retries=5 download "$IMG"
          dpkg -x "${IMG}"*_amd64.deb pkg
          VMLINUZ=$(find pkg/boot -name 'vmlinuz-5.15.*' | head -1)
          if test -z "$VMLINUZ"; then
            echo "FAIL: no vmlinuz inside the deb — pkg/boot contents:"
            ls -la pkg/boot || true
            exit 1
          fi
          cp "$VMLINUZ" /tmp/stage/low/vmlinuz-floor
          echo "kernel: $(du -h /tmp/stage/low/vmlinuz-floor | cut -f1) at /tmp/stage/low/vmlinuz-floor"
          # NIGHT-approved-1 (the egress half): stage the kernel's
          # OWN virtio_net module pair when the driver is a module —
          # the same config-driven staging walk the e2e jammy leg
          # runs (the walk stages whatever the deb's own config
          # names, =y or =m: the vermagic matches the vmlinuz this
          # step just extracted, by construction — the bpftool
          # lane's per-kernel-ABI discipline, applied to modules).
          # The bus layer (virtio, virtio_pci) is =y on every kernel
          # this VM boots. A resolve or extract failure FAILS the
          # leg here on the runner, the legacy-fetch doctrine the
          # bpftool lane set — the owner-approved egress contract is
          # not soft.
          KVER="${IMG#linux-image-unsigned-}"
          MODPKG="linux-modules-$KVER"
          apt-get -o Acquire::Retries=5 download "$MODPKG"
          rm -rf mods /tmp/stage/low/virtio-mods
          dpkg-deb -x "${MODPKG}"*_amd64.deb mods
          CFG="mods/boot/config-$KVER"
          test -f "$CFG" || {
            echo "FAIL: no config-$KVER inside $MODPKG — deb contents:"
            ls mods/boot || true
            exit 1
          }
          VNET=$(sed -n 's/^CONFIG_VIRTIO_NET=\(.*\)$/\1/p' "$CFG")
          case "$VNET" in
            y)  echo "virtio_net built-in (=y) — no modules to stage" ;;
            m)  # The dependency chain modinfo walks, second hop and
                # all: virtio_net depends on net_failover, and
                # net_failover's OWN symbols (failover_register and
                # kin) live in failover.ko under net/core — a
                # DIFFERENT directory than drivers/net. Run
                # 37520041688's lesson: staging the pair without the
                # core leaf fails every insmod with Unknown symbol.
                STG="/tmp/stage/low/virtio-mods/lib/modules/$KVER/kernel"
                mkdir -p "$STG/net/core" "$STG/drivers/net"
                stage_mod() {
                  mod=$1; dir=$2; flag=$3
                  WANT=$(sed -n "s/^CONFIG_$flag=\(.*\)$/\1/p" "$CFG")
                  if [ "$WANT" = "m" ]; then
                    SRC="mods/lib/modules/$KVER/kernel/$dir/$mod.ko"
                    test -f "$SRC" || { echo "FAIL: $mod.ko absent from $MODPKG (config says =m)"; exit 1; }
                    cp "$SRC" "$STG/$dir/"
                  fi
                }
                stage_mod failover net/core FAILOVER
                stage_mod net_failover drivers/net NET_FAILOVER
                stage_mod virtio_net drivers/net VIRTIO_NET
                echo "staged virtio modules: $(du -sh /tmp/stage/low/virtio-mods | cut -f1)"
                echo "  at /tmp/stage/low/virtio-mods" ;;
            *)  echo "FAIL: CONFIG_VIRTIO_NET=$VNET — no usable virtio-net driver on this kernel"; exit 1 ;;
          esac

      # The latest kernel (NIGHT-improve-33, the best-specs lane):
      # resolved DYNAMICALLY at run time, nothing pinned. The dists
      # index names every live base suite; each suite's Release
      # carries Date + Codename; the two newest DISTINCT codenames
      # (the devel series plus the newest release — and the dedupe is
      # load-bearing: mid-cycle the index lists the devel alias AND
      # its target codename pointing at the same content, which apt
      # refuses as "Conflicting distribution") become the apt
      # sources, main + -updates pockets each (proposed deliberately
      # excluded — pre-release is not "latest"), and the newest
      # generic unsigned image across them wins via sort -V. When
      # Ubuntu ships 27.04, this resolver walks onto it without an
      # edit; if the archive ever restructures, it fails LOUDLY with
      # the discovery evidence attached.
      - name: Resolve the archive's latest kernel (best specs)
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage/best && cd /tmp/stage/best
          # NIGHT-dinner-12: the dists index + Release probes carry the
          # curl retry contract (a plain-HTTP archive mirror 500s on
          # its bad days; the resolver must not die on one bad poll).
          SUITES=$(curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 --retry-max-time 300 --connect-timeout 15 \
            http://archive.ubuntu.com/ubuntu/dists/ \
            | grep -oE 'href="[a-z0-9]+/"' | cut -d'"' -f2 | tr -d '/' \
            | grep -v -- '-' | sort -u)
          if test -z "$SUITES"; then
            echo "FAIL: the dists index resolved no base suites — archive restructure?"
            curl -fsSL --retry 6 --retry-all-errors http://archive.ubuntu.com/ubuntu/dists/ | head -40 || true
            exit 1
          fi
          echo "base suites: $(echo "$SUITES" | tr '\n' ' ')"
          RELEASES=$(for s in $SUITES; do
            rel=$(curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 --retry-max-time 300 --connect-timeout 15 \
              "http://archive.ubuntu.com/ubuntu/dists/$s/Release")
            d=$(echo "$rel" | sed -n 's/^Date: //p' | head -1)
            c=$(echo "$rel" | sed -n 's/^Codename: //p' | head -1)
            if test -n "$d" && test -n "$c"; then
              echo "$(date -d "$d" +%s 2>/dev/null || echo 0) $c"
            fi
          done | sort -rn -k1,1 | awk '!seen[$2]++')
          DATED=$(echo "$RELEASES" | head -2 | awk '{print $2}')
          if test -z "$DATED"; then
            echo "FAIL: no suite Release carried Date+Codename — resolver evidence above"
            exit 1
          fi
          echo "newest distinct codenames: $(echo "$DATED" | tr '\n' ' ')"
          {
            for s in $DATED; do
              echo "deb http://archive.ubuntu.com/ubuntu/ $s main"
              echo "deb http://archive.ubuntu.com/ubuntu/ $s-updates main"
            done
          } | sudo tee /etc/apt/sources.list.d/latest-head.list >/dev/null
          sudo apt-get -o Acquire::Retries=5 update \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/latest-head.list \
            -o Dir::Etc::sourceparts=/dev/null \
            -o APT::Get::List-Cleanup=0
          IMG=$(apt-cache search --names-only 'linux-image-unsigned' 2>/dev/null \
            | awk '{print $1}' \
            | grep -E '^linux-image-unsigned-[0-9]+\.[0-9]+\.0-[0-9]+-generic$' \
            | sort -V | tail -1 || true)
          if test -z "$IMG"; then
            echo "FAIL: no generic unsigned kernel image resolved across the newest suites — index evidence:"
            apt-cache search --names-only 'linux-image-unsigned' | head -20 || true
            exit 1
          fi
          echo "resolved: $IMG"
          # NIGHT-dinner-12: the live-archive download retry (apt's
          # own knob, same as the frozen-mirror lane above).
          apt-get -o Acquire::Retries=5 download "$IMG"
          dpkg -x "${IMG}"*_amd64.deb pkg
          VMLINUZ=$(find pkg/boot -type f -name 'vmlinuz-*' | head -1)
          if test -z "$VMLINUZ"; then
            echo "FAIL: no vmlinuz inside the deb — pkg/boot contents:"
            ls -la pkg/boot || true
            exit 1
          fi
          cp "$VMLINUZ" /tmp/stage/best/vmlinuz-floor
          echo "kernel: $(du -h /tmp/stage/best/vmlinuz-floor | cut -f1) at /tmp/stage/best/vmlinuz-floor"
          # NIGHT-approved-1 (the egress half, the latest-kernel
          # twin of the floor lane above): the SAME config-driven
          # staging walk, the kernel's OWN modules deb from the
          # suites this resolver just configured. The modern heads
          # ship CONFIG_VIRTIO_NET=y (verified against the archive's
          # current latest: the driver is built in, nothing to
          # stage) — the walk exists so the day a head flips the
          # flag back to =m, this leg stages the pair instead of
          # reddening the egress row the init judges.
          KVER="${IMG#linux-image-unsigned-}"
          MODPKG="linux-modules-$KVER"
          apt-get -o Acquire::Retries=5 download "$MODPKG"
          rm -rf mods /tmp/stage/best/virtio-mods
          dpkg-deb -x "${MODPKG}"*_amd64.deb mods
          CFG="mods/boot/config-$KVER"
          test -f "$CFG" || {
            echo "FAIL: no config-$KVER inside $MODPKG — deb contents:"
            ls mods/boot || true
            exit 1
          }
          VNET=$(sed -n 's/^CONFIG_VIRTIO_NET=\(.*\)$/\1/p' "$CFG")
          case "$VNET" in
            y)  echo "virtio_net built-in (=y) — no modules to stage" ;;
            m)  # The dependency chain's full trio (the twin of the
                # floor lane above — run 37520041688's lesson):
                # failover.ko under net/core owns the symbols
                # net_failover.ko imports, so the pair alone fails
                # with Unknown symbol.
                STG="/tmp/stage/best/virtio-mods/lib/modules/$KVER/kernel"
                mkdir -p "$STG/net/core" "$STG/drivers/net"
                stage_mod() {
                  mod=$1; dir=$2; flag=$3
                  WANT=$(sed -n "s/^CONFIG_$flag=\(.*\)$/\1/p" "$CFG")
                  if [ "$WANT" = "m" ]; then
                    SRC="mods/lib/modules/$KVER/kernel/$dir/$mod.ko"
                    test -f "$SRC" || { echo "FAIL: $mod.ko absent from $MODPKG (config says =m)"; exit 1; }
                    cp "$SRC" "$STG/$dir/"
                  fi
                }
                stage_mod failover net/core FAILOVER
                stage_mod net_failover drivers/net NET_FAILOVER
                stage_mod virtio_net drivers/net VIRTIO_NET
                echo "staged virtio modules: $(du -sh /tmp/stage/best/virtio-mods | cut -f1)"
                echo "  at /tmp/stage/best/virtio-mods" ;;
            *)  echo "FAIL: CONFIG_VIRTIO_NET=$VNET — no usable virtio-net driver on this kernel"; exit 1 ;;
          esac

      # The userland (BOTH envelopes' legs, held constant on purpose —
      # the leg's only variables are the kernel and the envelope): the
      # frozen ubuntu:22.04 CONTAINER, unchanged since NIGHT-improve-31
      # (a static binary owes no userland anything; the gnu legs' old
      # same-distro 24.04 rootfs retired with the gnu packaging).
      # One docker userland is prepared (bpftool walked out of the
      # linux-tools chain, the QUIC client staged and purge-proven),
      # then one assemble() walk per envelope directory packs it with
      # the checkout tree, the payload, and
      # scripts/ci/supermassive-init.sh as /init (PID 1) into its own
      # newc cpio (the initramfs IS the rootfs; no disk, no modules).
      # Each envelope's directory is swept back to the boot pair
      # (kernel + initramfs) before the artifact upload — the shards
      # download the bundle, never the build furniture.
      - name: Assemble the micro-VM rootfs (both envelopes)
        run: |
          set -euo pipefail
          # The frozen jammy userland, unchanged since NIGHT-improve-31
          # (a static binary owes no userland anything) — the version
          # dimension collapsed to musl with the gnu packaging
          # (night-dragon-maintenance-6). The payload is the release-
          # tier v3 alias: the portable shape the stage-to-shard relay
          # needs (the native-codegen flagship is a cross-node SIGILL
          # lottery — the stage step's comment carries the run
          # 42894093792 evidence).
          SUITE=ubuntu:22.04
          PAYLOAD="$GITHUB_WORKSPACE/target/x86_64-unknown-linux-musl/pro-linux-amd64-v3-musl/zelynic"
          echo "rootfs suite: $SUITE (payload: pro-linux-amd64-v3-musl, static)"
          docker pull -q "$SUITE"
          docker rm -f floor-rootfs >/dev/null 2>&1 || true
          docker run --name floor-rootfs -d "$SUITE" sleep infinity
          # NIGHT-dinner-12's knob, completed for the rootfs lane: the
          # contract's both-halves rule covers every apt fetch, and
          # run 579's lesson is the class it guards — a mirror edge
          # caught mid-sync served a stale Packages.gz against the
          # fresh Release ("File has unexpected size", exit 100) that
          # the knob the kernel resolvers already own absorbs.
          docker exec floor-rootfs apt-get -o Acquire::Retries=5 update -qq
          docker exec floor-rootfs apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            python3 iproute2 kmod curl nftables
          # bpftool (NIGHT-improve-48): Ubuntu ships no standalone
          # package — the binary lives inside the per-ABI linux-tools
          # debs, and the VM's kernel (the 5.15.0 floor or the
          # dynamically resolved latest) never matches the rootfs's
          # tools ABI, so the dispatcher cannot resolve it inside the
          # guest. The binary itself talks to the kernel through the
          # stable bpf(2) ABI — prog/link/cgroup show predate the
          # 5.15.0 floor — so one flavor's binary is staged at
          # /usr/bin/bpftool, the same PATH-probe shape the claims
          # battery uses and the same standalone-package shape a
          # Debian user gets. The suite shapes differ (run 231's
          # lesson: noble's per-kernel -generic package carries the
          # binary directly; jammy's is a 1.8 KB shell whose Depends
          # names the per-ABI package that carries it), so the lane
          # WALKS the linux-tools dependency chain — each level's deb
          # is downloaded and probed for the binary, and the first
          # one that carries it wins (both suite shapes resolve in
          # two levels or fewer). The download-and-extract lane
          # keeps the RAM-resident rootfs lean: only the ~0.7 MB
          # binary rides the cpio, not the whole tools package with
          # perf and its lib closure.
          docker exec floor-rootfs sh -ec '
            cd /tmp || exit 1
            resolve() {
              apt-cache depends "$1" \
                | sed -n "s/^ *Depends: \(linux-tools-[0-9][^ ]*\) *$/\1/p" \
                | head -n1
            }
            pkg=$(resolve linux-tools-generic)
            test -n "$pkg" || { echo "FAIL: no per-kernel linux-tools resolved"; exit 1; }
            src=""
            for _ in 1 2 3; do
              apt-get -o Acquire::Retries=5 download "$pkg" >/dev/null
              rm -rf /tmp/bpx
              dpkg-deb -x "${pkg}"_*.deb /tmp/bpx
              src=$(find /tmp/bpx/usr/lib -type f -name bpftool | head -n1)
              test -n "$src" && break
              next=$(resolve "$pkg")
              test -n "$next" || break
              test "$next" != "$pkg" || break
              pkg="$next"
            done
            test -n "$src" || { echo "FAIL: no bpftool inside the linux-tools chain ($pkg)"; exit 1; }
            install -m 0755 "$src" /usr/bin/bpftool
            rm -rf /tmp/bpx /tmp/linux-tools-*.deb
          '
          # NIGHT-hunt-37: the QUIC client rides the rootfs (the
          # hunt-36 residual, owner-approved): aioquic + its wheel
          # dependencies, staged through the CONTAINER'S OWN python
          # so the compiled wheels (pylsqpack, cryptography) match
          # the guest interpreter ABI — jammy's 3.10, noble's 3.12,
          # aioquic's cp310-abi3 wheel covers both. pip itself is
          # transient plumbing: installed, used, PURGED (autoremove
          # takes its auto-dependencies), so only the ~10 MB of
          # QUIC libraries ride the RAM-resident cpio. The PEP 668
          # split: jammy's pip installs plain, noble's is
          # externally-managed and needs --break-system-packages —
          # the || fallback speaks both dialects. A staging failure
          # FAILS the leg here on the runner, where retries are
          # cheap (the improve-48 bpftool law): the in-VM QUIC row
          # must never silently skip its proof.
          docker exec floor-rootfs sh -ec '
            apt-get -o Acquire::Retries=5 install -y --no-install-recommends python3-pip >/dev/null
            pip3 install --no-cache-dir aioquic >/dev/null 2>&1 \
              || pip3 install --no-cache-dir --break-system-packages aioquic >/dev/null
            python3 -c "import aioquic, cryptography, pylsqpack" \
              || { echo "FAIL: the QUIC client stack did not import inside the rootfs"; exit 1; }
            apt-get purge -y python3-pip >/dev/null
            apt-get autoremove -y >/dev/null
            python3 -c "import aioquic, cryptography, pylsqpack" \
              || { echo "FAIL: the QUIC client stack did not survive the pip purge"; exit 1; }
            echo "QUIC client staged: $(python3 -c "import aioquic; print(aioquic.__version__)")"
          '
          docker export floor-rootfs -o /tmp/stage/rootfs.tar
          # NIGHT-perf-1: the MMSPA-vs-legacy A/B needs the pre-MMSPA
          # stable INSIDE the VM on its own loopback lane (the A/B
          # rides the guest's deterministic loopback traffic, not the
          # internet — the egress changes nothing here, both sides
          # measured on the same lane either way). The v11.0.0
          # release — the last leaf-anchored datapath, the exact
          # counterfactual the subtree contract is measured against —
          # rides the TREE since the legacy-for-test/ vendoring: the release's
          # own .sha512sum sidecar verbatim plus a .b3sum over the
          # same bytes, so no CI run ever fetches the counterfactual
          # from the network. The pair is verified HERE on the runner
          # (sha512sum -c against the release sidecar, b3sum -c
          # against the vendored digest — the VERIFY_RELEASE fast
          # lane, the tool ubuntu-24.04 ships as the b3sum package,
          # the dinner-12 retries knob on both apt fetches), and a
          # missing file or a digest mismatch FAILS the leg before
          # any VM boots — the fetch-failure doctrine, now a checksum
          # doctrine, still not soft. assemble() below extracts only
          # the verified bytes into /opt/zelynic/legacy.
          LEGACY_ASSET="zelynic-v11.0.0-linux-amd64-v3-musl.tar.gz"
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends b3sum
          ( cd "$GITHUB_WORKSPACE/legacy-for-test" \
            && sha512sum -c "$LEGACY_ASSET.sha512sum" \
            && b3sum -c "$LEGACY_ASSET.b3sum" )
          echo "legacy vendored pair verified: $GITHUB_WORKSPACE/legacy-for-test/$LEGACY_ASSET"
          assemble() {
            DIR=$1
            mkdir -p "$DIR/rootfs/opt/zelynic/legacy"
            tar -xf /tmp/stage/rootfs.tar -C "$DIR/rootfs"
            git -C "$GITHUB_WORKSPACE" archive HEAD | tar -x -C "$DIR/rootfs/opt/zelynic"
            cp "$PAYLOAD" "$DIR/rootfs/opt/zelynic/zelynic"
            # night-dragon-maintenance-6: the version dimension is
            # collapsed to musl — the marker is written by the same
            # step that copies the binary, one /opt/zelynic apart.
            printf '%s\n' 'musl' > "$DIR/rootfs/opt/zelynic/PAYLOAD-FLAVOR"
            cp "$GITHUB_WORKSPACE/scripts/ci/supermassive-init.sh" "$DIR/rootfs/init"
            chmod +x "$DIR/rootfs/init"
            # NIGHT-approved-1: the virtio module pair a resolver step
            # staged (the floor leg whose driver is =m — 160 KB) rides the cpio
            # under the kernel's own module path; the =y heads staged
            # nothing and the init's insmod pair simply finds no files
            # (the built-in driver needs none). kmod in the apt line
            # above owns the insmod. The copy respects the usr-merge:
            # the ubuntu containers ship /lib as a SYMLINK to usr/lib
            # (run 37518266382's lesson — `cp -a .../lib rootfs/` tried
            # to overwrite the symlink itself and failed the
            # assembly), so the modules land at the physical
            # /usr/lib/modules while the init reads the canonical
            # /lib/modules path through the link — both homes resolve
            # to the same bytes either way, and a non-merged rootfs
            # (a real /lib directory) takes the direct copy.
            if [ -d "$DIR/virtio-mods" ]; then
              if [ -L "$DIR/rootfs/lib" ]; then
                mkdir -p "$DIR/rootfs/usr/lib"
                cp -a "$DIR/virtio-mods/lib/modules" "$DIR/rootfs/usr/lib/"
              else
                mkdir -p "$DIR/rootfs/lib"
                cp -a "$DIR/virtio-mods/lib/modules" "$DIR/rootfs/lib/"
              fi
              echo "virtio modules staged into the rootfs cpio"
            fi
            tar xzf "$GITHUB_WORKSPACE/legacy-for-test/$LEGACY_ASSET" -C "$DIR/rootfs/opt/zelynic/legacy"
            test -x "$DIR/rootfs/opt/zelynic/legacy/zelynic"
            echo "legacy staged: $("$DIR/rootfs/opt/zelynic/legacy/zelynic" -V | head -1)"
            # PID 1 needs a console to exec onto before devtmpfs lands
            # (the kernel opens the initramfs's static /dev/console for
            # it; the init's devtmpfs mount takes over from there). The
            # docker export ships a /dev/console entry tar could not
            # restore as a device (a non-root extract degrades it to a
            # placeholder file) — remove whatever landed, mknod the real
            # char device fresh.
            sudo rm -f "$DIR/rootfs/dev/console"
            sudo mknod -m 600 "$DIR/rootfs/dev/console" c 5 1
            ( cd "$DIR/rootfs" && sudo find . -print0 | sudo cpio --null -o -H newc ) | gzip -1 > "$DIR/initrd.gz"
            echo "initramfs: $(du -h "$DIR/initrd.gz" | cut -f1)"
            # The sweep: the artifact carries the boot pair only.
            rm -rf "$DIR/rootfs" "$DIR/pkg" "$DIR/mods" "$DIR"/*.deb
          }
          assemble /tmp/stage/low
          assemble /tmp/stage/best

      - name: Upload the low-specs micro-VM bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, NIGHT-hunt-20 SHA pin
        with:
          name: supermassive-vm-low
          path: /tmp/stage/low
          retention-days: 3

      - name: Upload the best-specs micro-VM bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, NIGHT-hunt-20 SHA pin
        with:
          name: supermassive-vm-best
          path: /tmp/stage/best
          retention-days: 3

  # ── the per-push battery shards ─────────────────────────────────────
  # Every shard: download the staged bundle, boot it, run ONE battery
  # set (the cmdline selector), grep the verdict. The wall clock is
  # the slowest SINGLE battery — the owner's night-T-1 target, never
  # the sum of the lane again.
  supermassive:
    name: ${{ matrix.title }}
    needs: [stage]
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: supermassive engine test - low specs (the jammy 5.15.0 floor kernel, musl)
            battery: engine
            profile: low
            vm_timeout: "600"
          - title: supermassive legacy delta test - low specs (the jammy 5.15.0 floor kernel, musl)
            battery: legacy
            profile: low
            vm_timeout: "600"
          - title: supermassive survival test - low specs (the jammy 5.15.0 floor kernel, musl)
            battery: survival
            profile: low
            vm_timeout: "720"
          - title: supermassive rigs test - low specs (the jammy 5.15.0 floor kernel, musl)
            battery: rigs
            profile: low
            vm_timeout: "720"
          - title: supermassive engine test - best specs (musl)
            battery: engine
            profile: best
            vm_timeout: "600"
          - title: supermassive legacy delta test - best specs (musl)
            battery: legacy
            profile: best
            vm_timeout: "600"
          - title: supermassive survival test - best specs (musl)
            battery: survival
            profile: best
            vm_timeout: "720"
          - title: supermassive rigs test - best specs (musl)
            battery: rigs
            profile: best
            vm_timeout: "720"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, NIGHT-hunt-20 SHA pin
        with:
          # GITHUB_TOKEN hardening: never persists into .git/config.
          persist-credentials: false

      - name: Harden DNS (the poisoned-resolver defense)
        uses: ./.github/actions/harden-dns
      # The kernel can change; /dev/kvm is a GitHub runner guarantee
      # (nested virt is enabled on every current Linux hosted image) —
      # but the node ships 0660 root:kvm and the runner user is not in
      # the kvm group, so the job opens it up itself. Failing LOUDLY
      # here beats a confusing TCG fallback: the pro-native binary is
      # native codegen and would SIGILL under TCG's -cpu qemu64 —
      # KVM's -cpu host passthrough is what makes "native" honest
      # inside the VM.
      - name: Verify KVM
        run: |
          test -e /dev/kvm || {
            echo "FAIL: /dev/kvm is absent — this runner image cannot boot the micro-VM"
            echo "(nested virt is expected on every current GitHub Linux runner image)"
            exit 1
          }
          test -w /dev/kvm || sudo chmod 666 /dev/kvm
          test -w /dev/kvm || {
            echo "FAIL: /dev/kvm is not usable by the runner user even after chmod"
            ls -l /dev/kvm
            exit 1
          }
          echo "OK: /dev/kvm present and usable"

      # NIGHT-dinner-12: apt's own retry knob rides both halves of
      # every apt traffic below (the install here, the update + download
      # steps in the kernel resolvers) — a flaky archive mirror is the
      # same GitHub-infra class as the curl 500s, and apt's default is
      # zero retries.
      - name: Install qemu
        run: |-
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends qemu-system-x86

      # The staged bundle (kernel + initramfs, the stage job's own
      # build for THIS run's HEAD): the shard downloads its envelope
      # and boots it — no toolchain, no resolver, no assembly.
      - name: Download the staged micro-VM bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8, NIGHT-hunt-20 SHA pin
        with:
          name: supermassive-vm-${{ matrix.profile }}
          path: /tmp/kfloor

      # Boot the micro-VM: direct kernel boot, KVM host-passthrough
      # CPU, no disk, serial console to stdout, panic=-1 + -no-reboot
      # so a kernel panic ends qemu instead of hanging the job, the
      # shard's outer timeout (a wedged guest can never burn the job
      # budget) and the isa-debug-exit device — the guest ends the VM
      # deterministically by writing one byte to port 0xf4 (qemu exits
      # with status 1), the kernel-CI standard for initramfs guests
      # whose direct-boot path never reaches an ACPI S5 poweroff.
      #
      # The DYNAMIC envelope (NIGHT-improve-33, the owner's "cpu
      # core, ram, etc don't set fixed let dynamic"): derived from
      # the runner at boot time — low specs takes one quarter of
      # the cores (floored at 1: a vCPU is the indivisible minimum)
      # and one eighth of the RAM (floored at 1024 MB: the battery's
      # own safety bound, the RAM-resident rootfs plus the traffic
      # workers need ~800 MB of slack); best specs takes every core
      # and three quarters of the RAM (the withheld quarter pays for
      # qemu's own footprint and the host-side build tree). The pair
      # scales with GitHub's hardware instead of pinning one era's
      # runner shape.
      #
      # zelynic-batteries=${{ matrix.battery }}: the shard's battery
      # set, read by the init from /proc/cmdline
      # (scripts/ci/supermassive-init.sh's night-T-1 relay) — ONE
      # staged initramfs per envelope, the selector rides the boot.
      - name: Boot the kernel-floor micro-VM and run the battery shard
        run: |
          set -euo pipefail
          cd /tmp/kfloor
          CORES=$(nproc)
          TOTAL_MB=$(free -m | awk '/^Mem:/{print $2}')
          if [ "${{ matrix.profile }}" = "low" ]; then
            SMP=$(( CORES / 4 )); [ "$SMP" -lt 1 ] && SMP=1
            MEM=$(( TOTAL_MB / 8 )); [ "$MEM" -lt 1024 ] && MEM=1024
          else
            SMP=$CORES
            MEM=$(( TOTAL_MB * 3 / 4 ))
          fi
          echo "envelope: $SMP vCPU / $MEM MB (of $CORES cores / $TOTAL_MB MB on the runner)"
          set +e
          timeout ${{ matrix.vm_timeout }} qemu-system-x86_64 \
            -machine q35,accel=kvm -cpu host \
            -m "$MEM" -smp "$SMP" \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0 \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
            -kernel vmlinuz-floor \
            -initrd initrd.gz \
            -append "console=ttyS0 panic=-1 zelynic-batteries=${{ matrix.battery }}" \
            -nographic -no-reboot 2>&1 | tee vm.log
          QEMU_RC=${PIPESTATUS[0]}
          set -e
          # rc 0 = a natural poweroff; rc 1 = the guest's deliberate
          # isa-debug-exit (the verdict itself rides the MASS-*
          # sentinel lines, so the Verdict step below stays the
          # authority). Anything else — the shard's timeout (124), a
          # KVM init failure — fails HERE with the tail attached.
          if test "$QEMU_RC" -ne 0 && test "$QEMU_RC" -ne 1; then
            echo "FAIL: qemu exited $QEMU_RC — log tail:"
            tail -40 vm.log
            exit 1
          fi
          exit 0

      # The verdict lives in the log (the VM cannot relay exit codes
      # through qemu; the MASS-* sentinel lines are the contract —
      # scripts/ci/supermassive-init.sh owns them).
      - name: Verdict
        run: |
          set -euo pipefail
          cd /tmp/kfloor
          echo "── supermassive verdicts (${{ matrix.title }}) ──"
          grep -E '^MASS-(RESULT|VERDICT)' vm.log || true
          grep -q '^MASS-VERDICT: PASS' vm.log
          echo "OK: the kernel span proven on the ${{ matrix.title }} envelope"

      # NIGHT-approved-1: the busy-hour residual watch — every run
      # lands its shard's FAIL/SKIP inventory in the step summary,
      # so the Actions history reads as the longitudinal dataset
      # (this workflow keeps contents:read; no in-repo writes, no
      # artifact expiry).
      - name: Watch summary (the busy-hour residual clock)
        if: always()
        run: |
          cd /tmp/kfloor
          {
            echo "## Dragon Guard watch — ${{ matrix.title }}"
            echo
            echo "- trigger: ${{ github.event_name }}"
            echo "- run: ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            echo
            echo "### battery verdicts (the init's sentinel rows)"
            echo
            echo '```'
            grep -E '^MASS-(RESULT|VERDICT)' vm.log || true
            echo '```'
            echo
            echo "### FAIL/SKIP inventory (the busy-hour residual's home)"
            echo
            echo '```'
            grep -E '^  (X  |-- )' vm.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── the night train: v1's desktop matrix, WHOLE ────────────────────
  # run_heavy is ONE stateful sequence (the baseline threads through
  # every stage, the realnet lane owns its own teardown, the quota
  # pair rides the same policy window) — it is never sharded inside,
  # only scheduled. Full depth at the small hours, nobody waiting;
  # workflow_dispatch runs it too (a dispatch is the full sweep).
  supermassive-desktop:
    name: ${{ matrix.title }}
    needs: [stage]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: supermassive desktop matrix (night train) - low specs (the jammy 5.15.0 floor kernel, musl)
            profile: low
            vm_timeout: "1800"
          - title: supermassive desktop matrix (night train) - best specs (musl)
            profile: best
            vm_timeout: "1800"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, NIGHT-hunt-20 SHA pin
        with:
          # GITHUB_TOKEN hardening: never persists into .git/config.
          persist-credentials: false

      - name: Harden DNS (the poisoned-resolver defense)
        uses: ./.github/actions/harden-dns
      - name: Verify KVM
        run: |
          test -e /dev/kvm || {
            echo "FAIL: /dev/kvm is absent — this runner image cannot boot the micro-VM"
            echo "(nested virt is expected on every current GitHub Linux runner image)"
            exit 1
          }
          test -w /dev/kvm || sudo chmod 666 /dev/kvm
          test -w /dev/kvm || {
            echo "FAIL: /dev/kvm is not usable by the runner user even after chmod"
            ls -l /dev/kvm
            exit 1
          }
          echo "OK: /dev/kvm present and usable"

      - name: Install qemu
        run: |-
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends qemu-system-x86

      - name: Download the staged micro-VM bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8, NIGHT-hunt-20 SHA pin
        with:
          name: supermassive-vm-${{ matrix.profile }}
          path: /tmp/kfloor

      - name: Boot the kernel-floor micro-VM and run the desktop matrix
        run: |
          set -euo pipefail
          cd /tmp/kfloor
          CORES=$(nproc)
          TOTAL_MB=$(free -m | awk '/^Mem:/{print $2}')
          if [ "${{ matrix.profile }}" = "low" ]; then
            SMP=$(( CORES / 4 )); [ "$SMP" -lt 1 ] && SMP=1
            MEM=$(( TOTAL_MB / 8 )); [ "$MEM" -lt 1024 ] && MEM=1024
          else
            SMP=$CORES
            MEM=$(( TOTAL_MB * 3 / 4 ))
          fi
          echo "envelope: $SMP vCPU / $MEM MB (of $CORES cores / $TOTAL_MB MB on the runner)"
          set +e
          timeout ${{ matrix.vm_timeout }} qemu-system-x86_64 \
            -machine q35,accel=kvm -cpu host \
            -m "$MEM" -smp "$SMP" \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0 \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
            -kernel vmlinuz-floor \
            -initrd initrd.gz \
            -append "console=ttyS0 panic=-1 zelynic-batteries=desktop" \
            -nographic -no-reboot 2>&1 | tee vm.log
          QEMU_RC=${PIPESTATUS[0]}
          set -e
          if test "$QEMU_RC" -ne 0 && test "$QEMU_RC" -ne 1; then
            echo "FAIL: qemu exited $QEMU_RC — log tail:"
            tail -40 vm.log
            exit 1
          fi
          exit 0

      - name: Verdict
        run: |
          set -euo pipefail
          cd /tmp/kfloor
          echo "── supermassive verdicts (${{ matrix.title }}) ──"
          grep -E '^MASS-(RESULT|VERDICT)' vm.log || true
          grep -q '^MASS-VERDICT: PASS' vm.log
          echo "OK: the desktop matrix proven on the ${{ matrix.title }} envelope"

      - name: Watch summary (the busy-hour residual clock)
        if: always()
        run: |
          cd /tmp/kfloor
          {
            echo "## Dragon Guard watch — ${{ matrix.title }}"
            echo
            echo "- trigger: ${{ github.event_name }}"
            echo "- run: ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            echo
            echo "### battery verdicts (the init's sentinel rows)"
            echo
            echo '```'
            grep -E '^MASS-(RESULT|VERDICT)' vm.log || true
            echo '```'
            echo
            echo "### FAIL/SKIP inventory (the busy-hour residual's home)"
            echo
            echo '```'
            grep -E '^  (X  |-- )' vm.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
