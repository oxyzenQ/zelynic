name: Docs CI

on:
  push:
    paths:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.rst'
      - 'LICENSE'
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.rst'
      - 'LICENSE'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Docs Spelling Check
    # Runner pinned to ubuntu-24.04, never a floating ubuntu-latest:
    # the label migrates to Ubuntu 26 on 2026-10-19 and would silently
    # move the build environment (actions/runner-images#14748); OS
    # upgrades here are deliberate, matrix-tested changes.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, NIGHT-hunt-20 SHA pin

      # Pinned to match the gate-keepers job's codespell (NIGHT-hunt-20
      # supply-chain pin discipline — same version, same findings).
      - name: Install codespell (pinned 2.4.3)
        run: python3 -m pip install --user codespell==2.4.3

      - name: Check documentation files
        run: |
          find . -type f \( -name '*.md' -o -name '*.txt' -o -name '*.rst' \) \
            -print0 | xargs -0r codespell --config .codespellrc
