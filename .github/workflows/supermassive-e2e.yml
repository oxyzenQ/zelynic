# =============================================================================
#
# zelynic - SUPERMASSIVE E2E (the depth-stresstest lane;
# night-dragon-maintenance-2, the owner's ask: the ultimate real CI
# function is an end-to-end realtime depth stresstest of ALL the
# existing CLI surfaces, in the real user and root modes, on the
# kernel span — the sibling's supermassive-e2e contract, sized to
# zelynic's own physics).
#
# The contract: every surface, every guard, every error path,
# exercised against the REAL compiled binary, on the kernel span.
# night-T-1 reshaped the LANE, never the depth: a stage job builds
# the release-tier v3 payload and BOTH kernel envelopes' initramfs
# ONCE (the jammy 5.15.0 floor + the archive's dynamically resolved
# latest, nothing pinned), uploads them as artifacts, and every
# per-push shard boots the SAME initramfs naming its slice on the
# kernel cmdline (zelynic-suite=, scripts/ci/e2e-init.sh reads it
# from /proc/cmdline). The shard map keeps every per-push job at a
# ~5-minute target (the owner's night-T-1 ask: no single run may
# hang the waiting game for half an hour):
#   fast    = the USER-mode nonroot contract + the realtime limiter
#             depth stresstest (the two depth suites that fit one
#             boot's budget together)
#   surface = the whole-CLI smoke battery + the quota saver A/B
#             proof
# and the ONE suite that is irreducible serial physics — the
# endurance clocks, whose 300-cycle churn exists to walk ~300 fresh
# group slots against the 256-entry map cap (the boundary crossing
# IS the test, so it is never sharded and never shortened) — rides
# its own shard on the NIGHTLY schedule, full depth, while nobody
# waits. Depth is never cut anywhere: per-push still proves 4 of
# the 5 suites on both kernel envelopes plus the arm64 host, the
# nightly proves the fifth.
#
# The arm64 variant (the owner's arm64 mandate): the IDENTICAL
# shard contract, run HOST-NATIVE on the free arm64 runner
# (ubuntu-24.04-arm) — stage-arm64 builds the pro-native-arm64-musl
# payload once, the arm shards stage it into /opt/zelynic-e2e and
# drive scripts/ci/e2e-native.sh (e2e-init.sh's host-native twin:
# the same five canonical invocations, verify-not-mount surfaces, a
# real exit code added to the sentinel relay) with the same --suite
# selector. The arm hosted fleet exposes no /dev/kvm at any tier
# (actions/runner-images#14062, maintainer answer: the Azure Arm
# SKU surfaces no nested KVM device), so the KVM micro-VM contract
# is x86-only by platform law — and TCG emulation is no variant at
# all for a realtime suite whose subject IS the pacer's hrtimer
# fidelity. The arm64 payload relay is within-run (stage job ->
# artifact -> shards of the SAME run, one uniform runner SKU) — the
# cross-generation SIGILL lottery class the cache rules guard
# against is a cross-run reuse, not this relay.
#
# The suite lives in scripts/ci/e2e-init.sh (its header is the
# contract's home); the arm64 leg's twin lives in
# scripts/ci/e2e-native.sh (its header is its own contract's home).
# This file only makes the legs run. Five
# canonical invocations per full sweep, the modes the owner named:
# the unprivileged USER leg first (nonroot-depth-test.sh - the
# honest refusal contract), then the ROOT legs (zelynic is a root
# tool - README's "Linux kernel 5.15.0+, cgroup v2, root" - so the
# enforcement depth is root by design): the limiter depth
# stresstest (measured rates + BPF-counter cross-checks, full
# depth), the endurance clocks (full churn + monitor soak), the
# whole-CLI-surface smoke battery. Real KVM, real eBPF, real user
# AND real root - no container shortcut, no simulation.
#
# Why a separate lane from supermassive.yml: that lane owns the
# limiter matrix and its engine batteries (v1-v4, the MMSPA A/B,
# the three root rig suites) on the same kernel span; this lane
# owns the per-surface end-to-end depth - the five depth suites
# no other CI lane executes (the depth audit's finding: all five
# had ZERO CI wiring, owner-local only). Two contracts, two lanes
# - neither reduces the other.
#
# Build shape (the owner's from-source law): the stage job builds
# the pro-linux-amd64-v3-musl alias - the release page's amd64-v3
# tier, fully static musl (night-dragon-maintenance-6: musl is the
# ONLY shipped shape; the gnu payload retired with the gnu
# packaging), NEVER a bare `cargo build --release` (no release
# package ever shipped that shape; the binary the depth suite
# exercises is the binary the release ships). The RUSTFLAGS
# composition carries the -D warnings lead plus the alias's
# target-cpu and crt-static tokens verbatim (the
# workflow-level-shadowing incident's lesson, ci.yml's pro block),
# and the artifact is verified through its embedded build label
# before it ships into the guest.
#
# Trigger discipline (the owner's unfiltered-CI simplification):
# every push (any branch, any tag) and every pull request (any
# base) burns the per-push shards - no path filter, no branch
# filter, the same blind posture every push-triggered lane in the
# estate now carries. workflow_dispatch stays as the manual
# recovery lane AND runs the nightly shards (a dispatch is the
# full sweep). The schedule (20:00 UTC = the small hours in the
# owner's Asia/Jakarta evening) runs the endurance shards only:
# the night train nobody waits for.
#
# The jobs fail on any FAIL (every suite exits 1 on its own
# failure, and the init's E2E-VERDICT relay aggregates the rows;
# 0 = all passed; the verdict lines are the contract the Verdict
# step greps - the VM cannot relay exit codes through qemu).

name: Dragon Guard - Supermassive E2E

"on":
  push:
  pull_request:
  schedule:
    # 20:00 UTC = 03:00 WIB (the owner's Asia/Jakarta night): the
    # endurance shards run while nobody waits. A push neither
    # cancels nor is cancelled by this train (the concurrency
    # group splits the two worlds below).
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The night train lives in its own group: a push never cancels a
  # running schedule (and vice versa), while pushes keep cancelling
  # each other exactly as before.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-
    ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'night' || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  # The estate's JS-action runtime pin (every other workflow carries
  # it; this lane was the one straggler, night-dragon-maintenance-6).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── the stage: build once, boot many ────────────────────────────────
  # The x86 stage job is the lane's only build: the release-tier v3
  # payload plus BOTH kernel envelopes (the jammy 5.15.0 floor deb
  # and the archive's dynamically resolved latest), each packed with
  # the SAME userland into its own initramfs (the rootfs draws from
  # ubuntu:24.04, the guest tooling's ABI - python3, nft, bpftool -
  # nothing the static musl payload depends on). The artifacts are
  # the only thing the VM shards download; no shard pays for a
  # toolchain, a cargo tree, or a kernel resolver again.
  stage:
    name: supermassive e2e - stage (payload + both kernel envelopes)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, NIGHT-hunt-20 SHA pin
        with:
          persist-credentials: false

      - name: Install cpio
        run: |-
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends cpio

      # The toolchain set mirrors ci.yml's musl job (the same three
      # install steps): the pinned stable + musl target for the payload
      # build, the dated nightly for the nested pure-Rust eBPF crate
      # build the ebpf feature drives, and the pinned prebuilt
      # bpf-linker.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl

      - name: Install eBPF nightly toolchain (dated pin)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: nightly-2026-09-18
          components: rust-src

      - name: Install bpf-linker 0.11.1 (prebuilt static musl)
        run: bash scripts/dev/install-bpf-linker.sh

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6, NIGHT-hunt-20 SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ebpf/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The owner's from-source law: the release-tier alias, never a
      # bare cargo build --release. The RUSTFLAGS lead is the
      # -D-warnings-plus-alias-token composition ci.yml's pro block
      # carries (an env RUSTFLAGS shadows every config rustflags, so
      # the alias invocation IS the contract under test); the
      # explicit --target keeps RUSTFLAGS off the host proc-macro
      # world (the SIGILL incident's lesson). The artifact is
      # verified through its embedded build label - v3 executes
      # everywhere (every x86_64 runner since Haswell), so the -V
      # gate runs live.
      - name: Build the release-tier v3 payload (pro-linux-amd64-v3-musl)
        run: |
          set -euo pipefail
          RUSTFLAGS="-D warnings -C target-cpu=x86-64-v3 -C target-feature=+crt-static" \
            cargo pro-linux-amd64-v3-musl --locked
          ./target/x86_64-unknown-linux-musl/pro-linux-amd64-v3-musl/zelynic -V | grep -F "Build: local-pro-linux-amd64-v3-musl"

      # The jammy 5.15.0 floor leg (night-dragon-maintenance-4 kept
      # the leg's own principle alive; night-netrunner-1 made it THE
      # floor lane: a kernel "inside the proven span" never BOOTS in
      # the low-specs envelope, so a floor-ABI regression (a verifier
      # change, a map-layout shift) is invisible until this leg
      # exists. Jammy is a LIVE LTS: the kernels come from the main
      # archive, dynamically resolved to the newest 5.15.0-ABI
      # jammy-updates point release - no URL rot, no pinned ABI. The
      # 5\.15\.0- anchor deliberately excludes jammy's HWE 6.x
      # images - those are the best leg's jurisdiction. The
      # config-driven virtio staging walk stages whatever the deb's
      # own config names, =y or =m.
      - name: Fetch the jammy 5.15.0 LTS kernel (low specs)
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage/jammy && cd /tmp/stage/jammy
          {
            echo "deb http://archive.ubuntu.com/ubuntu/ jammy main"
            echo "deb http://archive.ubuntu.com/ubuntu/ jammy-updates main"
          } | sudo tee /etc/apt/sources.list.d/jammy-floor.list >/dev/null
          sudo apt-get -o Acquire::Retries=5 update \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/jammy-floor.list \
            -o Dir::Etc::sourceparts=/dev/null \
            -o APT::Get::List-Cleanup=0
          IMG=$(apt-cache search --names-only \
            'linux-image-unsigned-5\.15\.0-.*-generic' 2>/dev/null \
            | grep -oE 'linux-image-unsigned-5\.15\.0-[0-9]+-generic' \
            | sort -V | tail -1 || true)
          if test -z "$IMG"; then
            echo "FAIL: no linux-image-unsigned-5.15.0-*-generic in the jammy pockets - resolver evidence:"
            apt-cache search --names-only 'linux-image-unsigned-5\.15' || true
            exit 1
          fi
          echo "resolved: $IMG"
          apt-get -o Acquire::Retries=5 download "$IMG"
          dpkg -x "${IMG}"*_amd64.deb pkg
          VMLINUZ=$(find pkg/boot -name 'vmlinuz-5.15.*' | head -1)
          if test -z "$VMLINUZ"; then
            echo "FAIL: no vmlinuz inside the deb - pkg/boot contents:"
            ls -la pkg/boot || true
            exit 1
          fi
          cp "$VMLINUZ" /tmp/stage/jammy/vmlinuz-floor
          echo "kernel: $(du -h /tmp/stage/jammy/vmlinuz-floor | cut -f1) at /tmp/stage/jammy/vmlinuz-floor"
          # The egress half: the config-driven staging walk (the
          # same walk supermassive.yml's floor lane runs -
          # failover.ko under net/core owns the symbols
          # net_failover.ko imports - three modules,
          # bottom-up, when the driver is a module).
          KVER="${IMG#linux-image-unsigned-}"
          MODPKG="linux-modules-$KVER"
          apt-get -o Acquire::Retries=5 download "$MODPKG"
          rm -rf mods /tmp/stage/jammy/virtio-mods
          dpkg-deb -x "${MODPKG}"*_amd64.deb mods
          CFG="mods/boot/config-$KVER"
          test -f "$CFG" || {
            echo "FAIL: no config-$KVER inside $MODPKG - deb contents:"
            ls mods/boot || true
            exit 1
          }
          VNET=$(sed -n 's/^CONFIG_VIRTIO_NET=\(.*\)$/\1/p' "$CFG")
          case "$VNET" in
            y)  echo "virtio_net built-in (=y) - no modules to stage" ;;
            m)  STG="/tmp/stage/jammy/virtio-mods/lib/modules/$KVER/kernel"
                mkdir -p "$STG/net/core" "$STG/drivers/net"
                stage_mod() {
                  mod=$1; dir=$2; flag=$3
                  WANT=$(sed -n "s/^CONFIG_$flag=\(.*\)$/\1/p" "$CFG")
                  if [ "$WANT" = "m" ]; then
                    SRC="mods/lib/modules/$KVER/kernel/$dir/$mod.ko"
                    test -f "$SRC" || { echo "FAIL: $mod.ko absent from $MODPKG (config says =m)"; exit 1; }
                    cp "$SRC" "$STG/$dir/"
                  fi
                }
                stage_mod failover net/core FAILOVER
                stage_mod net_failover drivers/net NET_FAILOVER
                stage_mod virtio_net drivers/net VIRTIO_NET
                echo "staged virtio modules: $(du -sh /tmp/stage/jammy/virtio-mods | cut -f1)"
                echo "  at /tmp/stage/jammy/virtio-mods" ;;
            *)  echo "FAIL: CONFIG_VIRTIO_NET=$VNET - no usable virtio-net driver on this kernel"; exit 1 ;;
          esac

      # The latest kernel (NIGHT-improve-33's resolver, the best-specs
      # twin): resolved DYNAMICALLY at run time, nothing pinned. The
      # dists index names every live base suite; each suite's Release
      # carries Date + Codename; the two newest DISTINCT codenames
      # (the dedupe is load-bearing - mid-cycle the index lists the
      # devel alias AND its target codename pointing at the same
      # content) become the apt sources, main + -updates pockets each
      # (proposed deliberately excluded - pre-release is not
      # "latest"), and the newest generic unsigned image wins via
      # sort -V. When Ubuntu ships its next release, this resolver
      # walks onto it without an edit; an archive restructure fails
      # LOUDLY with the discovery evidence attached.
      - name: Resolve the archive's latest kernel (best specs)
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage/best && cd /tmp/stage/best
          SUITES=$(curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 --retry-max-time 300 --connect-timeout 15 \
            http://archive.ubuntu.com/ubuntu/dists/ \
            | grep -oE 'href="[a-z0-9]+/"' | cut -d'"' -f2 | tr -d '/' \
            | grep -v -- '-' | sort -u)
          if test -z "$SUITES"; then
            echo "FAIL: the dists index resolved no base suites - archive restructure?"
            curl -fsSL --retry 6 --retry-all-errors http://archive.ubuntu.com/ubuntu/dists/ | head -40 || true
            exit 1
          fi
          echo "base suites: $(echo "$SUITES" | tr '\n' ' ')"
          RELEASES=$(for s in $SUITES; do
            rel=$(curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 --retry-max-time 300 --connect-timeout 15 \
              "http://archive.ubuntu.com/ubuntu/dists/$s/Release")
            d=$(echo "$rel" | sed -n 's/^Date: //p' | head -1)
            c=$(echo "$rel" | sed -n 's/^Codename: //p' | head -1)
            if test -n "$d" && test -n "$c"; then
              echo "$(date -d "$d" +%s 2>/dev/null || echo 0) $c"
            fi
          done | sort -rn -k1,1 | awk '!seen[$2]++')
          DATED=$(echo "$RELEASES" | head -2 | awk '{print $2}')
          if test -z "$DATED"; then
            echo "FAIL: no suite Release carried Date+Codename - resolver evidence above"
            exit 1
          fi
          echo "newest distinct codenames: $(echo "$DATED" | tr '\n' ' ')"
          {
            for s in $DATED; do
              echo "deb http://archive.ubuntu.com/ubuntu/ $s main"
              echo "deb http://archive.ubuntu.com/ubuntu/ $s-updates main"
            done
          } | sudo tee /etc/apt/sources.list.d/latest-head.list >/dev/null
          sudo apt-get -o Acquire::Retries=5 update \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/latest-head.list \
            -o Dir::Etc::sourceparts=/dev/null \
            -o APT::Get::List-Cleanup=0
          IMG=$(apt-cache search --names-only 'linux-image-unsigned' 2>/dev/null \
            | awk '{print $1}' \
            | grep -E '^linux-image-unsigned-[0-9]+\.[0-9]+\.0-[0-9]+-generic$' \
            | sort -V | tail -1 || true)
          if test -z "$IMG"; then
            echo "FAIL: no generic unsigned kernel image resolved across the newest suites - index evidence:"
            apt-cache search --names-only 'linux-image-unsigned' | head -20 || true
            exit 1
          fi
          echo "resolved: $IMG"
          apt-get -o Acquire::Retries=5 download "$IMG"
          dpkg -x "${IMG}"*_amd64.deb pkg
          VMLINUZ=$(find pkg/boot -type f -name 'vmlinuz-*' | head -1)
          if test -z "$VMLINUZ"; then
            echo "FAIL: no vmlinuz inside the deb - pkg/boot contents:"
            ls -la pkg/boot || true
            exit 1
          fi
          cp "$VMLINUZ" /tmp/stage/best/vmlinuz-floor
          echo "kernel: $(du -h /tmp/stage/best/vmlinuz-floor | cut -f1) at /tmp/stage/best/vmlinuz-floor"
          # The egress half, the latest-kernel twin: the SAME
          # config-driven staging walk (the modern heads ship
          # CONFIG_VIRTIO_NET=y - the walk exists so the day a head
          # flips the flag back to =m, this leg stages the trio
          # instead of reddening the egress row the init judges).
          KVER="${IMG#linux-image-unsigned-}"
          MODPKG="linux-modules-$KVER"
          apt-get -o Acquire::Retries=5 download "$MODPKG"
          rm -rf mods /tmp/stage/best/virtio-mods
          dpkg-deb -x "${MODPKG}"*_amd64.deb mods
          CFG="mods/boot/config-$KVER"
          test -f "$CFG" || {
            echo "FAIL: no config-$KVER inside $MODPKG - deb contents:"
            ls mods/boot || true
            exit 1
          }
          VNET=$(sed -n 's/^CONFIG_VIRTIO_NET=\(.*\)$/\1/p' "$CFG")
          case "$VNET" in
            y)  echo "virtio_net built-in (=y) - no modules to stage" ;;
            m)  STG="/tmp/stage/best/virtio-mods/lib/modules/$KVER/kernel"
                mkdir -p "$STG/net/core" "$STG/drivers/net"
                stage_mod() {
                  mod=$1; dir=$2; flag=$3
                  WANT=$(sed -n "s/^CONFIG_$flag=\(.*\)$/\1/p" "$CFG")
                  if [ "$WANT" = "m" ]; then
                    SRC="mods/lib/modules/$KVER/kernel/$dir/$mod.ko"
                    test -f "$SRC" || { echo "FAIL: $mod.ko absent from $MODPKG (config says =m)"; exit 1; }
                    cp "$SRC" "$STG/$dir/"
                  fi
                }
                stage_mod failover net/core FAILOVER
                stage_mod net_failover drivers/net NET_FAILOVER
                stage_mod virtio_net drivers/net VIRTIO_NET
                echo "staged virtio modules: $(du -sh /tmp/stage/best/virtio-mods | cut -f1)"
                echo "  at /tmp/stage/best/virtio-mods" ;;
            *)  echo "FAIL: CONFIG_VIRTIO_NET=$VNET - no usable virtio-net driver on this kernel"; exit 1 ;;
          esac

      # The userland, held CONSTANT across both envelopes on purpose
      # (the leg's only variables are the kernel and the resource
      # envelope): one assemble() walk per envelope directory, the
      # docker-export userland staged with the checkout tree, the
      # payload, and scripts/ci/e2e-init.sh as /init (PID 1). The
      # QUIC stack stays OFF this rootfs: none of the five suites
      # drives HTTP/3 (that row is supermassive.yml's v1 contract),
      # so the RAM-resident cpio stays lean. The dir is swept back
      # to the boot pair (kernel + initramfs) before the artifact
      # upload - the shards download the bundle, never the build
      # furniture.
      - name: Assemble the micro-VM rootfs (both envelopes)
        run: |
          set -euo pipefail
          SUITE=ubuntu:24.04
          PAYLOAD="$GITHUB_WORKSPACE/target/x86_64-unknown-linux-musl/pro-linux-amd64-v3-musl/zelynic"
          echo "rootfs suite: $SUITE (payload: pro-linux-amd64-v3-musl, static)"
          docker pull -q "$SUITE"
          docker rm -f e2e-rootfs >/dev/null 2>&1 || true
          docker run --name e2e-rootfs -d "$SUITE" sleep infinity
          # NIGHT-dinner-12's knob rides the rootfs lane too (the
          # both-halves contract; run 579's mirror-sync red is the
          # class - the sibling lane carries the full note).
          docker exec e2e-rootfs apt-get -o Acquire::Retries=5 update -qq
          docker exec e2e-rootfs apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            python3 iproute2 kmod curl nftables ca-certificates
          docker exec e2e-rootfs sh -ec '
            cd /tmp || exit 1
            resolve() {
              apt-cache depends "$1" \
                | sed -n "s/^ *Depends: \(linux-tools-[0-9][^ ]*\) *$/\1/p" \
                | head -n1
            }
            pkg=$(resolve linux-tools-generic)
            test -n "$pkg" || { echo "FAIL: no per-kernel linux-tools resolved"; exit 1; }
            src=""
            for _ in 1 2 3; do
              apt-get -o Acquire::Retries=5 download "$pkg" >/dev/null
              rm -rf /tmp/bpx
              dpkg-deb -x "${pkg}"_*.deb /tmp/bpx
              src=$(find /tmp/bpx/usr/lib -type f -name bpftool | head -n1)
              test -n "$src" && break
              next=$(resolve "$pkg")
              test -n "$next" || break
              test "$next" != "$pkg" || break
              pkg="$next"
            done
            test -n "$src" || { echo "FAIL: no bpftool inside the linux-tools chain ($pkg)"; exit 1; }
            install -m 0755 "$src" /usr/bin/bpftool
            rm -rf /tmp/bpx /tmp/linux-tools-*.deb
          '
          docker export e2e-rootfs -o /tmp/stage/rootfs.tar
          assemble() {
            DIR=$1
            cd "$DIR"
            mkdir -p rootfs
            tar -xf /tmp/stage/rootfs.tar -C rootfs
            mkdir -p rootfs/opt/zelynic
            git -C "$GITHUB_WORKSPACE" archive HEAD | tar -x -C rootfs/opt/zelynic
            cp "$PAYLOAD" rootfs/opt/zelynic/zelynic
            printf '%s\n' 'pro-linux-amd64-v3-musl' > rootfs/opt/zelynic/PAYLOAD-SHAPE
            cp "$GITHUB_WORKSPACE/scripts/ci/e2e-init.sh" rootfs/init
            chmod +x rootfs/init
            # The virtio module pair a resolver step staged (the floor
            # envelopes whose driver is =m) rides the cpio under the
            # kernel's own module path; the =y heads staged nothing and
            # the init's insmod chain simply finds no files. The copy
            # respects the usr-merge (run 37518266382's lesson: the
            # ubuntu containers ship /lib as a SYMLINK to usr/lib).
            if [ -d "$DIR/virtio-mods" ]; then
              if [ -L rootfs/lib ]; then
                mkdir -p rootfs/usr/lib
                cp -a "$DIR/virtio-mods/lib/modules" rootfs/usr/lib/
              else
                mkdir -p rootfs/lib
                cp -a "$DIR/virtio-mods/lib/modules" rootfs/lib/
              fi
              echo "virtio modules staged into the rootfs cpio"
            fi
            # PID 1 needs a console to exec onto before devtmpfs lands
            # (the kernel opens the initramfs's static /dev/console for
            # it; the init's devtmpfs mount takes over from there). The
            # docker export ships a /dev/console entry tar could not
            # restore as a device - remove whatever landed, mknod the
            # real char device fresh.
            sudo rm -f rootfs/dev/console
            sudo mknod -m 600 rootfs/dev/console c 5 1
            ( cd rootfs && sudo find . -print0 | sudo cpio --null -o -H newc ) | gzip -1 > initrd.gz
            echo "initramfs: $(du -h initrd.gz | cut -f1)"
            # The sweep: the artifact carries the boot pair only.
            rm -rf rootfs rootfs.tar pkg mods ./*.deb
          }
          assemble /tmp/stage/jammy
          assemble /tmp/stage/best

      - name: Upload the jammy floor micro-VM bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, NIGHT-hunt-20 SHA pin
        with:
          name: e2e-vm-jammy
          path: /tmp/stage/jammy
          retention-days: 3

      - name: Upload the latest-kernel micro-VM bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, NIGHT-hunt-20 SHA pin
        with:
          name: e2e-vm-best
          path: /tmp/stage/best
          retention-days: 3

  # ── the arm64 stage: the payload once, on the arm silicon ───────────
  # stage-arm64 builds the pro-native-arm64-musl alias ONCE per run
  # (the RUSTFLAGS composition mirrors ci.yml's arm64 proof leg: the
  # -D-warnings lead plus the alias's target-cpu and crt-static
  # tokens verbatim) and hands it to the arm shards as an artifact.
  # The relay is within-run and the arm fleet is one uniform SKU —
  # the cross-generation SIGILL lottery class the cache rules guard
  # against is a cross-run reuse, not this relay.
  stage-arm64:
    name: supermassive e2e - stage arm64 (pro-native-arm64-musl)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, NIGHT-hunt-20 SHA pin
        with:
          persist-credentials: false

      - name: Install Rust toolchain (arm64)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt
          targets: aarch64-unknown-linux-musl

      - name: Install eBPF nightly toolchain (dated pin)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: nightly-2026-09-18
          components: rust-src

      - name: Install bpf-linker 0.11.1 (prebuilt static musl)
        run: bash scripts/dev/install-bpf-linker.sh

      - name: Cache cargo registry (arm64, registry only)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6, NIGHT-hunt-20 SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-e2e-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-e2e-arm64-cargo-

      - name: Build the arm64 native payload (pro-native-arm64-musl)
        run: |
          set -euo pipefail
          RUSTFLAGS="-D warnings -C target-cpu=native -C target-feature=+crt-static" \
            cargo pro-native-arm64-musl --locked
          ./target/aarch64-unknown-linux-musl/pro-native-arm64-musl/zelynic -V | grep -F "Build: local-pro-native-arm64-musl"

      - name: Upload the arm64 native payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, NIGHT-hunt-20 SHA pin
        with:
          name: e2e-arm64-payload
          path: target/aarch64-unknown-linux-musl/pro-native-arm64-musl/zelynic
          retention-days: 3

  # ── the per-push shards: fast + surface, three envelopes ───────────
  # Every shard: download the staged bundle, boot (or stage natively),
  # run ONE slice, grep the verdict. The wall clock is the slowest
  # SINGLE shard — the owner's night-T-1 target, never the sum of the
  # suite again.
  supermassive-e2e:
    name: ${{ matrix.title }}
    needs: [stage, stage-arm64]
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: supermassive e2e - fast lane (nonroot + limiter depth, the jammy 5.15.0 LTS floor kernel)
            profile: jammy
            shard: fast
            vm_timeout: 600
          - title: supermassive e2e - surface lane (smoke + quota A/B, the jammy 5.15.0 LTS floor kernel)
            profile: jammy
            shard: surface
            vm_timeout: 720
          - title: supermassive e2e - fast lane (nonroot + limiter depth, the archive's latest kernel)
            profile: best
            shard: fast
            vm_timeout: 600
          - title: supermassive e2e - surface lane (smoke + quota A/B, the archive's latest kernel)
            profile: best
            shard: surface
            vm_timeout: 720
          - title: supermassive e2e - fast lane (nonroot + limiter depth, the native arm64 runner host)
            profile: arm64
            shard: fast
            vm_timeout: 600
          - title: supermassive e2e - surface lane (smoke + quota A/B, the native arm64 runner host)
            profile: arm64
            shard: surface
            vm_timeout: 720
    # The arm64 shards ride the free arm64 runner (public-repo free,
    # zero runner-minute cost); the x86 shards keep the standard image.
    runs-on: ${{ matrix.profile == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, NIGHT-hunt-20 SHA pin
        with:
          persist-credentials: false

      # The kernel can change; /dev/kvm is a GitHub runner guarantee
      # on this image family, but the node ships 0660 root:kvm and
      # the runner user is not in the kvm group, so the job opens it
      # up itself. Failing LOUDLY here beats a confusing TCG
      # fallback: the payload is x86-64-v3 codegen and would SIGILL
      # under TCG's -cpu qemu64.
      - name: Verify KVM
        if: matrix.profile != 'arm64'
        run: |
          test -e /dev/kvm || {
            echo "FAIL: /dev/kvm is absent - this runner image cannot boot the micro-VM"
            exit 1
          }
          test -w /dev/kvm || sudo chmod 666 /dev/kvm
          test -w /dev/kvm || {
            echo "FAIL: /dev/kvm is not usable by the runner user even after chmod"
            ls -l /dev/kvm
            exit 1
          }
          echo "OK: /dev/kvm present and usable"

      - name: Install qemu
        if: matrix.profile != 'arm64'
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends qemu-system-x86

      # The staged bundle (kernel + initramfs, the stage job's own
      # build for THIS run's HEAD): the shard downloads its envelope
      # and boots it — no toolchain, no resolver, no assembly.
      - name: Download the staged micro-VM bundle
        if: matrix.profile != 'arm64'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8, NIGHT-hunt-20 SHA pin
        with:
          name: e2e-vm-${{ matrix.profile }}
          path: /tmp/kfloor

      # The arm64 shard's host: the suite userland drawn from the
      # runner's own apt (the guest legs assemble the identical set
      # into the rootfs cpio - the userland held constant across
      # legs), and the kernel surfaces ensured idempotently (cgroup
      # v2 unified, bpffs, loopback). The HOST owns them here -
      # scripts/ci/e2e-native.sh verify-fails-loudly on all of them
      # before any suite runs, never silently shallow.
      - name: Prepare the arm64 native leg (userland + kernel surfaces)
        if: matrix.profile == 'arm64'
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            python3 iproute2 kmod curl nftables linux-tools-generic
          sudo ip link set lo up
          mountpoint -q /sys/fs/bpf || sudo mount -t bpf bpf /sys/fs/bpf
          test "$(stat -fc %T /sys/fs/cgroup)" = "cgroup2fs" || {
            echo "FAIL: /sys/fs/cgroup is $(stat -fc %T /sys/fs/cgroup), wanted cgroup2fs"
            exit 1
          }

      - name: Download the staged arm64 payload
        if: matrix.profile == 'arm64'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8, NIGHT-hunt-20 SHA pin
        with:
          name: e2e-arm64-payload
          path: target/aarch64-unknown-linux-musl/pro-native-arm64-musl

      # Boot the micro-VM: direct kernel boot, KVM host-passthrough
      # CPU, no disk, serial console to stdout, panic=-1 + -no-reboot
      # so a kernel panic ends qemu instead of hanging the job, the
      # shard's outer timeout (a wedged guest can never burn the job
      # budget), SLIRP user-mode networking (the deterministic
      # 10.0.2.x shape the init configures), and the isa-debug-exit
      # device - the guest ends the VM deterministically by writing
      # one byte to port 0xf4 (qemu exits with status 1), the
      # kernel-CI standard for initramfs guests whose direct-boot
      # path never reaches an ACPI S5 poweroff.
      #
      # The DYNAMIC envelope (the owner's "cpu core, ram, etc don't
      # set fixed let dynamic"): derived from the runner at boot
      # time - low specs takes one quarter of the cores (floored at
      # 1) and one eighth of the RAM (floored at 1024 MB), best
      # specs takes every core and three quarters of the RAM. The
      # pair scales with GitHub's hardware instead of pinning one
      # era's runner shape.
      #
      # zelynic-suite=${{ matrix.shard }}: the shard's slice, read by
      # the init from /proc/cmdline (scripts/ci/e2e-init.sh's
      # night-T-1 relay) - ONE staged initramfs, the selector rides
      # the boot.
      - name: Boot the micro-VM and run the E2E depth shard
        if: matrix.profile != 'arm64'
        run: |
          set -euo pipefail
          cd /tmp/kfloor
          CORES=$(nproc)
          TOTAL_MB=$(free -m | awk '/^Mem:/{print $2}')
          if [ "${{ matrix.profile }}" != "best" ]; then
            SMP=$(( CORES / 4 )); [ "$SMP" -lt 1 ] && SMP=1
            MEM=$(( TOTAL_MB / 8 )); [ "$MEM" -lt 1024 ] && MEM=1024
          else
            SMP=$CORES
            MEM=$(( TOTAL_MB * 3 / 4 ))
          fi
          echo "envelope: $SMP vCPU / $MEM MB (of $CORES cores / $TOTAL_MB MB on the runner)"
          set +e
          timeout ${{ matrix.vm_timeout }} qemu-system-x86_64 \
            -machine q35,accel=kvm -cpu host \
            -m "$MEM" -smp "$SMP" \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0 \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
            -kernel vmlinuz-floor \
            -initrd initrd.gz \
            -append "console=ttyS0 panic=-1 zelynic-suite=${{ matrix.shard }}" \
            -nographic -no-reboot 2>&1 | tee vm.log
          QEMU_RC=${PIPESTATUS[0]}
          set -e
          # rc 0 = a natural poweroff; rc 1 = the guest's deliberate
          # isa-debug-exit (the verdict itself rides the E2E-*
          # sentinel lines, so the Verdict step below stays the
          # authority). Anything else - the shard's timeout (124),
          # a KVM init failure - fails HERE with the tail attached.
          if test "$QEMU_RC" -ne 0 && test "$QEMU_RC" -ne 1; then
            echo "FAIL: qemu exited $QEMU_RC - log tail:"
            tail -40 vm.log
            exit 1
          fi
          exit 0

      # The arm64 shard's run: the host-native twin drives this
      # shard's slice of the identical five-suite depth contract on
      # the runner itself (no guest to boot - the arm fleet's
      # platform law), the same wedge-guard outer bound around the
      # suite that the VM legs wrap around qemu, the log tee'd into
      # the SAME vm.log file the shared Verdict and Watch steps
      # grep, and the real exit code the guest cannot carry gating
      # the step on top of the sentinel relay.
      - name: Run the E2E depth shard natively on the arm64 host
        if: matrix.profile == 'arm64'
        run: |
          set -euo pipefail
          mkdir -p /tmp/kfloor
          # The guest's own staging shape (tracked files only + the
          # payload, world-readable under /opt): run 42870927440's
          # lesson - the runner's home tree is not nobody-traversable,
          # so the USER-mode leg's setpriv exec and the smoke battery's
          # unprivileged rows hit Permission denied straight at the
          # path. The guest rootfs assembly ships /opt/zelynic; the
          # host twin stages /opt/zelynic-e2e the same way and the
          # twin runs FROM it (its repo-root law resolves to the
          # stage).
          STAGE=/opt/zelynic-e2e
          sudo rm -rf "$STAGE"
          sudo mkdir -p "$STAGE/target/aarch64-unknown-linux-musl/pro-native-arm64-musl"
          git -C "$GITHUB_WORKSPACE" archive HEAD | sudo tar -x -C "$STAGE"
          sudo cp "$GITHUB_WORKSPACE/target/aarch64-unknown-linux-musl/pro-native-arm64-musl/zelynic" \
            "$STAGE/target/aarch64-unknown-linux-musl/pro-native-arm64-musl/zelynic"
          cd "$GITHUB_WORKSPACE"
          set +e
          # ZELYNIC_UPLOAD_WINDOWS=4: the estimator-rung widen (the
          # rig's own comment carries the run 42870927440 evidence) —
          # more samples of the same honest max for the host whose
          # physics sit outside the guest envelope; the x86 legs keep
          # the default 2 untouched. --suite names the shard's slice
          # (the twin's night-T-1 relay, the cmdline param's argv
          # twin).
          sudo ZELYNIC_UPLOAD_WINDOWS=4 timeout ${{ matrix.vm_timeout }} \
            bash "$STAGE/scripts/ci/e2e-native.sh" \
            --binary "$STAGE/target/aarch64-unknown-linux-musl/pro-native-arm64-musl/zelynic" \
            --suite "${{ matrix.shard }}" \
            2>&1 | tee /tmp/kfloor/vm.log
          RC=${PIPESTATUS[0]}
          set -e
          if test "$RC" -ne 0; then
            echo "FAIL: the native arm64 suite exited $RC - log tail:"
            tail -40 /tmp/kfloor/vm.log
            exit 1
          fi
          exit 0

      # The verdict lives in the log (the VM cannot relay exit codes
      # through qemu; the E2E-RESULT / E2E-VERDICT sentinel lines are
      # the contract - scripts/ci/e2e-init.sh owns them).
      - name: Verdict
        run: |
          set -euo pipefail
          cd /tmp/kfloor
          echo "-- e2e depth verdicts (${{ matrix.title }}) --"
          grep -E '^E2E-(RESULT|VERDICT)' vm.log || true
          # The quota saver's A/B contract lines (night-netrunner-4):
          # the surface shard's guest prints them verbatim; the CI
          # output carries them (the task's own requirement - the two
          # lines in the final output), a missing pair on a green
          # surface verdict impossible.
          grep -E '^test (download|upload) results the internet kuota save total is ' vm.log || true
          grep -q '^E2E-VERDICT: PASS' vm.log
          echo "OK: the E2E depth shard proven on the ${{ matrix.title }} leg"

      # The busy-hour residual watch (the estate's convention, the
      # same shape supermassive.yml carries): every run lands its
      # leg's FAIL/SKIP inventory in the step summary, so the Actions
      # history reads as the longitudinal dataset. This workflow
      # keeps contents: read; no in-repo writes, no artifact expiry.
      - name: Watch summary
        if: always()
        run: |
          cd /tmp/kfloor 2>/dev/null || exit 0
          {
            echo "## Dragon Guard watch - ${{ matrix.title }}"
            echo
            echo "- trigger: ${{ github.event_name }}"
            echo "- run: ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            echo
            echo "### suite verdicts (the init's sentinel rows)"
            echo
            echo '```'
            grep -E '^E2E-(RESULT|VERDICT)' vm.log || true
            echo '```'
            echo
            echo "### FAIL/SKIP inventory"
            echo
            echo '```'
            grep -E '^(FAIL|SKIP|X  |X )' vm.log | head -40 || true
            echo '```'
            echo
            echo "### quota saver A/B (the exact contract lines)"
            echo
            echo '```'
            grep -E '^test (download|upload) results the internet kuota save total is ' vm.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── the night train: the endurance clocks, WHOLE ───────────────────
  # The 300-cycle churn exists to walk ~300 fresh group slots against
  # the 256-entry map cap - the boundary crossing IS the test, so it
  # is never sharded (a fresh-map slice under 256 cycles would never
  # cross the boundary it exists to cross) and never shortened (the
  # budget buys headroom, never depth). It rides the schedule
  # instead: full depth, on the same envelopes as the per-push
  # shards, while the owner sleeps. workflow_dispatch runs it too -
  # a dispatch is the full sweep, the manual recovery lane.
  supermassive-e2e-endurance:
    name: ${{ matrix.title }}
    needs: [stage, stage-arm64]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: supermassive e2e - endurance clocks (night train, the jammy 5.15.0 LTS floor kernel)
            profile: jammy
            vm_timeout: 2400
          - title: supermassive e2e - endurance clocks (night train, the archive's latest kernel)
            profile: best
            vm_timeout: 1800
          - title: supermassive e2e - endurance clocks (night train, the native arm64 runner host)
            profile: arm64
            vm_timeout: 2400
    runs-on: ${{ matrix.profile == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, NIGHT-hunt-20 SHA pin
        with:
          persist-credentials: false

      - name: Verify KVM
        if: matrix.profile != 'arm64'
        run: |
          test -e /dev/kvm || {
            echo "FAIL: /dev/kvm is absent - this runner image cannot boot the micro-VM"
            exit 1
          }
          test -w /dev/kvm || sudo chmod 666 /dev/kvm
          test -w /dev/kvm || {
            echo "FAIL: /dev/kvm is not usable by the runner user even after chmod"
            ls -l /dev/kvm
            exit 1
          }
          echo "OK: /dev/kvm present and usable"

      - name: Install qemu
        if: matrix.profile != 'arm64'
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends qemu-system-x86

      - name: Download the staged micro-VM bundle
        if: matrix.profile != 'arm64'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8, NIGHT-hunt-20 SHA pin
        with:
          name: e2e-vm-${{ matrix.profile }}
          path: /tmp/kfloor

      - name: Prepare the arm64 native leg (userland + kernel surfaces)
        if: matrix.profile == 'arm64'
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            python3 iproute2 kmod curl nftables linux-tools-generic
          sudo ip link set lo up
          mountpoint -q /sys/fs/bpf || sudo mount -t bpf bpf /sys/fs/bpf
          test "$(stat -fc %T /sys/fs/cgroup)" = "cgroup2fs" || {
            echo "FAIL: /sys/fs/cgroup is $(stat -fc %T /sys/fs/cgroup), wanted cgroup2fs"
            exit 1
          }

      - name: Download the staged arm64 payload
        if: matrix.profile == 'arm64'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8, NIGHT-hunt-20 SHA pin
        with:
          name: e2e-arm64-payload
          path: target/aarch64-unknown-linux-musl/pro-native-arm64-musl

      - name: Boot the micro-VM and run the endurance clocks
        if: matrix.profile != 'arm64'
        run: |
          set -euo pipefail
          cd /tmp/kfloor
          CORES=$(nproc)
          TOTAL_MB=$(free -m | awk '/^Mem:/{print $2}')
          if [ "${{ matrix.profile }}" != "best" ]; then
            SMP=$(( CORES / 4 )); [ "$SMP" -lt 1 ] && SMP=1
            MEM=$(( TOTAL_MB / 8 )); [ "$MEM" -lt 1024 ] && MEM=1024
          else
            SMP=$CORES
            MEM=$(( TOTAL_MB * 3 / 4 ))
          fi
          echo "envelope: $SMP vCPU / $MEM MB (of $CORES cores / $TOTAL_MB MB on the runner)"
          set +e
          timeout ${{ matrix.vm_timeout }} qemu-system-x86_64 \
            -machine q35,accel=kvm -cpu host \
            -m "$MEM" -smp "$SMP" \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0 \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
            -kernel vmlinuz-floor \
            -initrd initrd.gz \
            -append "console=ttyS0 panic=-1 zelynic-suite=endurance" \
            -nographic -no-reboot 2>&1 | tee vm.log
          QEMU_RC=${PIPESTATUS[0]}
          set -e
          if test "$QEMU_RC" -ne 0 && test "$QEMU_RC" -ne 1; then
            echo "FAIL: qemu exited $QEMU_RC - log tail:"
            tail -40 vm.log
            exit 1
          fi
          exit 0

      - name: Run the endurance clocks natively on the arm64 host
        if: matrix.profile == 'arm64'
        run: |
          set -euo pipefail
          mkdir -p /tmp/kfloor
          STAGE=/opt/zelynic-e2e
          sudo rm -rf "$STAGE"
          sudo mkdir -p "$STAGE/target/aarch64-unknown-linux-musl/pro-native-arm64-musl"
          git -C "$GITHUB_WORKSPACE" archive HEAD | sudo tar -x -C "$STAGE"
          sudo cp "$GITHUB_WORKSPACE/target/aarch64-unknown-linux-musl/pro-native-arm64-musl/zelynic" \
            "$STAGE/target/aarch64-unknown-linux-musl/pro-native-arm64-musl/zelynic"
          cd "$GITHUB_WORKSPACE"
          set +e
          sudo ZELYNIC_UPLOAD_WINDOWS=4 timeout ${{ matrix.vm_timeout }} \
            bash "$STAGE/scripts/ci/e2e-native.sh" \
            --binary "$STAGE/target/aarch64-unknown-linux-musl/pro-native-arm64-musl/zelynic" \
            --suite endurance \
            2>&1 | tee /tmp/kfloor/vm.log
          RC=${PIPESTATUS[0]}
          set -e
          if test "$RC" -ne 0; then
            echo "FAIL: the native arm64 endurance clocks exited $RC - log tail:"
            tail -40 /tmp/kfloor/vm.log
            exit 1
          fi
          exit 0

      - name: Verdict
        run: |
          set -euo pipefail
          cd /tmp/kfloor
          echo "-- e2e depth verdicts (${{ matrix.title }}) --"
          grep -E '^E2E-(RESULT|VERDICT)' vm.log || true
          grep -q '^E2E-VERDICT: PASS' vm.log
          echo "OK: the endurance clocks proven on the ${{ matrix.title }} leg"

      - name: Watch summary
        if: always()
        run: |
          cd /tmp/kfloor 2>/dev/null || exit 0
          {
            echo "## Dragon Guard watch - ${{ matrix.title }}"
            echo
            echo "- trigger: ${{ github.event_name }}"
            echo "- run: ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            echo
            echo "### suite verdicts (the init's sentinel rows)"
            echo
            echo '```'
            grep -E '^E2E-(RESULT|VERDICT)' vm.log || true
            echo '```'
            echo
            echo "### FAIL/SKIP inventory"
            echo
            echo '```'
            grep -E '^(FAIL|SKIP|X  |X )' vm.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
