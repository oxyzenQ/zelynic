# CodeQL security analysis for zelynic.
#
# Auto-detects languages in the repository and runs CodeQL analysis.
# zelynic's security surface is Rust end to end (NIGHT-improve-1
# phase 3: the BPF datapath is the aya-ebpf crate under ebpf/, and
# the objects are embedded in the binary); the analysis is pinned to
# `rust`, which now covers the whole shipped surface. The ebpf/
# crate itself compiles on the nightly pin via the nested build —
# outside CodeQL's stable-toolchain autobuild, and gated by the
# Gnu Dynamic CI jobs instead. Python tooling scripts are covered by
# the codespell and ruff gates; shell scripts by the shell quad —
# all running CI-side via the wholesale gate-keepers job on every
# push, unfiltered (NIGHT-hunt-23; the non-code gates moved out of
# ci.yml's path-filtered lane in NIGHT-improve-13 — the stale
# "codespell gate in ci.yml" seat this comment carried was the
# NIGHT-hunt-Z8 find). The paths filters are retired whole
# (night-dragon-maintenance-2, the owner's unfiltered-CI
# simplification): the scanner editions of the surface globs
# (NIGHT-improve-11's carry-what-you-scan rule, NIGHT-boost-10's
# estate spelling) shared the whole estate's sync tax, and every
# push and every pull request gets the scan now — the same blind
# posture every push-triggered lane carries.
#
# Weekly scheduled scan Monday 00:00 UTC (07:00 WIB) for full
# coverage — the owner's morning, one clock for every scheduled
# workflow (NIGHT-improve-9).

name: Dragon Guard - CodeQL

'on':
  # Unfiltered: any push and any pull request burns this scan. The
  # header carries the simplification record.
  push:
  pull_request:
  schedule:
    # Monday 00:00 UTC (07:00 WIB) — the owner's morning, one clock
    # for every scheduled workflow (NIGHT-improve-9).
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

# NIGHT-improve-32 (the combined-push estate pass): push, PR,
# schedule, and dispatch all land in one per-ref group — the four
# triggers are the same scan on the same ref, and a tag push next to
# a branch push lands in a DIFFERENT group by construction
# (github.ref differs), so a commit+tag combined push can never
# cancel or duplicate the other's analysis (the cosmostrix
# stability shape every push workflow already carries).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RUST_VERSION: "1.98.1"

jobs:
  analyze:
    name: Dragon Guard - CodeQL Analyze
    # Runner pinned to ubuntu-24.04, never a floating ubuntu-latest:
    # the label migrates to Ubuntu 26 on 2026-10-19 and would silently
    # move the build environment (actions/runner-images#14748); OS
    # upgrades here are deliberate, matrix-tested changes.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (aligned), NIGHT-hunt-20 SHA pin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2, NIGHT-hunt-20 SHA pin
        with:
          cache-on-failure: true

      # Pinned to rust: the security surface users run is the Rust
      # binary — the whole shipped code is Rust (phase 3). The ebpf/
      # BPF crate is compiled by the Gnu Dynamic CI jobs on the
      # nightly pin (outside CodeQL's stable autobuild).
      #
      # codeql-action is the ONE action deliberately left on a moving
      # tag (github-org official, NIGHT-hunt-20): its value is tracking
      # the current analyzers and query packs — SHA-pinning it would
      # freeze the security scanner itself. Every other action in this
      # repo is SHA-pinned.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust

      - name: Build (autobuild)
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /rust
          upload: true
