name: Maintenance deps weekly

on:
  schedule:
    # Every Monday at 00:00 UTC (07:00 WIB) — the owner's morning,
    # one clock for every scheduled workflow (NIGHT-improve-9).
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Single source of truth for the Rust toolchain version.
  # Keep in sync with rust-toolchain.toml + Cargo.toml rust-version
  # (enforced by scripts/check-rust-version-sync.sh; bump via
  # scripts/rust-version-to.sh).
  RUST_VERSION: "1.98.1"
  # NIGHT-strict-2: strict CI build — warning = failure, matching
  # ci.yml and release.yml. Registry dependencies stay warning-capped
  # (--cap-lints allow), so only workspace-local code can fail.
  RUSTFLAGS: "-D warnings"

jobs:
  validate:
    name: Maintenance deps weekly validate
    # Runner pinned to ubuntu-24.04, never a floating ubuntu-latest:
    # the label migrates to Ubuntu 26 on 2026-10-19 and would silently
    # move the build environment (actions/runner-images#14748); OS
    # upgrades here are deliberate, matrix-tested changes.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, NIGHT-hunt-20 SHA pin
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      # NIGHT-improve-1 phase 3: clippy --all-features drives the
      # nested pure-Rust eBPF build — the dated nightly pin and
      # bpf-linker must be present.
      - name: Install eBPF nightly toolchain (dated pin)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: nightly-2026-09-18
          components: rust-src

      - name: Install bpf-linker 0.11.1 (prebuilt static musl)
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update -q && sudo apt-get install -y -q zstd
          fi
          curl -sL -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
          sudo install -m755 /tmp/bpf-linker /usr/local/bin/bpf-linker
          bpf-linker --version

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, NIGHT-hunt-20 SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Update dependencies
        run: cargo update --verbose

      - name: Enforce dependency-only diff
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dependencies are already up to date"
            exit 0
          fi

          git diff --name-only | tee /tmp/changed-files.txt
          if grep -vE '^Cargo\.lock$' /tmp/changed-files.txt; then
            echo "::error::Auto-update may only modify Cargo.lock"
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        if: steps.changes.outputs.changed == 'true'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: steps.changes.outputs.changed == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        if: steps.changes.outputs.changed == 'true'
        run: cargo test --locked

      # Scanner binary pinned, advisory DB still refreshes every run
      # (NIGHT-hunt-20): red means a new advisory, never a new release.
      - name: Install cargo-deny (pinned 0.20.2)
        if: steps.changes.outputs.changed == 'true'
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check dependency policies
        if: steps.changes.outputs.changed == 'true'
        run: cargo deny check all

      - name: Run repository policy check
        if: steps.changes.outputs.changed == 'true'
        run: python3 scripts/check-policy.py

      - name: Verify release build
        if: steps.changes.outputs.changed == 'true'
        run: cargo build --release --locked

      - name: Upload validated Cargo.lock
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5, NIGHT-hunt-20 SHA pin
        with:
          name: validated-cargo-lock
          path: Cargo.lock
          if-no-files-found: error

  commit:
    name: Maintenance deps weekly commit
    runs-on: ubuntu-24.04
    needs: validate
    if: needs.validate.outputs.changed == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, NIGHT-hunt-20 SHA pin
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download validated Cargo.lock
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6, NIGHT-hunt-20 SHA pin
        with:
          name: validated-cargo-lock
          path: .auto-update

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          cp .auto-update/Cargo.lock Cargo.lock

          if git diff --quiet; then
            echo "Validated lockfile is already current"
            exit 0
          fi

          git diff --name-only | tee /tmp/changed-files.txt
          if grep -vE '^Cargo\.lock$' /tmp/changed-files.txt; then
            echo "::error::Commit job may only modify Cargo.lock"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(deps): maintenance deps weekly"
          git push origin main
