# NIGHT-improve-22 (cosmostrix naming lineage, codeql.yml
# precedent): the Dragon Guard name replaces "Maintenance deps
# weekly" — the job rows below keep their own descriptive names.
name: Dragon Guard - Dependency Maintenance

on:
  schedule:
    # Every Monday at 00:00 UTC (07:00 WIB) — the owner's morning,
    # one clock for every scheduled workflow (NIGHT-improve-9).
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# NIGHT-improve-32 (the combined-push estate pass): schedule and
# dispatch share one per-ref group — a manual click while the weekly
# sweep is mid-flight supersedes it instead of racing a second
# dependency-update run against the same branch protection surface
# (the cosmostrix stability shape every push workflow already
# carries; the two triggers are the same work on the same ref).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Single source of truth for the Rust toolchain version.
  # Keep in sync with rust-toolchain.toml + Cargo.toml rust-version
  # (enforced by scripts/gates/check-rust-version-sync.sh; bump via
  # scripts/dev/rust-version-to.sh).
  RUST_VERSION: "1.98.1"
  # NIGHT-strict-2: strict CI build — warning = failure, matching
  # ci.yml and release.yml. Registry dependencies stay warning-capped
  # (--cap-lints allow), so only workspace-local code can fail.
  RUSTFLAGS: "-D warnings"

jobs:
  # ===========================================================================
  # NIGHT-improve-14 (cosmostrix GPG lineage): weekly expiry monitor for
  # the release-signing key. Fails the check (error annotation) when a
  # signing subkey is expired; warns 30 days ahead so the rotation
  # happens before any release is blocked. Runs on the same Monday
  # 00:00 UTC clock as the rest of this workflow.
  #
  # The fingerprint is the maintainer's published master key (cosmic
  # dragon identity, shared with the cosmostrix release pipeline — one
  # identity, one key users import, both projects). If zelynic later
  # moves to a project-specific key, this constant is the single place
  # to change.
  # ===========================================================================
  gpg-key-check:
    name: GPG Signing Key Expiry Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Master key fingerprint (40 hex chars, no spaces).
      GPG_KEY_FINGERPRINT: "F5324E0967F104D58CE025F347A50AEF4B65AAC2"
      # Warn this many days before a signing subkey expires.
      GPG_EXPIRY_WARN_DAYS: "30"
    steps:
      - name: Fetch public key and check expiry
        shell: bash
        run: |
          set -euo pipefail

          # Import the signing key from a public keyserver (primary,
          # then fallback).
          gpg --batch --keyserver keys.openpgp.org \
            --recv-keys "${GPG_KEY_FINGERPRINT}" 2>/dev/null || \
          gpg --batch --keyserver keyserver.ubuntu.com \
            --recv-keys "${GPG_KEY_FINGERPRINT}" 2>/dev/null || {
            echo "::warning::Could not fetch GPG key ${GPG_KEY_FINGERPRINT} from keyservers"
            exit 0  # non-fatal — a keyserver outage must not break the pipeline
          }

          # Extract signing subkey expiry dates (skip master + revoked).
          # GPG colon format for a `sub:` record:
          #   f1=sub  f2=validity  f3=keylen  f4=algo  f5=keyid
          #   f6=CREATION epoch  f7=EXPIRY epoch
          # (Bugfix lineage from cosmostrix 2026-08-23: reading f6 — the
          # CREATION date — reported freshly-created subkeys as expired
          # on their own birth date. f7 is the expiry; empty f7 = never.)
          EXPIRY_LINES=$(gpg --batch --with-colons --list-keys "${GPG_KEY_FINGERPRINT}" \
            | awk -F: '/^sub:/ && $2 != "r"')

          if [[ -z "$EXPIRY_LINES" ]]; then
            echo "No signing subkeys found (master key may have no subkeys)"
            exit 0
          fi

          WARN=false
          NOW=$(date +%s)

          while IFS= read -r line; do
            EXPIRY=$(echo "$line" | cut -d: -f7)
            KEY_ID=$(echo "$line" | cut -d: -f5)

            if [[ -z "$EXPIRY" ]]; then
              echo "Subkey ${KEY_ID}: no expiry (never expires)"
              continue
            fi

            EXPIRY_SEC=$(date -d "@${EXPIRY}" +%s 2>/dev/null || echo "0")
            REMAINING=$(( (EXPIRY_SEC - NOW) / 86400 ))
            EXPIRY_DATE=$(date -d "@${EXPIRY}" +%Y-%m-%d 2>/dev/null || echo "unknown")

            if [[ "$REMAINING" -le 0 ]]; then
              echo "::error::GPG subkey ${KEY_ID} EXPIRED on ${EXPIRY_DATE} (${REMAINING} days ago)."
              WARN=true
            elif [[ "$REMAINING" -le "$GPG_EXPIRY_WARN_DAYS" ]]; then
              echo "::warning::GPG subkey ${KEY_ID} expires ${EXPIRY_DATE} (${REMAINING} days left) - rotate soon."
              echo "warn window: ${GPG_EXPIRY_WARN_DAYS} days (docs/VERIFY_RELEASE.md)"
              WARN=true
            else
              echo "GPG signing subkey ${KEY_ID}: expires ${EXPIRY_DATE} (${REMAINING} days remaining) — OK"
            fi
          done <<< "$EXPIRY_LINES"

          if $WARN; then
            echo ""
            echo "Action required: rotate the signing subkey and update keyservers."
            echo "See docs/VERIFY_RELEASE.md for the renewal procedure."
          fi

  validate:
    name: Dependency sweep validate
    # Runner pinned to ubuntu-24.04, never a floating ubuntu-latest:
    # the label migrates to Ubuntu 26 on 2026-10-19 and would silently
    # move the build environment (actions/runner-images#14748); OS
    # upgrades here are deliberate, matrix-tested changes.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, NIGHT-hunt-20 SHA pin
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Harden DNS (the poisoned-resolver defense)
        uses: ./.github/actions/harden-dns
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl

      # NIGHT-improve-1 phase 3: clippy --all-features drives the
      # nested pure-Rust eBPF build — the dated nightly pin and
      # bpf-linker must be present.
      - name: Install eBPF nightly toolchain (dated pin)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: nightly-2026-09-18
          components: rust-src

      # NIGHT-improve-11: the pinned bpf-linker install is shared by
      # four CI jobs (check, gnu-dynamic, release, this one) — one
      # script, one place to bump the pin.
      - name: Install bpf-linker 0.11.1 (prebuilt static musl)
        run: bash scripts/dev/install-bpf-linker.sh

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6, NIGHT-hunt-20 SHA pin
        with:
          # ebpf/target included (NIGHT-improve-11): clippy
          # --all-features in this job drives the nested eBPF build
          # into the detached crate's own target tree.
          #
          # NIGHT-improve-32: this job's key carries the maintenance
          # leg — it USED to share ci.yml's `Linux-cargo-*` key
          # verbatim, and a Monday push landing while the weekly sweep
          # ran had both jobs saving the same key at once: actions/cache
          # resolves that with a "failed to reserve cache key" warning,
          # benign but exactly the collision-shaped noise a combined
          # commit+tag push multiplies across the estate. The split
          # keeps every workflow's saves disjoint by construction; the
          # trade is that ci.yml no longer warm-reads this job's
          # post-update saves — one colder ci build after a dependency
          # sweep lands, a fair price for a warning-clean estate
          # (registry contents are lock-hash-keyed either way, so
          # nothing stale can ever be served).
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ebpf/target
          key: ${{ runner.os }}-cargo-maintenance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-maintenance-

      # night-zen-1: the refresh walks every committed Cargo.toml and
      # runs cargo update in each workspace, so ebpf/ and fuzz/ ride
      # the same weekly lane as the root crate (the root-only cargo
      # update left two of the three committed lockfiles permanently
      # stale). New workspaces join the lane without touching this
      # file; target trees are excluded so cache-restored build
      # output can never join the walk.
      - name: Update dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r manifest; do
            echo "Refreshing $(dirname "$manifest")"
            (cd "$(dirname "$manifest")" && cargo update --verbose)
          done < <(find . -name Cargo.toml -not -path '*/target/*' | sort)

      # night-zen-1: the walk can move the ebpf/ tree (its own
      # Cargo.lock rides the sweep), and the prebuilt lane pins that
      # tree's blake3 — an unhealed pin would redden the wholesale
      # gate for the whole week. The ONE WRITER heals here, where the
      # full toolchain (the dated nightly + rust-src + bpf-linker
      # 0.11.1) is already installed: parity verdict first, the
      # writer only when the pin lags, and a writer failure fails
      # the job — a sweep never ships a lane it cannot prove.
      - name: Keep the prebuilt lane in parity (the one writer)
        shell: bash
        run: |
          set -Eeuo pipefail
          # The parity verdict digests with the PINNED b3sum — the
          # writer's own constant is the one source (read here, never
          # duplicated), and a matching binary skips the build
          # (idempotent, the bootstrap's exact install line). The
          # writer's gate refuses to answer without it, and the first
          # dispatched no-op run proved the refusal real.
          B3SUM_PIN="$(sed -n 's/^B3SUM_VERSION="\(.*\)"$/\1/p' \
            scripts/release/refresh-prebuilt.sh)"
          if ! b3sum --version 2> /dev/null | grep -q "$B3SUM_PIN"; then
            echo "installing the pinned digest tool (b3sum ${B3SUM_PIN})..."
            cargo install b3sum --version "$B3SUM_PIN" --locked
          fi
          if ! bash scripts/release/refresh-prebuilt.sh --check; then
            echo "the ebpf/ tree moved — the one writer refreshes the prebuilt lane"
            bash scripts/release/refresh-prebuilt.sh
          fi

      - name: Enforce dependency-only diff
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dependencies are already up to date"
            exit 0
          fi

          git diff --name-only | tee /tmp/changed-files.txt
          # night-zen-1: the sweep owns the lockfiles AND the prebuilt
          # lane its writer refreshed to match the swept ebpf/ tree.
          if grep -vE '(^|/)Cargo\.lock$|^ebpf-prebuilt/' /tmp/changed-files.txt; then
            echo "::error::Auto-update may only modify Cargo.lock files and the prebuilt lane"
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        if: steps.changes.outputs.changed == 'true'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: steps.changes.outputs.changed == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        if: steps.changes.outputs.changed == 'true'
        run: cargo test --locked

      # Scanner binary pinned, advisory DB still refreshes every run
      # (NIGHT-hunt-20): red means a new advisory, never a new release.
      - name: Install cargo-deny (pinned 0.20.2)
        if: steps.changes.outputs.changed == 'true'
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check dependency policies
        if: steps.changes.outputs.changed == 'true'
        run: cargo deny check all

      - name: Run repository policy check
        if: steps.changes.outputs.changed == 'true'
        run: python3 scripts/gates/check-policy.py

      # NIGHT-boost-2: the sweep's verify rides the pro profile the
      # release floor ships (linux musl v3, fully static, via the
      # .cargo/config.toml alias — ebpf feature and --locked included)
      # instead of the retired plain `--release` build: dependency
      # updates are proven against a tier someone actually
      # distributes (the only tier since night-dragon-maintenance-6 —
      # the gnu pair retired with the gnu packaging). One shape, not
      # the ci.yml trio — this job validates lockfile health, not
      # artifacts; ci.yml and release.yml own the full per-tier
      # verification. RUSTFLAGS composed inline for the same
      # env-shadow reason ci.yml documents (workflow-level -D
      # warnings would eat the alias's target-cpu flag).
      - name: 'Verify pro build (linux musl v3)'
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          RUSTFLAGS="-D warnings -C target-cpu=x86-64-v3 -C target-feature=+crt-static" \
            cargo pro-linux-amd64-v3-musl --locked
          ./target/x86_64-unknown-linux-musl/pro-linux-amd64-v3-musl/zelynic -V

      - name: Upload validated dependency lane
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, NIGHT-hunt-20 SHA pin
        with:
          name: validated-dependency-lane
          # night-zen-1: the artifact carries every workspace lockfile
          # (the ! target negation keeps cache-restored build output
          # out) PLUS the prebuilt lane the one-writer step refreshed
          # to match the swept ebpf/ tree — the commit job cannot
          # rebuild it (no toolchain there), so the validated lane
          # rides the artifact. Future workspaces join without
          # touching this file. The download lands OUTSIDE the work
          # tree — see the commit job's staging wall.
          path: |
            **/Cargo.lock
            !**/target/**
            ebpf-prebuilt/**
          if-no-files-found: error

  commit:
    name: Dependency sweep commit
    runs-on: ubuntu-24.04
    needs: validate
    if: needs.validate.outputs.changed == 'true'
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, NIGHT-hunt-20 SHA pin
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          # The estate's one DELIBERATE persist-credentials exception
          # (night-dragon-maintenance-6): this job commits the swept
          # Cargo.lock and pushes it to main, so the checkout token
          # must survive into the git client. Every other checkout in
          # the estate pins persist-credentials: false — do not
          # "normalize" this one without moving the push to an API
          # call first.
          persist-credentials: true

      - name: Harden DNS (the poisoned-resolver defense)
        uses: ./.github/actions/harden-dns
      # night-zen-1 (the staging wall, layer 1): the artifact lands
      # OUTSIDE the work tree (RUNNER_TEMP), never in an in-tree
      # staging directory — an in-tree download once let the sister
      # repo's commit job sweep a .auto-update/ lockfile tree straight
      # into the repo (the bot commit 9708883 incident, recorded in
      # docs/MAINTENANCE.md §7).
      - name: Download validated dependency lane
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8, NIGHT-hunt-20 SHA pin
        with:
          name: validated-dependency-lane
          path: ${{ runner.temp }}/validated-dependency-lane

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          # night-zen-1: restore every workspace lockfile from the
          # out-of-tree artifact (the artifact keeps the repo-relative
          # layout, so each copy lands at its own workspace root).
          lane_dir="${RUNNER_TEMP}/validated-dependency-lane"
          find "$lane_dir" -name Cargo.lock -type f | while IFS= read -r artifact_lock; do
            rel="${artifact_lock#"$lane_dir"/}"
            cp "$artifact_lock" "$rel"
          done
          # night-zen-1: the prebuilt lane rides the same artifact
          # (the validate job's one-writer refresh) — mirrored over
          # the checkout, so an unchanged lane diffs as nothing and
          # the commit carries only what actually moved. --delete
          # keeps the mirror honest (a retired object cannot linger).
          if test -d "$lane_dir/ebpf-prebuilt"; then
            rsync -a --delete "$lane_dir/ebpf-prebuilt/" ebpf-prebuilt/
          fi

          if git diff --quiet; then
            echo "The validated dependency lane is already current"
            exit 0
          fi

          git diff --name-only | tee /tmp/changed-files.txt
          # night-zen-1: the sweep owns the lockfiles AND the prebuilt
          # lane its writer refreshed — nothing else may ever appear.
          if grep -vE '(^|/)Cargo\.lock$|^ebpf-prebuilt/' /tmp/changed-files.txt; then
            echo "::error::Commit job may only modify Cargo.lock files and the prebuilt lane"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # night-zen-1 (the staging wall, layer 2): the exact
          # lockfile paths from the manifest walk — the same set the
          # refresh step updated, never a glob, so no staging
          # directory can ever ride the commit (the zejtron 9708883
          # leak class: a ':(glob)**/Cargo.lock' add matched the
          # in-tree staging copies too; docs/MAINTENANCE.md §7). The
          # paths ride xargs — no command substitution in argument
          # position, so the SC2046 word-splitting seat stays silent.
          find . -name Cargo.toml -not -path '*/target/*' \
            | sed 's|Cargo\.toml$|Cargo.lock|' \
            | xargs -r git add --
          # the parity rider: the healed prebuilt lane stages with the
          # locks it matches (the commit gate's pairing rule, explicit
          # path — never a glob); an unchanged lane adds as a no-op.
          git add ebpf-prebuilt
          git commit -m "chore(deps): maintenance deps weekly"
          git push origin main
