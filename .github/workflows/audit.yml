# NIGHT-improve-22 (cosmostrix naming lineage, codeql.yml
# precedent): the Dragon Guard name replaces the plain "Audit".
name: Dragon Guard - Security Audit

on:
  # NIGHT-boost-10 (owner mandate, the quartet pass): audit joins
  # the code-push estate — a manifest or lockfile change now gets
  # an advisory scan the same night the dependency surface moved,
  # instead of waiting for Monday's clock. The filter is the
  # surface the scanners actually read (improve-11's scanner
  # rule: the scanner workflows carry the surface they scan):
  # Rust source, scripts, and docs all leave it asleep,
  # gate-keepers.yml (unfiltered) polices the rest. The weekly
  # schedule stays as the between-pushes watch over the advisory
  # DB itself.
  push:
    branches: ["main"]
    paths:
      - '**/*.toml'
      - '**/Cargo.lock'
      - '.github/workflows/audit.yml'
  pull_request:
    branches: ["main"]
    paths:
      # NIGHT-boost-10: same spelling as push (the no-drift law).
      - '**/*.toml'
      - '**/Cargo.lock'
      - '.github/workflows/audit.yml'
  schedule:
    # Every Monday at 00:00 UTC (07:00 WIB) — the owner's morning,
    # one clock for every scheduled workflow (NIGHT-improve-9).
    # NIGHT-improve-38: aligned to the weekly cadence maintenance.yml
    # and codeql.yml already carry — the advisory DB does not change
    # enough to justify a daily run, and a daily red in the run list
    # for an advisory the owner already triaged is noise, not signal.
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# NIGHT-improve-32 (the combined-push estate pass): push, PR,
# schedule, and dispatch share one per-ref group — a manual click
# while the weekly run is mid-flight supersedes it instead of
# racing a duplicate
# scanner install against the same advisory DB fetch (the cosmostrix
# stability shape every push workflow already carries; a scheduled
# and a dispatched run are the same work on the same ref, so there
# is no scenario where both must run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Observation-only audit
    # Runner pinned to ubuntu-24.04, never a floating ubuntu-latest:
    # the label migrates to Ubuntu 26 on 2026-10-19 and would silently
    # move the build environment (actions/runner-images#14748); OS
    # upgrades here are deliberate, matrix-tested changes.
    runs-on: ubuntu-24.04
    # NIGHT-improve-13 (cosmostrix stability): every job carries an
    # explicit ceiling — a runaway job burns runner minutes silently.
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, NIGHT-hunt-20 SHA pin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin

      # Scanner binaries pinned, advisory DB still refreshes every
      # run (NIGHT-hunt-20): red means a new advisory, never a new
      # release of the scanner itself.
      - name: Install cargo-audit (pinned 0.22.2)
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Run cargo audit
        # NIGHT-improve-22 (warning = failure): --deny warnings makes
        # advisory-level findings (unmaintained dependencies, yanked
        # versions) exit non-zero instead of scrolling past as yellow
        # text — the observation-only posture lives in
        # continue-on-error above, not in a silent exit code. Red in
        # the run list is the owner's morning signal, exactly why the
        # job exists.
        run: cargo audit --deny warnings

      - name: Install cargo-deny (pinned 0.20.2)
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Run cargo deny
        if: hashFiles('deny.toml') != ''
        run: cargo deny check
