# =============================================================================
# Dragon Guard - crates.io publish
# =============================================================================
#
# NIGHT-ask-1 (cosmostrix crates-io.yml lineage): publishes zelynic to
# crates.io on every owner-pushed release tag — the same 'v*' filter
# release.yml carries, so the registry never lags behind a GitHub
# Release. zelynic is NEW on crates.io (the name was unregistered at
# 2026-09-27, verified against the live registry API), so the FIRST
# publish creates the crate — see docs/VERIFY_RELEASE.md for the
# owner's one-time setup and the manual-first-publish instruction.
#
# What gets published — the FULL-FEATURED lane (NIGHT-ask-2): cargo's
# package walk auto-excludes nested packages, so the detached ebpf/
# workspace (its own Cargo.toml) cannot ride a registry tarball — the
# crate ships ebpf-prebuilt/ instead (a plain directory, NOT a nested
# package): the two maintainer-built objects, the same bytes the
# GitHub Release binaries embed. The default became `ebpf`, so a
# plain `cargo install zelynic` lands the monitor and the limiter on
# a stable toolchain — no nightly anywhere near the user (this job's
# own `cargo publish` verification build exercises exactly that
# registry lane: build.rs stages the prebuilt objects and the tarball
# compiles before any upload). Freshness is gated upstream by
# gate-keepers.yml's check-prebuilt-parity.sh, which fails after any
# ebpf/ change until scripts/release/refresh-prebuilt.sh regenerates
# the lane.
#
# NIGHT-dinner-1 — the publish is now TRIPLE-gated against a stale
# prebuilt lane (the commit+tag race found in the audit: a commit
# that changes ebpf/ without refreshing ebpf-prebuilt/ pushes green
# through ci.yml — its Rust-surface jobs rebuild the eBPF objects
# from source, so nothing there depends on the lane — while the run
# that actually fails, the unfiltered wholesale gate-keepers.yml
# check 18, was never waited for):
#   1. ci_gate waits for the ci.yml push-run on the tagged SHA (the
#      original serialization), AND
#   2. ci_gate waits for the wholesale gate-keepers.yml push-run on
#      the same SHA (WAIT_WORKFLOW_PATH override) — the run that
#      carries the parity check, plus every other wholesale gate,
#   3. the publish job itself runs check-prebuilt-parity.sh directly
#      on the exact tree being packaged — the last line of defense
#      before an IRREVERSIBLE upload, independent of any wait logic.
#
# One-time setup (owner): create a crates.io API token
# (crates.io -> Account Settings -> API Tokens, "publish-new" scope is
# enough) and add it as the CRATES_IO_TOKEN repository secret
# (repo Settings -> Secrets and variables -> Actions).
#
# Safety properties:
#   - Fails fast if the tag does not match Cargo.toml's version.
#   - Idempotent: if the version is already published (re-pushed tag or
#     re-run), the job skips the upload instead of failing.
#   - --locked: the published dependency set is exactly the tagged
#     Cargo.lock, the same tree every other CI job validated.
#
# Dependency version policy: actions are SHA-pinned (NIGHT-hunt-20,
# same pins as ci.yml — zelynic's posture is stronger than the
# cosmostrix major-tag float) and the Rust toolchain is LTS-locked via
# rust-toolchain.toml (single source of truth; check-rust-version-sync
# keeps the RUST_VERSION env below in sync with it).

name: Dragon Guard - crates.io publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Single source of truth for Rust toolchain version.
  # Keep in sync with rust-toolchain.toml + Cargo.toml rust-version
  # (scripts/gates/check-rust-version-sync.sh enforces the pair).
  RUST_VERSION: "1.98.1"

jobs:
  # The commit+tag collision gate (cosmostrix wait-for-ci lineage,
  # NIGHT-ask-1 port). When the release commit and its tag are pushed
  # together, this publish would race the branch CI on the same SHA —
  # and a crates.io publish is IRREVERSIBLE (a bad version can only be
  # yanked, never replaced). The gate waits for the ci.yml push-run on
  # the exact tagged SHA and requires conclusion=success before the
  # upload. Full contract: scripts/release/wait-for-ci.sh.
  ci_gate:
    name: CI gate (commit+tag push)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, NIGHT-hunt-20 SHA pin

      - name: Wait for the branch CI on the tagged commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/release/wait-for-ci.sh

      # NIGHT-dinner-1: the wholesale gate must also be green on the
      # tagged SHA. The wait above only serializes against ci.yml,
      # whose Rust-surface jobs rebuild the eBPF objects from source —
      # a stale ebpf-prebuilt/ lane builds green there. The run that
      # actually fails on a stale lane is the unfiltered wholesale
      # gate-keepers.yml (check 18), so the publish waits for it too
      # (same script, WAIT_WORKFLOW_PATH override; its absence after
      # the grace period is safe here because the publish job below
      # runs the parity check directly on the packaged tree).
      - name: Wait for the wholesale gate-keepers run on the tagged commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WAIT_WORKFLOW_PATH: .github/workflows/gate-keepers.yml
        run: ./scripts/release/wait-for-ci.sh

  publish-crates-io:
    name: Publish to crates.io (${{ github.ref_name }})
    runs-on: ubuntu-24.04
    needs: ci_gate
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, NIGHT-hunt-20 SHA pin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, NIGHT-hunt-20 SHA pin
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CARGO_VERSION}"
            echo "Bump the package version before tagging: ./scripts/dev/version-to.sh ${TAG_VERSION}"
            exit 1
          fi
          echo "Publishing zelynic ${CARGO_VERSION} to crates.io"

      # NIGHT-dinner-1: last line of defense before an IRREVERSIBLE
      # registry upload — the parity gate on the exact tree being
      # packaged (pure hashing, seconds). Fails when ebpf/ drifted
      # past ebpf-prebuilt/manifest.toml's pin, no matter what the
      # waits above saw.
      - name: Prebuilt eBPF parity gate
        run: bash scripts/gates/check-prebuilt-parity.sh

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CRATES_IO_TOKEN repository secret is not set."
            echo "Create a crates.io API token (crates.io -> Account Settings -> API Tokens)"
            echo "and add it under repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          # Idempotency probe: crates.io rejects duplicate versions, so a
          # re-pushed tag (or a re-run) must not attempt a second upload.
          # The API requires a custom User-Agent (plain curl gets 403).
          if curl -fsSL -A "zelynic-ci-publish-check" \
              "https://crates.io/api/v1/crates/zelynic/${VERSION}" >/dev/null 2>&1; then
            echo "zelynic ${VERSION} is already published on crates.io - nothing to do."
            exit 0
          fi
          cargo publish --locked

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
