# =============================================================================
# E2E — the owner-facing bring-up and both supermassive batteries, on CI
# =============================================================================
#
# NIGHT-ultimate-3 (the re-issued label: the pre-release CI ask; the
# same number's first life — the 83-case CLI depth sweep inside the v2
# harness — keeps its historical references there): a push of core
# files must answer "does zelynic work end to end?" without a manual
# VirtualBox session. The pipeline is exactly the machine-qualification
# order: setup.sh (bootstrap + the pro-native-gnu flagship build + the
# rootless engine self-test), then supermassive v1 (the limiter matrix:
# every policy shape on loopback AND the real internet), then
# supermassive v2 (the survival battery: guards, SIGKILL violence,
# regression re-proof, crash teardown) LAST.
#
# The sudo question, answered in the artifact (the owner's ask: "can we
# make an isolated container that can use sudo, like a mini container,
# for real testing?"): no container is needed. A GitHub hosted runner
# IS that machine — an ephemeral single-use VM with its own kernel,
# wiped after the job, where the `runner` user holds PASSWORDLESS sudo.
# A Docker layer on top would ADD failure modes the bare runner does
# not have (a private cgroup namespace re-roots the fleet's
# /sys/fs/cgroup mkdir; bpffs and /dev/kmsg need explicit mounts; the
# realnet lane gains a NAT hop) while buying ZERO extra isolation — the
# VM is already single-use. eBPF needs the kernel either way, and the
# kernel is the runner's own. The one scenario where --privileged +
# --cgroupns=host earns its complexity is a SELF-HOSTED runner (a
# machine worth protecting); if one ever lands, revisit this note.
#
# What this job deliberately does NOT do: install the toolchain via
# CI actions or bpf-linker via sudo-install like the other workflows.
# Those jobs are CI-shaped on purpose; THIS job's contract is the
# owner-facing path — it runs scripts/setup.sh itself, so the exact
# route a user takes (rustup resolving rust-toolchain.toml +
# bootstrap-ebpf.sh installing the dated nightly pin and the
# ~/.local/bin bpf-linker + cargo pro-native-gnu) is the route proven
# on every qualifying push. The runner image ships rustup, so the
# host path works unchanged.
#
# setup.sh runs with --skip-heavy: its phase 4 wrapper WARNS on matrix
# failures instead of dying (by design — the verdict is the harness
# rows, not the wrapper), so a CI step running full setup.sh would
# exit 0 over a red matrix and the push would look green. The
# batteries therefore run as their own steps — the canonical bare
# invocations straight from the docs, exit code 1 on any FAIL row.
# Same coverage, authoritative verdicts, and the harness's own binary
# resolution (newest repo-local build, version-gated to the checkout)
# picks the flagship binary setup.sh just built.
#
# Cache: cargo registry + git ONLY. Never target/ — the build here is
# pro-NATIVE codegen; a restored native artifact was compiled on a
# previous runner's CPU, and executing it on this run's silicon is
# the exact SIGILL lottery NIGHT-hunt-34 closed for the musl job.
# The build is fresh every run by design: this job exists to execute
# what it just built, on the same silicon that built it.
#
# Trigger paths = the surface that SHAPES the binary plus the E2E
# harness itself: the Rust trees, the cargo manifests, the toolchain
# pins, the setup/bootstrap/linker scripts, the supermassive tree,
# the shared harness lib — and this workflow's own file (the
# NIGHT-hunt-34 rule: a workflow that can change its own contract
# owes itself a run). No pull_request trigger: the owner's stated
# contract is push-to-main, and the repo is single-maintainer; the
# workflow_dispatch trigger covers the actual pre-release ask — fire
# the whole pipeline on demand, watch one green run per kernel, ship.
#
# Matrix: ubuntu-22.04 (kernel 5.15 — the LTS floor the release page
# promises, the oldest hosted runner with a 5.x kernel) and
# ubuntu-24.04 (kernel 6.8+, current hosted ceiling), fail-fast
# false: a 5.15 failure must not hide the 6.8 result — the kernel
# span picture is the point of running both.

name: Dragon Guard - E2E

on:
  push:
    branches: ["main"]
    paths:
      - 'src/**'
      - 'ebpf/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'scripts/setup.sh'
      - 'scripts/dev/bootstrap-ebpf.sh'
      - 'scripts/dev/install-bpf-linker.sh'
      - 'scripts/supermassive/**'
      - 'scripts/lib/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch: {}

# Least privilege (cosmostrix contract): this workflow only reads the
# repository — the sudo inside is host-level (mount, the root test
# batteries), never a GitHub permission.
permissions:
  contents: read

# The most expensive workflow in the estate: a superseded push cancels
# its in-flight E2E instead of queueing a duplicate 25-minute run
# (cosmostrix stability pattern, same shape as every other workflow).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # If a panic ever leaks past v2's zero-panic contract, the CI log
  # should carry the backtrace for the debugging session that follows.
  RUST_BACKTRACE: 1

jobs:
  e2e:
    name: E2E full pipeline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 = kernel 5.15 (the 5.x LTS floor),
        # ubuntu-24.04 = kernel 6.8+ (latest hosted) — the release
        # page's promised kernel span, both ends proven per push.
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, NIGHT-hunt-20 SHA pin

      # The one prerequisite a hosted runner does not satisfy out of
      # the box: zelynic pins its maps on bpffs and the v1 preflight
      # fails fast when /sys/fs/bpf is not a mounted bpf filesystem
      # (its tip says exactly what this step does). Idempotent —
      # mount only when the mountpoint is absent, then prove it.
      - name: Mount bpffs
        run: |
          if ! mountpoint -q /sys/fs/bpf; then
            sudo mount -t bpf bpf /sys/fs/bpf
          fi
          mountpoint -q /sys/fs/bpf
          echo "OK: bpffs mounted at /sys/fs/bpf"

      # Downloaded crate sources only — never target/ (see the
      # header: executing a restored pro-native artifact is the
      # SIGILL lottery; this job builds fresh and runs what it built).
      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, NIGHT-hunt-20 SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: e2e-${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            e2e-${{ matrix.os }}-cargo-
            e2e-cargo-

      # The owner-facing bring-up, run as the owner-facing user (the
      # runner user, NOT root — setup.sh refuses root and elevates
      # itself when it needs to). Bootstrap installs the dated nightly
      # pin + bpf-linker into $HOME, builds the flagship pro-native-gnu
      # binary, and the rootless engine self-test proves the harness.
      # Exit code is authoritative at every die().
      - name: Bring-up (setup.sh --skip-heavy)
        run: ./scripts/setup.sh --skip-heavy

      # v1, the limiter matrix: the policy shapes on the loopback lane
      # and the real-internet lane (self-SKIPping when no endpoint
      # answers), the rate ladder, reload, sustain. Canonical bare
      # invocation — binary resolution prefers the newest repo-local
      # build and the version gate ties it to this checkout.
      - name: Supermassive v1 - limiter matrix
        run: sudo ./scripts/supermassive/supermassive-test.sh

      # v2, the survival battery, LAST per the qualification order:
      # the 83-case CLI depth stresstest, the input guards, the
      # SIGKILL batteries (live TUI mid-render, one-shot writers
      # inside the attach/pin/write window), the post-kill regression
      # re-proof, and the crash-family teardown (recover, cleanup,
      # dmesg). A green row here is the "works under fire" verdict.
      - name: Supermassive v2 - survival battery
        run: sudo ./scripts/supermassive/supermassive-test-v2.sh
