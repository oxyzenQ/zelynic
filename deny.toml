# cargo-deny policy for zelynic (NIGHT-hunt-6 strict supply-chain audit,
# 2026-09-18). Enforced by .github/workflows/ci.yml ("Check dependency
# policies": cargo deny check all) and the daily observation run in
# .github/workflows/audit.yml. Local: cargo deny check all
# (install: cargo install cargo-deny --locked).

[graph]
# NIGHT-hunt-6 finding: the previous template left all-features=false
# with an empty default feature set, so cargo-deny only ever saw the
# non-eBPF subtree — the entire aya tree (aya, aya-obj, object, ...) sat
# outside every advisories/licenses/bans check in CI. all-features=true
# pulls the ebpf feature into the graph so the policy covers 100% of
# what a release build actually compiles.
all-features = true

[output]
feature-depth = 1

[advisories]
# RustSec advisory database (default URL). No accepted advisories yet;
# when one is accepted (informational unmaintained-crate class, etc.),
# record it here with a reason string and mirror the rationale in
# docs/DEPENDENCY_AUDIT.md.
ignore = []

[licenses]
allow = [
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
# The allow list is intentionally broader than the current tree (e.g.
# BSD/ISC/MPL entries have no live consumers today) so a future
# semver-compatible transitive addition does not fail CI for license
# reasons alone — the bans/advisories sections stay strict.
unused-allowed-license = "allow"

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# Regressive dependencies — re-adding any of these fails
# `cargo deny check all` in CI:
deny = [
    # NIGHT-hunt-6 (2026-09-18): chrono removed with zero call sites;
    # its `clock` feature dragged iana-time-zone + num-traits into the
    # lockfile for nothing. Wall-clock formatting is done in-house via
    # Howard Hinnant's civil_from_days in build.rs (see the tombstone
    # comment in Cargo.toml). If a future feature genuinely needs
    # calendar math, prefer the in-house Hinnant module first.
    { crate = "chrono", reason = "removed NIGHT-hunt-6: zero call sites; Hinnant civil_from_days in build.rs replaces it" },
    # night-dragon-maintenance-T1 (S1) (2026-10-28): serde and
    # serde_json removed — the JSON lane is hand-written in src/json/
    # (the zejtron peak-lean law: no crate exists only to move JSON).
    # The parse tree serves the docker Engine API lane, the writer
    # helpers serve every --print-json document; both std-only.
    #
    # night-dragon-maintenance-X1 (2026-11-02): the ban widens across
    # the full derive stack. The S1 list pinned only the two facade
    # names, leaving serde_core and serde_derive ban-free — a future
    # dependency could legally depend on the derive crates directly
    # (macros without the facade) and cargo deny would stay silent.
    # Both names ship only inside the serde monorepo, so the widened
    # ban cannot collide with a legitimate third-party use. The
    # ebpf/ nested crate's build-time aya-build chain (the one
    # documented serde consumer, docs/DEPENDENCY_AUDIT.md) is not
    # scanned by the root `cargo deny check all` invocation.
    { crate = "serde", reason = "removed S1: the JSON lane is hand-written in src/json/; the derive stack left the graph" },
    { crate = "serde_json", reason = "removed S1: src/json/parse.rs (Value tree) + write.rs (the escape law) replace it" },
    { crate = "serde_core", reason = "removed S1, ban widened X1: serde-family-only crate; closes the direct-dependency loophole the facade-only ban left open" },
    { crate = "serde_derive", reason = "removed S1, ban widened X1: serde-family-only proc-macro crate; a direct derive dependency must fail the policy gate like its facade" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
