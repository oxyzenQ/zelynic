# cargo-deny policy for zelynic (NIGHT-hunt-6 strict supply-chain audit,
# 2026-09-18). Enforced by .github/workflows/ci.yml ("Check dependency
# policies": cargo deny check all) and the weekly observation run in
# .github/workflows/audit.yml. Local: cargo deny check all
# (install: cargo install cargo-deny --locked).

[graph]
# NIGHT-hunt-6 finding: the previous template left all-features=false
# with an empty default feature set, so cargo-deny only ever saw the
# non-eBPF subtree — the entire aya tree (aya, aya-obj, object, ...) sat
# outside every advisories/licenses/bans check in CI. all-features=true
# pulls the ebpf feature into the graph so the policy covers 100% of
# what a release build actually compiles.
all-features = true

[output]
feature-depth = 1

[advisories]
# night-supply-2 (2026-11-19): the policy is spelled out explicitly so a
# cargo-deny default change can never silently loosen it. The 2026-08-20
# arrayref incident made the yanked class concrete: crates.io deleted the
# malicious publishes within hours, so every payload version is a yanked
# version — a graph re-resolution that accepts yanked crates is a
# re-resolution that can silently pull the deleted payload back. The
# implicit default was warn; deny is the contract. The other two keys name
# the scan SCOPE, not severity (the schema moved severity out of this
# section — vulnerability advisories always emit errors and have no key
# here anymore): "all" keeps the whole root graph, the aya tree included
# (all-features above), in the findings list where the observation lane
# and the morning signal own the triage.
yanked = "deny"
unmaintained = "all"
unsound = "all"
# RustSec advisory database (default URL). No accepted advisories yet;
# when one is accepted (informational unmaintained-crate class, etc.),
# record it here with a reason string and mirror the rationale in
# docs/DEPENDENCY_AUDIT.md.
ignore = []

[licenses]
allow = [
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
# The allow list is intentionally broader than the current tree (e.g.
# BSD/ISC/MPL entries have no live consumers today) so a future
# semver-compatible transitive addition does not fail CI for license
# reasons alone — the bans/advisories sections stay strict.
unused-allowed-license = "allow"

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
# night-supply-2 (2026-11-19): a wildcard version requirement forces the
# graph to re-resolve against the index on every build, even with a
# committed lockfile — the exact vector the 2026-08-20 arrayref incident
# exploited (a malicious republish lands inside a re-resolve window). The
# root workspace carries none today (verified across every manifest in
# the graph); from now on one cannot enter without failing this gate.
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# Regressive dependencies — re-adding any of these fails
# `cargo deny check all` in CI:
deny = [
    # NIGHT-hunt-6 (2026-09-18): chrono removed with zero call sites;
    # its `clock` feature dragged iana-time-zone + num-traits into the
    # lockfile for nothing. Wall-clock formatting is done in-house via
    # Howard Hinnant's civil_from_days in build.rs (see the tombstone
    # comment in Cargo.toml). If a future feature genuinely needs
    # calendar math, prefer the in-house Hinnant module first.
    { crate = "chrono", reason = "removed NIGHT-hunt-6: zero call sites; Hinnant civil_from_days in build.rs replaces it" },
    # night-dragon-maintenance-T1 (S1) (2026-10-28): serde and
    # serde_json removed — the JSON lane is hand-written in src/json/
    # (the zejtron peak-lean law: no crate exists only to move JSON).
    # The parse tree serves the docker Engine API lane, the writer
    # helpers serve every --print-json document; both std-only.
    #
    # night-dragon-maintenance-X1 (2026-11-02): the ban widens across
    # the full derive stack. The S1 list pinned only the two facade
    # names, leaving serde_core and serde_derive ban-free — a future
    # dependency could legally depend on the derive crates directly
    # (macros without the facade) and cargo deny would stay silent.
    # Both names ship only inside the serde monorepo, so the widened
    # ban cannot collide with a legitimate third-party use. The
    # ebpf/ nested crate's build-time aya-build chain (the one
    # documented serde consumer, docs/DEPENDENCY_AUDIT.md) is not
    # scanned by the root `cargo deny check all` invocation.
    { crate = "serde", reason = "removed S1: the JSON lane is hand-written in src/json/; the derive stack left the graph" },
    { crate = "serde_json", reason = "removed S1: src/json/parse.rs (Value tree) + write.rs (the escape law) replace it" },
    { crate = "serde_core", reason = "removed S1, ban widened X1: serde-family-only crate; closes the direct-dependency loophole the facade-only ban left open" },
    { crate = "serde_derive", reason = "removed S1, ban widened X1: serde-family-only proc-macro crate; a direct derive dependency must fail the policy gate like its facade" },
    # night-supply-1 (2026-11-17), the 2026-08-20 arrayref supply-chain
    # incident: a compromised crates.io account shipped six malicious
    # crates (build-script payload downloaders) and malicious
    # republishes of three benign crates it owns (arrayref@0.3.10,
    # internment@0.8.7, append-only-vec@0.1.9 — 86/90/107 minutes
    # online before deletion). All nine ban at the name level: the six
    # malicious names were minted malicious and never resolve
    # legitimately, and the pinned cargo-deny 0.20.2 bans schema
    # carries no version scope (crate/reason/wrappers only — the
    # deserializer rejects a version key), so the three benign crates
    # ban whole-name too. That stricter scope costs this estate
    # nothing — no lockfile ever touched them (evidence table in
    # docs/DEPENDENCY_AUDIT.md) and the add-a-dependency policy makes
    # any future need a documented justification that revisits this
    # list first.
    { crate = "proc-macro1", reason = "malicious crate, 2026-08-20 Rust security response: build script downloads a payload" },
    { crate = "proc-macro-en", reason = "malicious crate, 2026-08-20 Rust security response: build script downloads a payload" },
    { crate = "aovine", reason = "malicious crate, 2026-08-20 Rust security response: build script downloads a payload" },
    { crate = "arone", reason = "malicious crate, 2026-08-20 Rust security response: build script downloads a payload" },
    { crate = "aronenao", reason = "malicious crate, 2026-08-20 Rust security response: build script downloads a payload" },
    { crate = "tinymember", reason = "malicious crate, 2026-08-20 Rust security response: build script downloads a payload" },
    { crate = "arrayref", reason = "benign crate, compromised account: the 2026-08-20 republish (0.3.10) carried the payload; whole-name tripwire, see the night-supply-1 note above" },
    { crate = "internment", reason = "benign crate, compromised account: the 2026-08-20 republish (0.8.7) carried the payload; whole-name tripwire, see the night-supply-1 note above" },
    { crate = "append-only-vec", reason = "benign crate, compromised account: the 2026-08-20 republish (0.1.9) carried the payload; whole-name tripwire, see the night-supply-1 note above" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
