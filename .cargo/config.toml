[build]
jobs = 4
rustflags = ["-C", "codegen-units=1"]

# Static binary configuration for musl target
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

# ── Native-CPU host build aliases (cosmostrix pro-native
# lineage) ────────────────────────────────────────────────────────────────
#
# Owner contract: `cargo pro-native-gnu` / `cargo pro-native-musl`
# compile for the host CPU (`-C target-cpu=native`) with dynamic
# linking (gnu/glibc) or static linking (musl) respectively. Both
# carry `--features ebpf` so the result is the full flagship binary
# (same feature set as the CI release build), not the ebpf-less dev
# shell. Separate profile names land the binaries in
# target/pro-native-gnu/zelynic and
# target/x86_64-unknown-linux-musl/pro-native-musl/zelynic so a
# native build never clobbers target/release/zelynic.
#
# Precedence note (verified live on cargo 1.98.1): target-level
# rustflags SHADOW build-level rustflags, so the musl alias must set
# target.x86_64-unknown-linux-musl.rustflags directly — passing only
# build.rustflags there would be silently ignored by the [target] block
# above. CLI --config rustflags are additionally CONCATENATED with the
# file's target rustflags (not replaced), so the file's +crt-static
# lands too; the alias carries both flags explicitly anyway so its
# native+static contract stays self-contained if the [target] block
# ever changes.
#
# aarch64 hosts: pro-native-gnu works as-is (host triple, dynamic);
# pro-native-musl is x86_64-only because cargo aliases cannot detect
# the host arch — mirror this block with the aarch64 target triple if
# a static aarch64 native build is ever needed.
#
# Prerequisites (one-time, NIGHT-host-1): both aliases carry
# --features ebpf, so the host needs the dated nightly pin +
# bpf-linker — ./scripts/bootstrap-ebpf.sh installs both (build.rs
# preflights them before any compile time is spent).
[alias]
pro-native-gnu = [
  "build",
  "--profile",
  "pro-native-gnu",
  "--features",
  "ebpf",
  "--config",
  "env.ZELYNIC_BUILD=\"local-native-gnu\"",
  "--config",
  "build.rustflags=[\"-C\",\"target-cpu=native\"]",
]
pro-native-musl = [
  "build",
  "--profile",
  "pro-native-musl",
  "--features",
  "ebpf",
  "--config",
  "env.ZELYNIC_BUILD=\"local-native-musl\"",
  "--config",
  "target.x86_64-unknown-linux-musl.rustflags=[\"-C\",\"target-cpu=native\",\"-C\",\"target-feature=+crt-static\"]",
  "--target",
  "x86_64-unknown-linux-musl",
]

# ── Arch-baseline release aliases (NIGHT-improve-22, cosmostrix
# pro-linux lineage) ──────────────────────────────────────────────────────
#
# Owner contract: `cargo pro-linux-gnu-v3` / `pro-linux-gnu-v4` /
# `pro-linux-musl-v3` / `pro-linux-musl-v4` compile the EXACT
# release shapes (release.yml builds v3 and v4 for both libc flavors;
# the native v1 baseline is retired from releases and stays a local
# dev-only build via the pro-native aliases above). Each alias
# carries `--features ebpf` (full flagship binary), its own profile
# so the four artifacts land in separate target dirs and never
# clobber each other or target/release/zelynic, and a ZELYNIC_BUILD
# label matching the release package suffix minus the leading
# "linux-" ("local-linux-gnu-v3" etc.), so `-V` names the shape the
# same way the release Build: line does.
#
# The gnu pair rides build.rustflags with the baseline -C
# target-cpu flag; the musl pair sets the target-level rustflags
# directly (the SHADOW rule documented above applies unchanged —
# the file's [target.x86_64-unknown-linux-musl] block would ignore
# build-level flags, and the CLI --config target rustflags are
# concatenated with that block's +crt-static, so carrying it
# explicitly here keeps each alias self-contained).
#
# build.rs already strips ANY target-cpu=/target-feature= token
# from the nested eBPF build's environment (NIGHT-hunt-28, the
# "invalid CPU znver3" family), so x86-64-v3/v4 never reach
# bpf-linker — the aliases work on any host CPU.
pro-linux-gnu-v3 = [
  "build",
  "--profile",
  "pro-linux-gnu-v3",
  "--features",
  "ebpf",
  "--config",
  "env.ZELYNIC_BUILD=\"local-linux-gnu-v3\"",
  "--config",
  "build.rustflags=[\"-C\",\"target-cpu=x86-64-v3\"]",
]
pro-linux-gnu-v4 = [
  "build",
  "--profile",
  "pro-linux-gnu-v4",
  "--features",
  "ebpf",
  "--config",
  "env.ZELYNIC_BUILD=\"local-linux-gnu-v4\"",
  "--config",
  "build.rustflags=[\"-C\",\"target-cpu=x86-64-v4\"]",
]
pro-linux-musl-v3 = [
  "build",
  "--profile",
  "pro-linux-musl-v3",
  "--features",
  "ebpf",
  "--config",
  "env.ZELYNIC_BUILD=\"local-linux-musl-v3\"",
  "--config",
  "target.x86_64-unknown-linux-musl.rustflags=[\"-C\",\"target-cpu=x86-64-v3\",\"-C\",\"target-feature=+crt-static\"]",
  "--target",
  "x86_64-unknown-linux-musl",
]
pro-linux-musl-v4 = [
  "build",
  "--profile",
  "pro-linux-musl-v4",
  "--features",
  "ebpf",
  "--config",
  "env.ZELYNIC_BUILD=\"local-linux-musl-v4\"",
  "--config",
  "target.x86_64-unknown-linux-musl.rustflags=[\"-C\",\"target-cpu=x86-64-v4\",\"-C\",\"target-feature=+crt-static\"]",
  "--target",
  "x86_64-unknown-linux-musl",
]
