# NIGHT-boost-10: build.jobs is deliberately UNSET (the old `jobs = 4`
# hardcode is gone). Cargo's default is machine detection — every
# logical core the host reports (nproc): a 4-core GitHub runner gets 4
# jobs, an 8-core workstation gets 8, maximum muscle per machine
# (cosmostrix lineage: the reference config pins no jobs either).
# A hardcoded number could only ever cap below the hardware — silent
# waste on every host with more cores than the constant.
#
# The one place parallelism IS capped on purpose is scripts/build.sh:
# its local heat cap (75% of cores, max 8) governs script-driven flows
# via the CARGO_BUILD_JOBS env var (env beats config), and CI lifts
# that cap with ZELYNIC_JOBS="$(nproc)" — the check job's boost-7
# invocation. Direct cargo invocations (dev builds, the CI build
# matrix, release builds) ride the machine-detected default above.
[build]
rustflags = ["-C", "codegen-units=1"]

# Static binary configuration for the musl targets — the ONLY libc
# shapes this project builds (night-dragon-maintenance-6: the gnu/
# glibc packaging is retired; every shipped binary is fully static).
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

# ── Native-CPU host build alias (cosmostrix pro-native
# lineage) ────────────────────────────────────────────────────────────────
#
# Owner contract: `cargo pro-native-musl` compiles for the host CPU
# (`-C target-cpu=native`) with static linking (musl, the only libc
# shape). It carries `--features ebpf` so the result is the full
# flagship binary (same feature set as the CI release build), not the
# ebpf-less dev shell. The separate profile name lands the binary in
# target/x86_64-unknown-linux-musl/pro-native-musl/zelynic so a native
# build never clobbers target/release/zelynic.
#
# night-dragon-maintenance-T1 (the owner's estate-wide build-label
# contract): every local alias build stamps the ALIAS NAME under the
# `local-` marker ("local-pro-native-musl"), so `zelynic -V` names
# the exact alias that produced the binary. The `pro-` prefix inside
# the label is the estate branding rule ("every build shape starts
# with pro-") applied to the label itself, not a second marker.
#
# Precedence note (verified live on cargo 1.98.1): target-level
# rustflags SHADOW build-level rustflags, so the musl alias must set
# target.x86_64-unknown-linux-musl.rustflags directly — passing only
# build.rustflags there would be silently ignored by the [target] block
# above. CLI --config rustflags are additionally CONCATENATED with the
# file's target rustflags (not replaced), so the file's +crt-static
# lands too; the alias carries both flags explicitly anyway so its
# native+static contract stays self-contained if the [target] block
# ever changes.
#
# aarch64 hosts: the alias is x86_64-only because cargo aliases cannot
# detect the host arch — mirror this block with the aarch64 target
# triple if a static aarch64 native build is ever needed.
#
# Prerequisites (one-time, NIGHT-host-1): the alias carries
# --features ebpf, so the host needs the dated nightly pin +
# bpf-linker — ./scripts/dev/bootstrap-ebpf.sh installs both (build.rs
# preflights them before any compile time is spent).
[alias]
pro-native-musl = [
  "build",
  "--profile",
  "pro-native-musl",
  "--features",
  "ebpf",
  "--config",
  "env.ZELYNIC_BUILD=\"local-pro-native-musl\"",
  "--config",
  "target.x86_64-unknown-linux-musl.rustflags=[\"-C\",\"target-cpu=native\",\"-C\",\"target-feature=+crt-static\"]",
  "--target",
  "x86_64-unknown-linux-musl",
]

# ── Arch-baseline release aliases (NIGHT-improve-22, cosmostrix
# pro-linux lineage; NIGHT-boost-30: names carry the arch) ──────
#
# Owner contract: `cargo pro-linux-amd64-v3-musl` /
# `pro-linux-amd64-v4-musl` compile the EXACT release shapes
# (release.yml builds v3 and v4, fully static musl — the only shapes
# that ship; the native v1 baseline is retired from releases and
# stays a local dev-only build via the pro-native alias above; the
# gnu pair is retired outright, night-dragon-maintenance-6). Each
# alias carries `--features ebpf` (full flagship binary), its own
# profile so the two artifacts land in separate target dirs and never
# clobber each other or target/release/zelynic, and a ZELYNIC_BUILD
# label that is the ALIAS NAME under the `local-` marker
# ("local-pro-linux-amd64-v3-musl" etc.), so `-V` names the shape the
# same way the release Build: line does, arch included — the
# pre-boost-30 labels (`local-linux-gnu-v3`) hid the arch and
# scrambled the platform id's token order, and the pre-T1 labels
# (`local-linux-amd64-v3-musl`) lacked the `pro-` brand rung the
# estate-wide label contract now carries on every shape.
#
# The aliases set the target-level rustflags directly (the SHADOW
# rule documented above applies — the file's
# [target.x86_64-unknown-linux-musl] block would ignore build-level
# flags, and the CLI --config target rustflags are concatenated with
# that block's +crt-static, so carrying it explicitly here keeps each
# alias self-contained).
#
# build.rs already strips ANY target-cpu=/target-feature= token
# from the nested eBPF build's environment (NIGHT-hunt-28, the
# "invalid CPU znver3" family), so x86-64-v3/v4 never reach
# bpf-linker — the aliases work on any host CPU.
pro-linux-amd64-v3-musl = [
  "build",
  "--profile",
  "pro-linux-amd64-v3-musl",
  "--features",
  "ebpf",
  "--config",
  "env.ZELYNIC_BUILD=\"local-pro-linux-amd64-v3-musl\"",
  "--config",
  "target.x86_64-unknown-linux-musl.rustflags=[\"-C\",\"target-cpu=x86-64-v3\",\"-C\",\"target-feature=+crt-static\"]",
  "--target",
  "x86_64-unknown-linux-musl",
]
pro-linux-amd64-v4-musl = [
  "build",
  "--profile",
  "pro-linux-amd64-v4-musl",
  "--features",
  "ebpf",
  "--config",
  "env.ZELYNIC_BUILD=\"local-pro-linux-amd64-v4-musl\"",
  "--config",
  "target.x86_64-unknown-linux-musl.rustflags=[\"-C\",\"target-cpu=x86-64-v4\",\"-C\",\"target-feature=+crt-static\"]",
  "--target",
  "x86_64-unknown-linux-musl",
]
