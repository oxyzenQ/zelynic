[package]
name = "zelynic"
version = "11.0.0-beta.2"
edition = "2021"
description = "Per-app network rate limiter and traffic monitor for Linux. Pure eBPF. Boring and silent but killer."
authors = ["rezky_nightky (oxyzenQ) <with dot rezky at gmail dot com>"]
license = "GPL-3.0-only"
repository = "https://github.com/oxyzenQ/zelynic"
readme = "README.md"
keywords = ["bandwidth", "network", "rate-limiter", "linux", "ebpf"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.98"
# NIGHT-improve-1 phase 3: this package is not publishable to
# crates.io — the ebpf feature builds BPF objects from the detached
# ebpf/ crate beside this manifest (driven by build.rs), and a
# package upload cannot carry that directory. Distribution is
# git checkouts and GitHub release tarballs (release.yml).
publish = false
# NIGHT-hunt-17 (cosmostrix Pattern C discipline): every .rs test file
# lives under the single top-level test/ tree. Autodiscovery of a
# Cargo tests/ directory is OFF, so the only test targets are the
# explicit [[test]] sections below — a stray tests/ directory can
# never silently re-enable the old layout.
autotests = false

[dependencies]
# Explicit feature set (cosmostrix contract): std + color + help + usage +
# error-context + suggestions are the exact default set, pinned explicitly
# so accidental default-feature additions cannot slip in. `color` feeds
# the brand-styled help/errors; `suggestions` feeds the did-you-mean tips.
# Dependency contract (NIGHT-hunt-6 strict supply-chain audit, 2026-09-18):
# every direct dependency below must have a live call-site justification
# recorded in docs/DEPENDENCY_AUDIT.md. Anything with zero call sites gets
# removed (chrono, 2026-09-18), feature lists get trimmed to the exact
# modules used (nix, 2026-09-18), and regressions are blocked in CI by
# the chrono ban in deny.toml (cargo deny check all).
clap = { version = "4", default-features = false, features = ["std", "color", "help", "usage", "error-context", "derive", "suggestions"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Minimal safe-syscall wrapper. Feature list is exactly what the source
# uses (NIGHT-hunt-6 trim; was process+fs+feature+user+signal+term):
#   user    -> nix::unistd::geteuid()   (capabilities/mod.rs, commands/mod.rs)
#   term    -> nix::sys::termios        (terminal/mod.rs raw mode)
#   feature -> nix::sys::utsname::uname (bpf_syscall.rs kernel check;
#              also a hard prerequisite of the `user` feature itself)
# Dropped: process (fork/exec/wait), fs (stat/at), signal (kill) — zero
# call sites each; enabling them compiled unused libc surface into every
# build.
nix = { version = "0.31", features = ["user", "term", "feature"] }
libc = "0.2"

# eBPF support (optional)
[dependencies.aya]
version = "0.13"
optional = true

# chrono dropped (Hinnant-style, NIGHT-hunt-6 2026-09-18; cosmostrix
# lineage — same drop, stronger case). Was: `chrono = { version = "0.4",
# default-features = false, features = ["clock"] }`. The `clock` feature
# dragged iana-time-zone + num-traits into the lockfile for ZERO
# production call sites — a grep for `chrono::` across src/, build.rs and
# the test tree returned nothing; the dep was pure supply-chain dead weight
# compiled into every build. Wall-clock formatting that would have needed
# it (the `Build-time:` stamp in `-V`) is computed by Howard Hinnant's
# civil_from_days algorithm directly in build.rs
# (http://howardhinnant.github.io/date_algorithms.html) — no time crate,
# std only. Re-adding chrono fails `cargo deny check all` in CI (deny.toml
# bans section).

[features]
default = []
ebpf = ["aya"]

# The one integration test target (NIGHT-hunt-17: the tree moved from
# tests/integration/ to test/integration/, and with autotests = false
# this declaration is the ONLY way cargo learns about it — an explicit
# contract instead of directory convention). Same single binary, same
# surface split, same `cargo test --test integration` invocation; the
# module files resolve relative to this path just as they did before.
[[test]]
name = "integration"
path = "test/integration/main.rs"

[profile.release]
# Maximum optimization for production binary
opt-level = 3
debug = false
strip = true        # Strip debug symbols → smaller binary
lto = "fat"         # Full LTO → best cross-crate optimization
codegen-units = 1   # Single codegen unit → best optimization
panic = "unwind"    # Must be unwind — aya BPF library can panic internally
                    # on map operations. With abort, serve child dies instantly.
overflow-checks = false
incremental = false

# Native-CPU host build profiles for the cargo aliases
# pro-native-gnu / pro-native-musl (see .cargo/config.toml [alias]).
# They inherit release unchanged — the only delta is the alias-injected
# `-C target-cpu=native` — so alias binaries are bit-for-bit the same
# optimization tier as release. Separate profile names exist so the
# binaries land in target/<profile>/ and never clobber
# target/release/zelynic (cosmostrix pro-native contract).
[profile.pro-native-gnu]
inherits = "release"

[profile.pro-native-musl]
inherits = "release"

# Arch-baseline release profiles for the cargo aliases
# pro-linux-amd64-v3-gnu / pro-linux-amd64-v4-gnu /
# pro-linux-amd64-v3-musl / pro-linux-amd64-v4-musl
# (NIGHT-improve-22; NIGHT-boost-30 renamed both the aliases and the
# profiles to carry the arch, matching the release matrix platform
# ids; see .cargo/config.toml [alias]). They inherit release
# unchanged — the only delta is the alias-injected
# -C target-cpu=x86-64-v3/v4 (plus +crt-static on the musl pair,
# mirroring the file's [target] block) — so alias binaries are
# bit-for-bit the same optimization tier as the release packages
# they reproduce. Separate profile names exist so the four artifacts
# land in target/<profile>/ (gnu) and
# target/x86_64-unknown-linux-musl/<profile>/ (musl) and never
# clobber each other or target/release/zelynic (cosmostrix
# pro-linux contract).
[profile.pro-linux-amd64-v3-gnu]
inherits = "release"

[profile.pro-linux-amd64-v4-gnu]
inherits = "release"

[profile.pro-linux-amd64-v3-musl]
inherits = "release"

[profile.pro-linux-amd64-v4-musl]
inherits = "release"
