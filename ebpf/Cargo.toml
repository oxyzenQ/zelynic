# Pure-Rust eBPF crate (NIGHT-improve-1, stage 2 + phase 2 + phase 3).
#
# Two binaries, one per production object:
#   zelynic-observer  — port of the former bpf/observer.bpf.c (stage 3)
#   zelynic-limiter   — port of the former bpf/limiter.bpf.c (phase 2)
#
# Phase 3 promoted this crate from research artifact to the production
# BPF source: the root build.rs drives a nested cargo build of this
# crate whenever the root `ebpf` feature is on, and the loaders embed
# the artifacts from OUT_DIR. The crate is STILL a detached workspace
# ON PURPOSE — the empty [workspace] table below keeps it outside the
# root package's build graph, so:
#   - the default stable-toolchain build (build.sh check-all, the 15
#     local gates) never enters the nightly path;
#   - the nested build compiles into its OWN target directory with no
#     lock contention with the root build;
#   - the bpfel -Z build-std cross-build (NIGHT-boost-38: the
#     repo-local bpfel-unknown-none.json spec clone with atomic-cas
#     enabled, plus -C target-cpu=v3 from .cargo/config.toml — the
#     SMP-safe token bucket in ebpf/src/math.rs needs the BPF_ATOMIC
#     RMW instructions; see docs/PURE_RUST_EVALUATION.md) can only be
#     reached deliberately, never as a side effect.
#
# The toolchain comes from THIS directory's rust-toolchain.toml (the
# dated nightly pin); any cargo with cwd inside ebpf/ resolves it
# automatically. Direct build (same thing build.rs drives):
#
#   cd ebpf && cargo build --release
#
# Edition 2024 matches the aya-ebpf 0.2.1 upstream pairing (the
# 2026-09 aya-template workspace). The crate is nightly-only by
# design and must never enter the root crate's rust-version-sync
# contract (gate 10 reads the ROOT manifest only).

[package]
name = "zelynic-ebpf"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aya-ebpf = "0.2.1"

[[bin]]
name = "zelynic-observer"
path = "src/main.rs"

# The limiter twin (NIGHT-improve-1, phase 2): port of
# bpf/limiter.bpf.c. A separate binary so each object file stays a
# self-contained, line-for-line mirror of its C twin — the two
# objects share no struct surface (observer: cgroup_stats/event,
# limiter: policy/bucket/limiter_stats), so a shared types crate
# would buy nothing (see the stage-2 blast-radius rationale).
[[bin]]
name = "zelynic-limiter"
path = "src/bin/limiter.rs"

[workspace]
